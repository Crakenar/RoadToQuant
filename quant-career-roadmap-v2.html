esearch Paper Replication ──</b>","How to read a quant paper efficiently: (1) abstract + conclusion first, (2) find the main results table, (3) read the data section (universe? period?), (4) read signal construction, (5) only then read the math. You can replicate most papers by following steps 1–4.","Fama-French factor construction: sort all stocks in June each year into 2×3 portfolios by size (Small/Big) and B/M ratio (Low/Medium/High). SMB = average of 3 Small portfolios − average of 3 Big portfolios (monthly). Use French's pre-computed data for verification.","Statistical validation: factor monthly Sharpe > 0.5, t-stat > 2.0 (minimum). Report regression table: α, β_mkt, β_smb, β_hml, t-stats, R² for CAPM vs FF3. Show R² increases when adding SMB and HML — this is the key result.","Replication sanity check: if your Sharpe is much higher than the original paper, something is wrong. Lookahead bias, survivorship bias, or data snooping inflate results. Replication should approximately match — not wildly beat — the original.","Publication-quality notebook: Jupyter with: data description, step-by-step factor construction with intermediate verification prints, regression tables formatted with tabulate, matplotlib charts with professional styling. README links to nbviewer render.","<b>Your portfolio after this roadmap:</b> (1) C++23 option pricing engine with benchmarks, (2) Python algorithmic trading bot running live on Alpaca paper, (3) Fama-French factor replication notebook. Three production-quality projects across Python and C++.","<b>GitHub portfolio hygiene:</b> Every repo needs: README with architecture diagram, build instructions (cmake + conan for C++, pip install -r requirements.txt for Python), benchmark table (latency numbers, throughput), CI badge. Pin your 3 best repos.","<b>CV reframing for QD applications:</b> 'Wigl crypto transaction API' → 'Real-time financial transaction processing API, 300ms p99 for 5,000+ record exports'. 'Reduced cron RAM by 50%' → 'Optimised scheduled financial data processing: 50% memory reduction, 30% throughput improvement'. Numbers + finance context.","<b>From your experience:</b> Your PreludeSDK open-source library is a genuine differentiator. Add a mention in your cover letter: 'Author of PreludeSDK, a PHP library deployed in production at BPS.' Open source authorship signals engineering maturity."],"terms":["vol-targeting","kill switch","pre-live checklist","slippage","signal-to-order latency","live Sharpe","backtest divergence","heartbeat","end-to-end latency","latency breakdown","RDTSC","stress test","load generator","error injection","fault tolerance","valgrind massif","memory leak","Fama-French","SMB","HML","portfolio sort","value-weighted","factor alpha","t-statistic","replication","overfitting check","nbviewer"],"p":"Complete Algorithmic Trading System + C++23 Event-Driven Trading System + Fama-French 3-Factor Replication","pd":"Using Kenneth French's free data library: replicate SMB and HML factors manually. Run FF3 regression for 10 stocks. Compare CAPM vs FF3: R² improvement, alpha reduction. Publish clean Jupyter notebook on GitHub with nbviewer link in README.","deliverables":["<b>Capstone I — Python Trading System:</b>","System running live for 2+ weeks with documented trade log","Performance report: live vs backtested Sharpe, CAGR, max drawdown, avg slippage","Architecture README: docker-compose up starts everything with one command","<b>Capstone II — C++23 Event-Driven System:</b>","Latency breakdown: per-stage µs values at p50/p99/p999","Stress test: stable at 1M ticks/sec for 60 minutes, zero memory growth","GitHub repo: CMakeLists.txt + README with Mermaid diagram + CI badge passing","<b>Capstone III — Research Paper Replication:</b>","Factor returns: correlation with French's pre-computed SMB/HML > 0.99","Side-by-side table: CAPM vs FF3 results for 10 stocks (R² improvement shown)","Interpretation: which stocks load heavily on HML (value) or SMB (small-cap)?"],"r":["📖 Algorithmic Trading – Ernest Chan","🌐 docs.alpaca.markets","📺 'Building a Trading Bot' (YouTube, multiple channels, compare approaches)","📖 Building Low Latency Applications with C++ – Sourav Ghosh","📺 CppCon 2023: C++ performance in trading systems (YouTube)","🌐 github.com/google/sanitizers (AddressSanitizer, ThreadSanitizer, valgrind)","🌐 mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html (free factor data)","📄 Fama & French 1993 (free on SSRN: search 'Fama French 1993 common risk factors')","📖 Expected Returns – Antti Ilmanen (comprehensive factor investing reference)"]},{"w":22,"title":"Interview Preparation — Tier 1 US Quant Dev Format","t":["<b style='color:#E05555'>⚡ DUAL TRACK — US Tier 1 + Amsterdam/Optiver:</b> From this week forward, you're preparing for TWO parallel targets. The interview prep below covers both. Key difference: Optiver Amsterdam interviews are heavily probability/math-focused (less C++ than Jane Street). IMC Chicago is more balanced. Citadel is most C++-heavy. Calibrate your prep time accordingly.","<b style='color:#00C47C'>🔗 getcracked.io — Quant Dev 250 (Premium):</b> 250 hand-curated interview questions and problems spread over 15 categories. 212 resources, 201 questions, 46 problems, 3 quizzes. This is purpose-built for exactly what you're preparing for. The $X investment is worth it — it's the most directly applicable resource for Optiver/IMC/Citadel technical screens. Use it as your primary prep material this week, supplemented by 'Heard on the Street'.","<b style='color:#00C47C'>🔗 getcracked.io — Quant Dev 250 categories to prioritize:</b> Based on what Optiver/IMC/Jane Street actually test: (1) Probability & statistics puzzles, (2) C++ systems questions, (3) Options & Greeks, (4) Market microstructure, (5) Risk measures. Do them in this order — probability is tested first in every Tier 1 screen.","<b style='color:var(--pc)'>📋 Week note: Tier 1 US quant dev interviews are different from standard SWE interviews. They include: probability puzzles, mental math, options theory, C++ deep dives, system design, and LeetCode Hard. You need to practice all of these, not just coding.</b>","<b style='color:var(--pc)'>── Interview Prep I — Probability & Brain Teasers ──</b>","Expected value problems: 'Roll two dice, what is P(sum=7)?' (6/36 = 1/6). 'Expected rolls until two consecutive 6s?' (42 — use Markov chain: states 0, 1-success, 2-success). Draw state diagrams for all recursive expected value problems.","Conditional probability: P(A|B) = P(A∩B)/P(B). Monty Hall: switching wins with prob 2/3 (simulate it in Python if you don't believe it). Birthday problem: P(shared birthday in group n) ≈ 1 − e^(−n²/730) for n < 60.","Martingale arguments: 'double your bet after each loss — does this beat the house?' No: unbounded capital required, optional stopping theorem prevents infinite doubling, house edge compounds. Know why martingales don't work in practice.","Fermi estimation: 'how many piano tuners in Chicago?' — population / household size / pianos per household / tuning frequency / time per tuning. Interviewers want structured reasoning, not the exact answer. Think out loud.","Card and coin problems: 'Deck of 52, expected cards drawn until first ace?' = 53/5 = 10.6. 'Unfair coin P(H)=p, how to generate fair outcomes?' (Von Neumann: flip twice, HT=heads, TH=tails, HH/TT=repeat). Know this trick.","<b style='color:var(--pc)'>── Interview Prep II — Technical Rounds ──</b>","Options theory questions: 'A stock goes to $110 or $90 with equal probability, r=0, what is the call price at K=$100?' (risk-neutral: p=0.5, call value = 0.5×$10 + 0.5×$0 = $5). 'What happens to all Greeks as vol → 0?' (Delta→step function, Gamma→spike, Vega→0). Know all boundary behaviors.","C++ technical questions: 'When do you need a virtual destructor?' (when deleting via base class pointer). 'What is undefined behavior?' (signed integer overflow, null dereference, use-after-free — list 5 examples). 'Difference between unique_ptr and shared_ptr?' These are real questions at trading firms.","Coding: common QD problems: implement SPSC ring buffer (yes, from memory), implement LRU cache (unordered_map + doubly-linked list, O(1) get/put), deserialize binary market data message. Practice until you can write these fluently in 20 minutes.","System design: 'Design a real-time risk system for 10,000 equity positions.' Cover: data model (position store), update path (market data → positions → PnL), latency target (< 10ms full reval), redundancy (active-passive failover). Think out loud.","Behavioral questions: 'Describe a performance optimization you made.' Give exact numbers: 'reduced p99 latency from 500µs to 45µs by replacing malloc with a pool allocator.' 'Tell me about a bug.' Walk through root cause, fix, and what you learned.","<b style='color:var(--pc)'>── Job Search Launch ──</b>","Target firms by tier: Tier 1 (hardest, best comp): Jane Street, Citadel Securities, Two Sigma, D.E. Shaw, Virtu, SIG. Tier 2: DRW, Jump Trading, Optiver, IMC, Akuna, Flow Traders. France/Europe: BNP Paribas CIB (Paris), SocGen Global Markets (Paris), Murex (trading software, Paris), Natixis CIB.","CV for QD roles: quantify everything. Not 'built a backtester' but 'built vectorized backtester: 52-week benchmark history processed in 0.3s.' Not 'implemented BS pricer' but 'C++23 BS batch pricer: 2M options/sec using AVX2.' Numbers signal seniority.","LinkedIn outreach: connect with QDs at target firms. Message: 'Hi [name], I am transitioning from web dev (Laravel) to quant development, working through a self-directed program. Would you be open to a 20-min coffee chat about your experience?' — genuine, concise, specific. 1 in 5 will respond.","Salary ranges in Europe (2025): junior QD Paris/London (0–2yr): €65–95K + bonus. Mid (2–5yr): €95–150K + bonus. Senior (5yr+): €150–220K + bonus. Prop shops (Optiver, IMC): significantly higher, larger bonus. Always negotiate — first offer is rarely the best.","Interview process timeline: coding screen (1hr, LeetCode medium) → technical phone (1hr, options theory + C++) → on-site (4–6hr: brainteasers, coding, system design, fit) → offer. Total: 2–6 weeks. Prepare for each stage explicitly.","<b>Tier 1 interview structure (typical):</b> Round 1 = coding screen (LeetCode Medium/Hard in C++, 1hr). Round 2 = probability/math phone screen (20-30 min, mental, no calculator). Round 3 = technical on-site (C++ deep dive + system design, 2-3hr). Round 4 = fit/culture. Total: 3-5 weeks.","<b>C++ questions to know cold:</b> When do you need a virtual destructor? What is undefined behaviour (give 5 examples)? Difference between unique_ptr and shared_ptr? What is false sharing? How does std::atomic work? Implement an SPSC queue from memory.","<b>Probability questions to know cold:</b> Expected rolls until two consecutive 6s (42, Markov chain). Monty Hall (switch wins 2/3). Birthday paradox formula. Gambler's ruin. Expected value of max of N dice rolls.","<b>Options theory questions:</b> What happens to all Greeks as vol→0? As T→0? If delta=0.5 and stock moves $2, what's the approximate option move? What is put-call parity and what arbitrage exists if violated?","<b>System design questions:</b> Design a real-time risk system for 10,000 equity positions. Design a market data feed handler for 500 symbols at 100k ticks/sec. Design an order management system. Always start with: data model → update path → latency requirements → failure modes.","<b>Target firms — realistic order:</b> Start with Tier 2 EU (BNP, SocGen, Murex) to get real QD experience on CV. Then target US Tier 2 (Akuna Capital, DRW, Jump Trading Chicago office). Then Tier 1 (Jane Street, Citadel, HRT, Two Sigma) after 1-2yr QD experience."],"terms":["expected value","conditional probability","Bayes theorem","Martingale","Markov chain","Fermi estimation","geometric distribution","optional stopping theorem","Greeks boundaries","undefined behavior","virtual destructor","LRU cache","SPSC","system design","latency target","redundancy","active-passive","behavioral STAR","Tier 1/2 firms","compensation structure","bonus","base salary","offer negotiation","recruiter","headhunter","referral","eFinancialCareers","coffee chat"],"p":"60-Problem Brainteaser Sprint + Mock Interview Gauntlet + Apply to 20 Positions","pd":"Polish CV with quantified metrics. Update LinkedIn: summary + skills + featured section linking top 2 GitHub repos. Apply to 20 QD positions (mix all tiers). Reach out to 5 QDs for coffee chats. Track all in a spreadsheet: company, role, status, contacts.","deliverables":["<b>Interview Prep I — Probability & Brain Teasers:</b>","60 problems solved and logged with time taken","Written clean solutions for all wrong answers — the learning happens here","Top 5 hardest problems: practice presenting solution verbally as if in an interview","<b>Interview Prep II — Technical Rounds:</b>","3 mock interviews recorded and self-reviewed with written critique","25 LeetCode mediums solved and categorized by pattern","30 theory questions answered fluently without notes or hesitation","<b>Job Search Launch:</b>","CV updated: every project has a quantitative metric (speed, accuracy, latency)","LinkedIn: featured section showing 2 GitHub repos with strong READMEs","Application tracker spreadsheet: 20 applications logged with next-action dates"],"r":["📖 'Heard on the Street' – Timothy Crack (essential, 20th edition)","📖 'A Practical Guide to Quant Finance Interviews' – Xinfeng Zhou (essential)","🌐 Glassdoor: search 'Quant Developer interview' + Jane Street/Citadel/Optiver","🌐 leetcode.com — focus 'Top Interview 150' medium level","🌐 Glassdoor: your target firm + 'Quant Developer' interview reviews","🌐 QuantFinanceInterviews.com (additional practice questions)","🌐 efinancialcareers.com — primary job board for quant roles","🌐 LinkedIn Jobs: 'Quant Developer' + Paris or London filter","🌐 wilmott.com — Wilmott Forums job board (community-driven, niche)","🌐 getcracked.io — Quant Dev 250 (Premium) — your primary interview prep resource","🌐 getcracked.io — C++ Concurrency track: complete any remaining questions"]}]},{"n":2,"c":"#FF6B35","d":"rgba(255,107,53,0.11)","title":"Phase 1B — Impressive Portfolio Projects","range":"Weeks 23–30  · ~8 weeks · Run in parallel with job search","desc":"Build-your-own-X style projects that demonstrate deep systems understanding. These are not tutorial projects — they are the kind of things that make a Tier 1 interviewer say 'wait, you built that from scratch?' Each project combines Python + C++ + real data into something genuinely impressive. Build these while job searching in Phase 2.","skills":["Build-Your-Own-X","Systems Programming","Multi-Service Architecture","C++23","Python","Real Data"],"weeks":[{"w":23,"title":"Project: Build Your Own Limit Order Book Engine","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A fully functional limit order book matching engine in C++23 — the core data structure of every exchange. Price-time priority matching, partial fills, order cancellation, market/limit/IOC/FOK order types. Then a Python client that streams orders and visualizes the book in real time.","<b>Why this is impressive:</b> Every trading firm uses an order book. Building one from scratch shows you understand: data structure design under latency constraints, price-time priority algorithms, the exact mechanics of how markets work. This is the kind of project that makes interviewers lean forward.","<b>C++ core — the matching engine:</b> Use two std::map<double, std::deque<Order>> structures (one for bids descending, one for asks ascending). Each price level is a queue of orders (time priority). Match: when bid >= best ask, execute. Partial fills: reduce quantities, keep remainder in book.","<b>Performance requirements:</b> > 5 million order events per second. < 1µs median matching latency. Use std::flat_map (C++23) instead of std::map for the price levels — 2-3× faster for the typical book depth of 10-50 levels. Benchmark with Google Benchmark.","<b>Python visualization layer:</b> ZeroMQ PUB from C++ engine → Python SUB subscriber. Python renders a live order book heatmap using matplotlib animation: bid depth (green bars) vs ask depth (red bars), with the mid-price line. Updates at 30fps.","<b>Multi-service architecture:</b> 3 processes communicating via ZeroMQ: (1) C++ matching engine (core), (2) Python order generator (sends random orders simulating market participants), (3) Python visualizer (subscribes to book updates, renders live). docker-compose.yml starts all 3.","<b>Extensions that make it exceptional:</b> Add ITCH 5.0 protocol parser (NASDAQ's binary market data format — publicly documented). This means your engine can consume real NASDAQ market data files. Add a simple market maker that quotes bid/ask and earns the spread. Log all fills to TimescaleDB.","<b>GitHub README must include:</b> Architecture diagram (Mermaid), benchmark numbers (orders/sec, matching latency p50/p99), screen recording of the live visualization, instructions to replay a real NASDAQ ITCH sample file."],"terms":["limit order book","price-time priority","partial fill","bid-ask spread","matching engine","ITCH protocol","market maker","order types","ZeroMQ","TimescaleDB"],"p":"Build Your Own Exchange Matching Engine","pd":"C++23 matching engine + Python visualization + ZeroMQ IPC + TimescaleDB logging + ITCH protocol parser. Full docker-compose setup. Benchmark: > 5M orders/sec, p99 latency < 5µs.","deliverables":["C++23 matching engine: price-time priority, 5 order types, > 5M events/sec","Python live order book visualization: ZeroMQ subscriber, matplotlib animation at 30fps","ITCH 5.0 parser: can replay real NASDAQ sample files into the engine","GitHub: Mermaid architecture diagram + benchmark table + screen recording GIF in README"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Database' section for inspiration","📄 NASDAQ ITCH 5.0 spec: nasdaqtrader.com/content/technicalsupport/specifications/dataproducts/NQTVITCHspecification.pdf (free)","🌐 1024cores.net — lock-free data structures for the hot path","📺 'How to Build a Matching Engine' — multiple YouTube talks by exchange engineers"],"code":"// C++23 Order Book — core data structures\n#include <map>\n#include <deque>\n#include <cstdint>\n#include <print>   // C++23\n#include <expected> // C++23\n\nenum class Side { Buy, Sell };\nenum class OrderType { Limit, Market, IOC, FOK };\n\nstruct Order {\n    uint64_t id;\n    Side     side;\n    double   price;\n    uint64_t quantity;\n    uint64_t timestamp_ns;\n};\n\nstruct Fill {\n    uint64_t buy_order_id;\n    uint64_t sell_order_id;\n    double   price;\n    uint64_t quantity;\n};\n\nclass OrderBook {\n    // Bids: highest price first (descending) — use std::greater\n    // Asks: lowest price first (ascending) — default\n    std::map<double, std::deque<Order>, std::greater<double>> bids_;\n    std::map<double, std::deque<Order>>                       asks_;\n\npublic:\n    // Returns list of fills generated by this order\n    std::vector<Fill> add_limit_order(Order order) {\n        std::vector<Fill> fills;\n\n        if (order.side == Side::Buy) {\n            // Match against asks: while order has qty and best ask <= our bid price\n            while (order.quantity > 0 && !asks_.empty()) {\n                auto& [ask_price, ask_queue] = *asks_.begin();\n                if (ask_price > order.price) break;  // No match\n\n                auto& resting = ask_queue.front();\n                uint64_t fill_qty = std::min(order.quantity, resting.quantity);\n\n                fills.push_back({order.id, resting.id, ask_price, fill_qty});\n                order.quantity   -= fill_qty;\n                resting.quantity -= fill_qty;\n\n                if (resting.quantity == 0) ask_queue.pop_front();\n                if (ask_queue.empty()) asks_.erase(asks_.begin());\n            }\n            if (order.quantity > 0)  // Remaining qty rests in book\n                bids_[order.price].push_back(order);\n        }\n        // Symmetric logic for Sell orders...\n        return fills;\n    }\n\n    // Best bid/ask\n    std::expected<double, std::string> best_bid() const {\n        if (bids_.empty()) return std::unexpected(\"Empty book\");\n        return bids_.begin()->first;\n    }\n    std::expected<double, std::string> best_ask() const {\n        if (asks_.empty()) return std::unexpected(\"Empty book\");\n        return asks_.begin()->first;\n    }\n\n    void print_top(int levels = 5) const {\n        std::println(\"=== ORDER BOOK TOP {} ===\", levels);\n        int i = 0;\n        for (auto& [price, queue] : asks_) {\n            if (i++ >= levels) break;\n            uint64_t total_qty = 0;\n            for (auto& o : queue) total_qty += o.quantity;\n            std::println(\"  ASK  {:.2f}  qty={}\", price, total_qty);\n        }\n        std::println(\"  ----  spread  ----\");\n        i = 0;\n        for (auto& [price, queue] : bids_) {\n            if (i++ >= levels) break;\n            uint64_t total_qty = 0;\n            for (auto& o : queue) total_qty += o.quantity;\n            std::println(\"  BID  {:.2f}  qty={}\", price, total_qty);\n        }\n    }\n};\n\nint main() {\n    OrderBook book;\n    uint64_t next_id = 1;\n\n    // Add some resting orders\n    book.add_limit_order({next_id++, Side::Sell, 100.50, 100, 1000});\n    book.add_limit_order({next_id++, Side::Sell, 100.25, 200, 1001});\n    book.add_limit_order({next_id++, Side::Buy,  100.00, 150, 1002});\n    book.add_limit_order({next_id++, Side::Buy,   99.75, 300, 1003});\n    book.print_top();\n\n    // Aggressive buy order — will match against asks\n    auto fills = book.add_limit_order({next_id++, Side::Buy, 100.30, 250, 1004});\n    std::println(\"\\nFills generated: {}\", fills.size());\n    for (auto& f : fills)\n        std::println(\"  Fill: {} @ {:.2f}  qty={}\", f.buy_order_id, f.price, f.quantity);\n\n    std::println(\"\\nAfter matching:\");\n    book.print_top();\n}\n// Compile: g++ -std=c++23 -O3 -march=native order_book.cpp -o order_book"},{"w":24,"title":"Project: Build Your Own Memory Allocator (Trading-Grade)","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A production-grade memory allocator specifically designed for trading systems in C++23. Three allocators: (1) Arena allocator (bulk allocate, bulk free — for per-request allocations), (2) Pool allocator (fixed-size objects, O(1) alloc/free — for order objects), (3) NUMA-aware allocator (allocates memory on the correct CPU socket). Benchmark against malloc/new.","<b>Why this is impressive:</b> Every HFT firm has custom memory allocators. malloc() can take 500ns-5µs (sometimes calls the kernel). A pool allocator takes 10-50ns. The difference directly translates to latency. Building your own shows you understand memory at the hardware level.","<b>Arena allocator — the simplest but most useful:</b> Pre-allocate a large slab (e.g. 64MB). Keep a pointer to the next free byte. allocate(N) = advance pointer by N bytes (1-2ns). reset() = move pointer back to start (0ns). Free individual allocations: impossible, but you don't need to in many trading scenarios (per-tick allocation cycle).","<b>Pool allocator — for fixed-size objects:</b> Pre-allocate N objects of size T. Free list = intrusive linked list through the free objects (uses the object memory itself for the next pointer). allocate() = pop from free list. deallocate() = push to free list. Both O(1) and ~10ns.","<b>NUMA awareness:</b> On multi-socket servers, accessing memory on a remote NUMA node costs 2-3× more than local memory. Use numa_alloc_onnode() to pin memory to the same socket as the thread. Check NUMA topology with hwloc library.","<b>Python benchmark harness:</b> Write a Python script that: starts the C++ allocator benchmark as a subprocess, captures output, generates a comparison chart (matplotlib bar chart: malloc vs arena vs pool vs NUMA-pool for p50/p99/p999 allocation latency). This combination of C++ performance + Python analysis tooling is exactly how real trading teams work.","<b>Integration with the order book (Project 1):</b> Replace all new/delete in the order book engine with the pool allocator for Order objects. Measure the end-to-end latency improvement. This shows you can integrate components into a larger system."],"terms":["arena allocator","pool allocator","NUMA","slab allocator","free list","memory fragmentation","huge pages","mmap","hwloc","jemalloc","tcmalloc"],"p":"Build Your Own Trading Memory Allocator","pd":"C++23 arena + pool + NUMA-aware allocators. Benchmark vs malloc/new/jemalloc. Integrate pool allocator into Project 1 order book. Python benchmark harness with matplotlib comparison charts. Blog post explaining the design decisions.","deliverables":["Arena allocator: allocate() < 5ns, reset() < 10ns, verified with Google Benchmark","Pool allocator: allocate() and deallocate() both O(1) < 20ns p99","Integration: order book with pool allocator shows measurable p99 latency improvement","Blog post: 'Why Trading Systems Don't Use malloc' — publish on dev.to or Medium"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Memory Allocator' section","📄 'malloc internals' — sourceware.org/glibc/wiki/MallocInternals (understand what you're replacing)","🌐 github.com/microsoft/mimalloc — Microsoft's fast allocator, read the source","📺 CppCon 2015: 'allocator is to allocation what vector is to vexation' (YouTube)"],"code":"// C++23 Pool Allocator — fixed-size object allocation in O(1)\n#include <cstddef>\n#include <cstdint>\n#include <cassert>\n#include <print>    // C++23\n#include <span>     // C++20\n#include <new>\n\ntemplate<typename T, std::size_t N>\nclass PoolAllocator {\n    // Each slot is either: a live T object, OR part of the free list\n    // We use a union so free slots store the next-free-pointer in the same memory\n    union Slot {\n        T       object;     // When allocated: the actual object\n        Slot*   next_free;  // When free: pointer to next free slot\n        Slot() {}           // Don't initialize — we manage this manually\n        ~Slot() {}          // Don't destroy — we manage this manually\n    };\n\n    // alignas(64) = place on its own cache line to avoid false sharing\n    alignas(64) Slot   storage_[N];   // Pre-allocated pool of N slots\n    alignas(64) Slot*  free_head_;    // Head of the free list\n    std::size_t        allocated_;    // How many objects currently alive\n\npublic:\n    PoolAllocator() : free_head_(nullptr), allocated_(0) {\n        // Build the free list: each slot points to the next\n        for (std::size_t i = 0; i < N - 1; ++i)\n            storage_[i].next_free = &storage_[i + 1];\n        storage_[N-1].next_free = nullptr;  // Last slot: end of list\n        free_head_ = &storage_[0];          // Start of free list\n    }\n\n    // Allocate one slot — O(1), ~10-15ns\n    template<typename... Args>\n    T* allocate(Args&&... args) {\n        if (!free_head_) return nullptr;   // Pool exhausted\n        Slot* slot = free_head_;\n        free_head_  = slot->next_free;     // Pop from free list\n        ++allocated_;\n        return new (&slot->object) T(std::forward<Args>(args)...);  // Placement new\n    }\n\n    // Deallocate one object — O(1), ~5-10ns\n    void deallocate(T* ptr) {\n        ptr->~T();                         // Explicitly call destructor\n        Slot* slot = reinterpret_cast<Slot*>(ptr);\n        slot->next_free = free_head_;      // Push back onto free list\n        free_head_ = slot;\n        --allocated_;\n    }\n\n    std::size_t size()     const { return allocated_; }\n    std::size_t capacity() const { return N; }\n    bool        full()     const { return allocated_ == N; }\n};\n\n// Example: Order object for the trading system\nstruct Order {\n    uint64_t id;\n    double   price;\n    uint64_t quantity;\n    char     side;     // 'B' or 'S'\n};\n\nint main() {\n    // Pre-allocate pool of 10,000 Order objects\n    // NO heap allocations during trading — everything from this pool\n    PoolAllocator<Order, 10000> pool;\n\n    std::println(\"Pool capacity: {}  allocated: {}\", pool.capacity(), pool.size());\n\n    // Allocate some orders\n    Order* o1 = pool.allocate(1ULL, 100.25, 500ULL, 'B');\n    Order* o2 = pool.allocate(2ULL, 100.50, 200ULL, 'S');\n    std::println(\"After 2 allocations: {}\", pool.size());\n    std::println(\"Order 1: id={} price={:.2f} qty={}\", o1->id, o1->price, o1->quantity);\n\n    // Fill and deallocate\n    pool.deallocate(o1);\n    std::println(\"After fill+dealloc: {}\", pool.size());\n\n    // The deallocated slot is immediately available for reuse\n    Order* o3 = pool.allocate(3ULL, 100.25, 100ULL, 'B');\n    std::println(\"Reused slot — o3 addr == o1 addr: {}\", (void*)o3 == (void*)o1);\n}\n// Compile: g++ -std=c++23 -O3 -march=native pool_allocator.cpp -o pool_alloc"},{"w":25,"title":"Project: Build Your Own In-Memory Market Data Store","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A simplified Redis-like in-memory key-value store in C++23, specialized for financial market data. Supports: GET/SET/DEL for tick data, time-series commands (TSADD, TSRANGE — like RedisTimeSeries), pub/sub for real-time tick distribution, and a custom binary wire protocol (faster than Redis's text-based RESP). Python client library included.","<b>Why this is impressive:</b> Redis is used everywhere in trading for: latest tick cache, position cache, signal distribution. Building your own shows you understand: hash table design, network server architecture, binary protocol design, and pub/sub patterns. It directly demonstrates the skills used in market data infrastructure.","<b>C++ server architecture:</b> Single-threaded event loop using epoll (Linux) for I/O multiplexing — same architecture as Redis itself. Each client connection = a file descriptor. epoll_wait() blocks until data arrives, then dispatches to handler. This handles thousands of connections with one thread and zero locking.","<b>Custom binary protocol (faster than RESP):</b> Redis uses text protocol (slow to parse). Design a binary protocol: [4-byte message length][1-byte command][payload]. Commands: 0x01=SET, 0x02=GET, 0x03=TSADD, 0x04=TSRANGE, 0x05=SUBSCRIBE, 0x06=PUBLISH. Fixed-size header = zero-copy parsing.","<b>Time-series data structure:</b> For each symbol, maintain a circular buffer of (timestamp_ns, bid, ask, last, volume) tuples. TSRANGE(symbol, t_start, t_end) = binary search to start, memcpy to output. This is what a minimal tick database looks like at the C++ level.","<b>Python client:</b> socket-based client that speaks your binary protocol. Exposes: client.set(key, value), client.get(key), client.tsadd(symbol, tick), client.tsrange(symbol, start, end), client.subscribe(symbols, callback). Async version using asyncio for the subscriber.","<b>Benchmark vs real Redis:</b> Your binary protocol + epoll server should beat Redis on throughput for fixed-size tick data because there's no RESP parsing overhead. Target: > 1M GET/SET operations per second on localhost. Compare with redis-benchmark.","<b>Integration project:</b> Connect your order book engine (Project 1) → your market data store. On each fill: update the 'last price' in the store. Python backtesting engine subscribes to price updates from the store. Three C++ and Python services working together."],"terms":["epoll","event loop","binary protocol","circular buffer","pub/sub","key-value store","time series","RESP protocol","zero-copy","I/O multiplexing"],"p":"Build Your Own Market Data In-Memory Store","pd":"C++23 epoll server + custom binary protocol + time-series circular buffers + pub/sub. Python async client. Benchmark > 1M ops/sec vs Redis. Integrate with Project 1 order book for live price updates.","deliverables":["C++23 server: epoll-based, handles 1000+ concurrent Python clients without threads","Binary protocol: parser implemented with zero dynamic allocation in the hot path","Time series: TSRANGE query on 1M ticks completes in < 1ms","Benchmark chart: your server vs Redis GET/SET throughput — document the difference"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Redis' and 'Build your own Database' sections","📺 'Build Your Own Redis' — CodeCrafters challenge (free first stages)","📖 'Redis in Action' — Josiah Carlson (understand what you're reimplementing)","📄 Redis source code: github.com/redis/redis/blob/unstable/src/ae.c (the epoll event loop)"],"code":"# Python async client for the custom market data store\nimport asyncio\nimport struct\nimport time\nfrom dataclasses import dataclass\nfrom typing import Callable, Optional\n\n# Wire protocol constants\nCMD_SET       = 0x01\nCMD_GET       = 0x02\nCMD_TSADD     = 0x03\nCMD_TSRANGE   = 0x04\nCMD_SUBSCRIBE = 0x05\nCMD_PUBLISH   = 0x06\n\n@dataclass\nclass Tick:\n    timestamp_ns: int\n    bid:          float\n    ask:          float\n    last:         float\n    volume:       int\n\nclass MarketDataClient:\n    \"\"\"\n    Async Python client for the C++ market data store.\n    Uses a custom binary protocol — much faster than Redis RESP for fixed-size tick data.\n    \"\"\"\n    def __init__(self, host=\"127.0.0.1\", port=7379):\n        self.host = host\n        self.port = port\n        self.reader: Optional[asyncio.StreamReader]  = None\n        self.writer: Optional[asyncio.StreamWriter]  = None\n\n    async def connect(self):\n        self.reader, self.writer = await asyncio.open_connection(self.host, self.port)\n\n    def _encode(self, cmd: int, payload: bytes) -> bytes:\n        \"\"\"Pack: [4-byte total length][1-byte command][payload]\"\"\"\n        total = 5 + len(payload)\n        return struct.pack(\">IB\", total, cmd) + payload\n\n    async def _send_recv(self, cmd: int, payload: bytes) -> bytes:\n        self.writer.write(self._encode(cmd, payload))\n        await self.writer.drain()\n        # Read response header\n        header = await self.reader.readexactly(4)\n        length = struct.unpack(\">I\", header)[0]\n        return await self.reader.readexactly(length - 4)\n\n    async def set(self, key: str, value: str) -> bool:\n        k = key.encode()\n        v = value.encode()\n        payload = struct.pack(\">HH\", len(k), len(v)) + k + v\n        resp = await self._send_recv(CMD_SET, payload)\n        return resp[0] == 0x00  # 0x00 = OK\n\n    async def get(self, key: str) -> Optional[str]:\n        k = key.encode()\n        payload = struct.pack(\">H\", len(k)) + k\n        resp = await self._send_recv(CMD_GET, payload)\n        if resp[0] == 0xFF:  # 0xFF = not found\n            return None\n        return resp[1:].decode()\n\n    async def tsadd(self, symbol: str, tick: Tick) -> bool:\n        \"\"\"Add a tick to the time series for symbol.\"\"\"\n        s = symbol.encode()\n        # Pack tick as fixed-size binary: 8+8+8+8+8 = 40 bytes\n        tick_bytes = struct.pack(\">Qdddd\",\n            tick.timestamp_ns, tick.bid, tick.ask, tick.last, tick.volume)\n        payload = struct.pack(\">H\", len(s)) + s + tick_bytes\n        resp = await self._send_recv(CMD_TSADD, payload)\n        return resp[0] == 0x00\n\n    async def tsrange(self, symbol: str, start_ns: int, end_ns: int) -> list[Tick]:\n        \"\"\"Fetch all ticks for symbol between start_ns and end_ns.\"\"\"\n        s = symbol.encode()\n        payload = struct.pack(\">HQQ\", len(s), start_ns, end_ns) + s\n        resp = await self._send_recv(CMD_TSRANGE, payload)\n        n_ticks = struct.unpack(\">I\", resp[:4])[0]\n        ticks = []\n        offset = 4\n        for _ in range(n_ticks):\n            ts, bid, ask, last, vol = struct.unpack_from(\">Qdddd\", resp, offset)\n            ticks.append(Tick(ts, bid, ask, last, vol))\n            offset += 40\n        return ticks\n\n\nasync def demo():\n    client = MarketDataClient()\n    await client.connect()\n\n    # Store some metadata\n    await client.set(\"AAPL:currency\", \"USD\")\n    await client.set(\"AAPL:lot_size\", \"100\")\n    print(\"Currency:\", await client.get(\"AAPL:currency\"))\n\n    # Stream ticks into the time series\n    now = time.time_ns()\n    for i in range(1000):\n        tick = Tick(\n            timestamp_ns = now + i * 1_000_000,  # 1ms apart\n            bid   = 150.00 + i * 0.01,\n            ask   = 150.05 + i * 0.01,\n            last  = 150.02 + i * 0.01,\n            volume = 100 + i\n        )\n        await client.tsadd(\"AAPL\", tick)\n\n    # Range query: last 500ms of ticks\n    ticks = await client.tsrange(\"AAPL\", now, now + 500_000_000)\n    print(f\"Retrieved {len(ticks)} ticks\")\n    print(f\"First: bid={ticks[0].bid:.2f}  Last: bid={ticks[-1].bid:.2f}\")\n\nif __name__ == \"__main__\":\n    asyncio.run(demo())"},{"w":26,"title":"Project: Build Your Own Quant Data Pipeline","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A production-grade financial data pipeline that would not look out of place at a real trading firm. 6 services, all orchestrated with docker-compose: (1) Market data ingester (Python, pulls from Polygon.io WebSocket), (2) Normalizer (C++23, cleans and validates), (3) Feature engine (Python, computes signals), (4) TimescaleDB (storage), (5) Redis cache (latest prices), (6) Grafana dashboard (live monitoring). All connected via ZeroMQ.","<b>Why this is impressive:</b> This is exactly the kind of system you'd build at a quant fund or trading firm. It's not a toy — it's a real architecture with real data, real services, and real monitoring. Your Laravel/NestJS background means you understand multi-service systems. This project shows you can build them in the quant context.","<b>Service 1 — Market Data Ingester (Python):</b> Connects to Polygon.io WebSocket (free tier available). Subscribes to real-time trades and quotes for a universe of 50 stocks. Normalizes to a common format: {symbol, timestamp_ns, bid, ask, last, volume, exchange}. Publishes to ZeroMQ PUB socket at > 10,000 messages/sec.","<b>Service 2 — C++ Normalizer / Validator:</b> Subscribes to raw ticks. Validates: price > 0, spread > 0, timestamp monotonically increasing per symbol, no stale prices (same price 3+ ticks). Flags anomalies. Publishes clean ticks downstream. < 1µs processing per tick.","<b>Service 3 — Python Feature Engine:</b> Subscribes to clean ticks. Maintains rolling windows (1min, 5min, 1hr OHLCV). Computes: momentum (1min return), vol ratio (1min realized vol / 1hr realized vol), spread (ask-bid), volume ratio (current / 20-day avg). Publishes feature vectors to TimescaleDB + Redis.","<b>Service 4+5 — TimescaleDB + Redis:</b> TimescaleDB stores tick history + feature history (partitioned by day). Continuous aggregates for OHLCV. Redis stores: latest tick per symbol, latest feature vector per symbol, current signals. Your PostgreSQL knowledge = you build this in 2 hours.","<b>Service 6 — Grafana Dashboard:</b> Prometheus metrics from all services (tick ingestion rate, feature computation latency, validation errors, DB write latency). Live charts: market data flow, feature distributions, any anomaly alerts. Your monitoring experience from Wigl health monitoring maps directly.","<b>Data quality monitoring — inspired by your BPS work:</b> Your Wigl experience with health monitoring (S3, Redis, database) maps directly. Add: data freshness alerts (symbol not seen in 30s = alert), spread anomaly detection (spread > 5× normal = flag), volume anomaly detection (volume > 10σ = flag).","<b>GitHub README structure:</b> (1) Architecture diagram with all 6 services and data flows. (2) 'docker-compose up' starts everything. (3) Screenshots of the Grafana dashboard. (4) Benchmark: end-to-end latency from WebSocket tick to TimescaleDB storage. (5) Data quality report from a 24hr run."],"terms":["data pipeline","multi-service","ZeroMQ","TimescaleDB","Redis","Grafana","Prometheus","Polygon.io","feature engineering","data quality","docker-compose","normalization"],"p":"Build Your Own Quant Data Pipeline","pd":"6-service docker-compose system: Python ingester + C++ validator + Python feature engine + TimescaleDB + Redis + Grafana. Real Polygon.io data. End-to-end latency monitoring. Data quality alerts. One-command startup.","deliverables":["docker-compose up starts all 6 services — zero manual configuration","End-to-end latency: WebSocket tick → TimescaleDB storage < 50ms p99","Grafana dashboard: 6+ panels, at least 2 alerting rules active","Data quality report: run for 24hrs, document anomalies detected and their causes"],"r":["🌐 polygon.io/docs/websocket — free tier WebSocket for real-time market data","🌐 github.com/zeromq/pyzmq — Python ZeroMQ bindings","🌐 docs.timescale.com/getting-started — your PostgreSQL knowledge applies directly","🌐 grafana.com/docs/grafana/latest — dashboard setup"],"code":"# Service 1: Market Data Ingester\n# Connects to Polygon.io WebSocket, normalizes ticks, publishes via ZeroMQ\n\nimport asyncio\nimport json\nimport time\nimport zmq\nimport zmq.asyncio\nimport websockets\nimport struct\nfrom dataclasses import dataclass\n\nPOLYGON_API_KEY = \"YOUR_KEY_HERE\"  # Free tier available at polygon.io\nSYMBOLS = [\"AAPL\",\"MSFT\",\"GOOGL\",\"AMZN\",\"NVDA\",\"META\",\"TSLA\",\"JPM\",\"V\",\"SPY\"]\n\n@dataclass\nclass NormalizedTick:\n    symbol:       str\n    timestamp_ns: int\n    bid:          float\n    ask:          float\n    last:         float\n    volume:       int\n    exchange:     str\n\n    def to_bytes(self) -> bytes:\n        \"\"\"Pack to fixed binary format for ZeroMQ — no JSON serialization overhead.\"\"\"\n        sym = self.symbol.encode().ljust(8)[:8]  # Fixed 8-byte symbol\n        exc = self.exchange.encode().ljust(4)[:4]\n        return struct.pack(\">8sQdddi4s\",\n            sym, self.timestamp_ns,\n            self.bid, self.ask, self.last, self.volume, exc)\n\n    @classmethod\n    def from_bytes(cls, data: bytes) -> \"NormalizedTick\":\n        sym, ts, bid, ask, last, vol, exc = struct.unpack(\">8sQdddi4s\", data)\n        return cls(sym.decode().strip(), ts, bid, ask, last, vol, exc.decode().strip())\n\n\nclass MarketDataIngester:\n    def __init__(self, zmq_endpoint=\"tcp://0.0.0.0:5555\"):\n        ctx = zmq.asyncio.Context()\n        self.pub = ctx.socket(zmq.PUB)\n        self.pub.bind(zmq_endpoint)\n        self.tick_count = 0\n        self.start_time = time.time()\n\n    async def run(self):\n        uri = f\"wss://delayed.polygon.io/stocks\"  # delayed = free tier\n        async with websockets.connect(uri) as ws:\n            # Authenticate\n            await ws.send(json.dumps({\"action\":\"auth\",\"params\":POLYGON_API_KEY}))\n            auth_resp = await ws.recv()\n            print(\"Auth:\", auth_resp)\n\n            # Subscribe to trades and quotes\n            symbols_str = \",\".join(f\"T.{s}\" for s in SYMBOLS)  # T.* = trades\n            await ws.send(json.dumps({\"action\":\"subscribe\",\"params\":symbols_str}))\n\n            async for message in ws:\n                events = json.loads(message)\n                for event in events:\n                    tick = self._normalize(event)\n                    if tick:\n                        self._publish(tick)\n\n    def _normalize(self, event: dict) -> NormalizedTick | None:\n        \"\"\"Convert Polygon event to normalized tick.\"\"\"\n        ev = event.get(\"ev\", \"\")\n        if ev == \"T\":  # Trade event\n            return NormalizedTick(\n                symbol       = event[\"sym\"],\n                timestamp_ns = event[\"t\"] * 1_000_000,  # ms -> ns\n                bid          = event.get(\"bp\", 0.0),\n                ask          = event.get(\"ap\", 0.0),\n                last         = event[\"p\"],\n                volume       = event[\"s\"],\n                exchange     = str(event.get(\"x\", 0)),\n            )\n        return None\n\n    def _publish(self, tick: NormalizedTick):\n        \"\"\"Publish tick via ZeroMQ PUB — topic = symbol for subscriber filtering.\"\"\"\n        topic = tick.symbol.encode()           # Subscribers filter by symbol\n        self.pub.send_multipart([topic, tick.to_bytes()], zmq.NOBLOCK)\n        self.tick_count += 1\n        if self.tick_count % 10_000 == 0:\n            elapsed = time.time() - self.start_time\n            print(f\"Ingested {self.tick_count:,} ticks  ({self.tick_count/elapsed:.0f}/sec)\")\n\n\nif __name__ == \"__main__\":\n    ingester = MarketDataIngester()\n    asyncio.run(ingester.run())"},{"w":27,"title":"Project: Build Your Own Neural Network from Scratch (for Alpha)","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A neural network implemented from scratch in NumPy (no PyTorch, no TensorFlow) trained to predict short-term stock returns. Then the same network reimplemented in C++23 for production inference (< 1µs per prediction). The combination of 'I understand the math deeply enough to implement from scratch' + 'I can deploy it at trading-system latency' is genuinely rare.","<b>Why this is impressive:</b> Anyone can call model.fit(). Building backpropagation from scratch with NumPy shows you understand: forward pass (matrix multiply + activation), loss computation, backward pass (chain rule applied to matrices), weight update (gradient descent). This is the kind of depth Tier 1 interviewers probe for.","<b>Python from-scratch implementation:</b> Implement: Layer class (weights W, bias b, activation), Network class (list of layers), forward() (matrix multiply through all layers), backward() (backprop with chain rule), train() (mini-batch gradient descent). No PyTorch allowed. Pure NumPy.","<b>Architecture for stock return prediction:</b> Input: 20 features (momentum at 5 lags, vol ratios, spread, volume features). Hidden: 64→32→16 neurons with ReLU. Output: 1 neuron with tanh (predicts return direction, range -1 to +1). Train with purged cross-validation (not standard k-fold — that leaks future data).","<b>C++23 inference engine:</b> Export trained weights as binary file. C++ loads weights at startup. forward() = sequence of matrix multiplies (use Eigen) + activation functions. Target: < 500ns per prediction for a 20→64→32→16→1 network. This is fast enough for signal computation in a trading loop.","<b>Mathematical foundation to implement:</b> Forward: z = W×x + b, a = ReLU(z). Loss: MSE = (1/N)Σ(y_pred - y_true)². Backward: ∂L/∂W = (1/N) × δ × x^T where δ propagates backward via chain rule. Weight update: W = W - α×∂L/∂W. Implement each step as a separate function with clear variable names.","<b>Honest backtesting:</b> Use purged walk-forward CV. Report: directional accuracy (> 52% is useful), information coefficient (Pearson correlation of predicted vs actual returns), Sharpe of signal. Don't overfit — use dropout (also implement from scratch) and L2 regularization.","<b>Integrate with the pipeline:</b> The C++ inference engine subscribes to features from Project 4's feature engine via ZeroMQ. On each new feature vector, runs forward pass in < 500ns, publishes signal to a signal ZeroMQ topic. The full system: market data → features → ML signal → (next: order generation)."],"terms":["backpropagation","chain rule","gradient descent","ReLU","dropout","L2 regularization","information coefficient","purged CV","forward pass","weight matrix","Eigen","inference latency"],"p":"Build Your Own Neural Network + C++ Inference Engine","pd":"NumPy neural network from scratch (no PyTorch) trained on stock features. C++23 inference engine using Eigen. < 500ns per prediction. Integrated into Project 4 pipeline via ZeroMQ. Honest backtesting with purged CV.","deliverables":["NumPy NN: forward + backward + train implemented from scratch, no ML libraries","Directional accuracy > 51.5% on out-of-sample data (better than random)","C++23 inference engine: < 500ns per prediction, verified with Google Benchmark","Full pipeline integration: feature vector in → signal out via ZeroMQ in < 1ms end-to-end"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Neural Network' section","📺 Andrej Karpathy — 'micrograd' YouTube series (building backprop from scratch, the best resource)","🌐 eigen.tuxfamily.org — Eigen C++ matrix library for the inference engine","📖 'Advances in Financial ML' — López de Prado, Ch.7 (feature importance) + Ch.12 (purged CV)"],"code":"# Build Your Own Neural Network from scratch — NumPy only\nimport numpy as np\nfrom typing import Optional\n\n# ── Activation functions ───────────────────────────────────────────────────────\ndef relu(x):      return np.maximum(0, x)\ndef relu_grad(x): return (x > 0).astype(float)  # derivative of ReLU\ndef tanh(x):      return np.tanh(x)\ndef tanh_grad(x): return 1 - np.tanh(x)**2       # derivative of tanh\n\n\nclass Layer:\n    \"\"\"Single fully-connected layer with activation.\"\"\"\n    def __init__(self, n_in: int, n_out: int, activation=\"relu\"):\n        # He initialization: scale by sqrt(2/n_in) — works well with ReLU\n        self.W = np.random.randn(n_in, n_out) * np.sqrt(2.0 / n_in)\n        self.b = np.zeros(n_out)\n        self.activation = activation\n        # Cache for backprop\n        self.x: Optional[np.ndarray] = None  # input to this layer\n        self.z: Optional[np.ndarray] = None  # pre-activation\n        self.a: Optional[np.ndarray] = None  # post-activation (output)\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        self.x = x\n        self.z = x @ self.W + self.b     # (batch, n_out)\n        if self.activation == \"relu\":\n            self.a = relu(self.z)\n        elif self.activation == \"tanh\":\n            self.a = tanh(self.z)\n        else:  # linear\n            self.a = self.z\n        return self.a\n\n    def backward(self, d_out: np.ndarray) -> np.ndarray:\n        \"\"\"d_out: gradient from the next layer. Returns gradient for previous layer.\"\"\"\n        if self.activation == \"relu\":\n            d_z = d_out * relu_grad(self.z)   # chain rule through activation\n        elif self.activation == \"tanh\":\n            d_z = d_out * tanh_grad(self.z)\n        else:\n            d_z = d_out\n\n        # Gradients for weights and bias\n        self.dW = self.x.T @ d_z / len(self.x)   # (n_in, n_out)\n        self.db = d_z.mean(axis=0)                # (n_out,)\n        # Gradient to pass to previous layer\n        return d_z @ self.W.T                     # (batch, n_in)\n\n    def update(self, lr: float, l2: float = 0.0):\n        self.W -= lr * (self.dW + l2 * self.W)   # L2 regularization\n        self.b -= lr * self.db\n\n\nclass NeuralNetwork:\n    \"\"\"Multi-layer neural network for stock return prediction.\"\"\"\n    def __init__(self, layer_sizes: list[int], activations: list[str]):\n        assert len(layer_sizes) == len(activations) + 1\n        self.layers = [\n            Layer(layer_sizes[i], layer_sizes[i+1], activations[i])\n            for i in range(len(activations))\n        ]\n\n    def forward(self, X: np.ndarray) -> np.ndarray:\n        out = X\n        for layer in self.layers:\n            out = layer.forward(out)\n        return out\n\n    def mse_loss(self, y_pred: np.ndarray, y_true: np.ndarray) -> float:\n        return ((y_pred - y_true) ** 2).mean()\n\n    def backward(self, y_pred: np.ndarray, y_true: np.ndarray):\n        # Gradient of MSE loss w.r.t. predictions\n        d_out = 2 * (y_pred - y_true) / len(y_true)\n        for layer in reversed(self.layers):\n            d_out = layer.backward(d_out)\n\n    def train_epoch(self, X: np.ndarray, y: np.ndarray,\n                    lr=0.001, batch_size=64, l2=1e-4) -> float:\n        indices = np.random.permutation(len(X))\n        total_loss = 0.0\n        n_batches = 0\n        for i in range(0, len(X), batch_size):\n            batch_idx = indices[i:i+batch_size]\n            Xb, yb   = X[batch_idx], y[batch_idx]\n            y_pred   = self.forward(Xb)\n            total_loss += self.mse_loss(y_pred, yb)\n            self.backward(y_pred, yb.reshape(-1, 1))\n            for layer in self.layers:\n                layer.update(lr, l2)\n            n_batches += 1\n        return total_loss / n_batches\n\n\n# ── Quick demo ─────────────────────────────────────────────────────────────────\nif __name__ == \"__main__\":\n    np.random.seed(42)\n    # Architecture: 20 features → 64 → 32 → 16 → 1 output\n    net = NeuralNetwork(\n        layer_sizes  = [20, 64, 32, 16, 1],\n        activations  = [\"relu\", \"relu\", \"relu\", \"tanh\"]\n    )\n\n    # Fake financial features (replace with real features from Project 4)\n    X_train = np.random.randn(10000, 20)  # 10k training samples, 20 features\n    y_train = np.random.randn(10000)      # target: next 5-min return\n\n    print(\"Training from scratch — no PyTorch, no TensorFlow, pure NumPy:\")\n    for epoch in range(10):\n        loss = net.train_epoch(X_train, y_train, lr=0.001, batch_size=256)\n        if epoch % 2 == 0:\n            print(f\"  Epoch {epoch:2d}  MSE loss: {loss:.6f}\")\n\n    # Inference\n    X_test  = np.random.randn(5, 20)\n    signals = net.forward(X_test)\n    print(\"\\nSignals for 5 test samples (tanh output, range -1 to +1):\")\n    for i, s in enumerate(signals):\n        direction = \"BUY\" if s[0] > 0.05 else \"SELL\" if s[0] < -0.05 else \"FLAT\"\n        print(f\"  Sample {i+1}: signal={s[0]:+.4f}  → {direction}\")"},{"w":28,"title":"Project: Full Algorithmic Trading System — All Services","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> The mega-project that combines everything: order book engine (P1) + memory allocator (P2) + market data store (P3) + data pipeline (P4) + neural network inference (P5) + a new execution layer + risk management. 8+ services, docker-compose, full CI/CD pipeline, live paper trading on Alpaca. This is a senior QD's portfolio piece.","<b>Why this is the most impressive thing on your CV:</b> Almost no self-taught candidates build a multi-service trading system that actually runs. Combined with your C++ pricing engine from Phase 1 Week 15, you have two substantial systems projects in two different languages. Tier 1 interviewers will spend 30 minutes on this.","<b>New components to add:</b> (1) Risk manager service (Python): monitors positions, enforces limits, sends kill switch signal via ZeroMQ. (2) Execution service (Python + Alpaca): receives signals, applies position sizing, sends orders. (3) PnL tracker (Python): marks positions to market, computes realized/unrealized PnL in real time. (4) Strategy orchestrator (Python): manages multiple concurrent strategies, allocates capital.","<b>Full data flow (8 services):</b> Polygon WebSocket → [ZeroMQ] → C++ normalizer → [ZeroMQ] → Feature engine → [ZeroMQ] → ML inference → [ZeroMQ] → Risk manager → [ZeroMQ] → Execution → Alpaca API → Fills → [ZeroMQ] → PnL tracker → TimescaleDB + Grafana.","<b>Risk management (inspired by your Wigl payment flow work):</b> Your experience handling critical payment flows, webhook processing, and production incidents is directly applicable. The kill switch = your emergency payment halt. Position limits = your transaction limits. Daily loss limit = your compliance rules. Same patterns, different domain.","<b>CI/CD pipeline:</b> GitHub Actions: on push → build C++ (cmake), run C++ unit tests (Google Test), run Python tests (pytest), build all Docker images, push to registry, deploy to staging environment (docker-compose on a DigitalOcean droplet). Green badge = production-ready.","<b>Monitoring you'd be proud of:</b> Grafana dashboard with: (1) live PnL curve, (2) position heatmap by symbol, (3) signal distribution (is the ML model generating meaningful signals?), (4) execution latency p99, (5) data pipeline health (ticks/sec per symbol), (6) risk utilization (current exposure / limit). Alert rules: daily loss > 1%, signal drift detected, any service heartbeat missing.","<b>Run it for 2 weeks on Alpaca paper:</b> After 2 weeks, write a performance report: actual vs backtested Sharpe, slippage analysis (signal price vs fill price), capacity analysis (how much capital could this strategy run?), lessons learned. This report is an interview talking point."],"terms":["multi-service architecture","execution layer","PnL attribution","kill switch","position sizing","slippage","capacity analysis","CI/CD","staging environment","heartbeat monitoring"],"p":"Full Algorithmic Trading System — Mega Capstone","pd":"8+ service docker-compose trading system. Real Polygon.io data. Alpaca paper trading. 2-week live run with performance report. Full CI/CD pipeline. Grafana monitoring dashboard. This is your #1 portfolio piece.","deliverables":["docker-compose up starts all 8+ services — zero manual steps","GitHub Actions CI: C++ tests + Python tests + Docker build all green","2-week Alpaca paper trading log: every trade with signal, fill price, slippage","Performance report: live vs backtested Sharpe, slippage analysis, lessons learned"],"r":["📖 'Algorithmic Trading' — Ernest Chan (practical implementation guide)","🌐 docs.alpaca.markets — paper trading API reference","🌐 docs.github.com/en/actions — GitHub Actions for the CI/CD pipeline","📺 'System Design for Trading Systems' — multiple CppCon talks (YouTube)"]},{"w":29,"title":"Project: Build Your Own Distributed Risk System","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A distributed real-time risk aggregation system in C++23. Multiple risk nodes each handle a subset of positions. A coordinator node aggregates totals. All nodes communicate via a custom binary protocol over UDP multicast. Fault tolerance: if one node dies, the coordinator detects it via heartbeat and redistributes its positions. This is the architecture of real bank risk systems.","<b>Why this is impressive:</b> Distributed systems are the hardest engineering challenge. Building one that handles financial positions, with fault tolerance and consistency guarantees, shows principal-engineer level thinking. The 'Build Your Own Distributed System' from the repo is your reference — adapt it for the financial context.","<b>Architecture:</b> 1 Coordinator + N Worker nodes (N=3 for demo). Each Worker handles 1/N of the position universe. Workers compute Greeks (delta, gamma, vega) for their positions using QuantLib. Coordinator aggregates: total_delta = Σ(worker_deltas). All communication: UDP multicast for efficiency + heartbeat for fault detection.","<b>Consistency challenge:</b> When Worker 2 fails mid-aggregation, the Coordinator must: detect failure (heartbeat timeout), mark affected positions as stale, redistribute positions to remaining workers, reaggregate with fresh data. No position should be double-counted or missed.","<b>C++23 features used:</b> std::jthread for worker threads, std::atomic for heartbeat timestamps, std::expected for network operation results, std::flat_map for position storage, std::mdspan for the Greeks matrix, std::print for structured logging.","<b>Python monitoring client:</b> Subscribes to aggregated risk metrics. Displays: total portfolio delta, gamma, vega in real time. Alerts when: any Greek exceeds a limit, a worker node goes offline, reaggregation takes > 100ms.","<b>Benchmark:</b> Measure full aggregation latency (all workers compute → coordinator aggregates → result available) as a function of N positions. Target: < 10ms for 10,000 positions across 3 workers. Compare to a single-node baseline."],"terms":["distributed systems","fault tolerance","UDP multicast","heartbeat","position reaggregation","consistency","coordinator pattern","worker sharding","Greeks aggregation"],"p":"Build Your Own Distributed Risk Aggregator","pd":"C++23 distributed risk system: coordinator + 3 workers + UDP multicast + heartbeat + fault tolerance. Python monitoring client. Benchmark: < 10ms full aggregation for 10k positions. Worker failure recovery tested and documented.","deliverables":["Coordinator + 3 workers running: full aggregation < 10ms for 10k positions","Fault tolerance: kill a worker → coordinator detects in < 1s → reaggregates correctly","No double-counting: verify position totals match single-node baseline exactly","Python dashboard: real-time Greeks display + worker health indicators"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Distributed Systems' section","📖 'Designing Data-Intensive Applications' — Kleppmann (the distributed systems bible)","📺 MIT 6.824 Distributed Systems lectures (free on YouTube) — Raft consensus, fault tolerance","🌐 quantlib.org/reference — QuantLib for Greeks computation in each worker"]},{"w":30,"title":"Project: Build Your Own Trading Terminal (CLI)","t":["<b style='color:var(--pc)'>🏗️ What you're building:</b> A Bloomberg Terminal-lite in your terminal. A Python TUI (Terminal User Interface) using the 'textual' library that shows: live prices from your market data store (Project 3), current positions and PnL from your trading system (Project 6), Greeks from your risk system (Project 7), and lets you place orders manually. All in a split-pane terminal interface that actually looks impressive in a screen recording.","<b>Why this is the perfect finishing project:</b> It ties all previous projects together into one visual interface. It demonstrates end-to-end system design. And a screen recording of it running — live prices updating, PnL ticking, order book depth rendering — makes an incredible GitHub README GIF.","<b>Panels to implement:</b> (1) Market data: live bid/ask/last/volume for your universe, color-coded green/red for up/down. (2) Order book: top 5 levels bid/ask, updates in real time from Project 1. (3) Positions: current holdings, unrealized PnL, delta per position. (4) Greeks summary: total portfolio delta/gamma/vega with limit bars. (5) Trade blotter: last 20 fills with timestamp/symbol/side/qty/price/PnL. (6) Risk alerts: any limit breach highlighted in red.","<b>Command interface:</b> Bottom input bar: type 'BUY AAPL 100 LIMIT 150.50' to place an order to your execution engine. 'CANCEL 12345' to cancel. 'PNL' to show daily summary. 'QUIT' to exit cleanly (graceful shutdown of all ZeroMQ connections).","<b>Technical implementation:</b> Python textual framework for TUI. ZeroMQ SUB sockets for live data feeds from all other services. asyncio for concurrent panel updates without blocking the UI. Reconnection logic for each ZeroMQ socket (exponential backoff — your NestJS websocket reconnect experience).","<b>From your experience:</b> Your Laravel Nova admin dashboards (compliance, accounting, marketing stats) are direct experience in building data display interfaces. This is the same problem in a terminal instead of a browser. Your instinct for 'what information does the user need to see' applies directly.","<b>The GitHub README GIF:</b> Use asciinema or screen recording to capture 30 seconds of the terminal running with live data. Embed in README. This single GIF, showing prices ticking, an order being placed, PnL updating — is worth more than 1,000 words of description for anyone evaluating your GitHub."],"terms":["TUI","textual","asyncio","split-pane","trade blotter","Greeks dashboard","asciinema","order placement","graceful shutdown"],"p":"Build Your Own Trading Terminal (CLI TUI)","pd":"Python textual TUI with 6 panels: live prices, order book, positions, Greeks, trade blotter, risk alerts. ZeroMQ integration to all previous projects. Order placement via command input. Asciinema recording in GitHub README.","deliverables":["6-panel TUI updating in real time from live ZeroMQ feeds","Order placement: 'BUY AAPL 100 LIMIT 150.50' routes to execution engine","Graceful shutdown: Ctrl+C cleanly closes all connections, logs exit","GitHub README: asciinema/GIF recording showing live data and order placement"],"r":["🌐 github.com/codecrafters-io/build-your-own-x — 'Build your own Command-Line Tool' section","🌐 textual.textualize.io — Python TUI framework (beautiful, well-documented)","🌐 asciinema.org — record your terminal for the GitHub README","📺 Textual official tutorials on YouTube — getting started with panels and layouts"],"code":"# Trading Terminal TUI — main layout\n# pip install textual pyzmq\n\nfrom textual.app import App, ComposeResult\nfrom textual.widgets import Header, Footer, DataTable, Label, Input, Static\nfrom textual.containers import Horizontal, Vertical\nfrom textual import events\nimport zmq\nimport zmq.asyncio\nimport asyncio\nimport struct\nfrom datetime import datetime\n\n\nclass PricePanel(Static):\n    \"\"\"Live bid/ask/last prices for the universe.\"\"\"\n    DEFAULT_CSS = \"PricePanel { border: solid green; height: 1fr; }\"\n\n    def compose(self) -> ComposeResult:\n        yield Label(\"📈 MARKET DATA\", id=\"price-header\")\n        yield DataTable(id=\"price-table\")\n\n    def on_mount(self):\n        table = self.query_one(\"#price-table\", DataTable)\n        table.add_columns(\"Symbol\", \"Bid\", \"Ask\", \"Last\", \"Change%\")\n        self.set_interval(0.1, self.refresh_prices)  # 10fps update\n\n    def refresh_prices(self):\n        # In real implementation: receive from ZeroMQ market data store\n        pass\n\n\nclass PositionPanel(Static):\n    \"\"\"Current positions and unrealized PnL.\"\"\"\n    DEFAULT_CSS = \"PositionPanel { border: solid blue; height: 1fr; }\"\n\n    def compose(self) -> ComposeResult:\n        yield Label(\"💼 POSITIONS & PnL\")\n        yield DataTable(id=\"position-table\")\n\n    def on_mount(self):\n        table = self.query_one(\"#position-table\", DataTable)\n        table.add_columns(\"Symbol\", \"Qty\", \"AvgCost\", \"Last\", \"UnrealPnL\", \"Delta\")\n\n\nclass GreeksPanel(Static):\n    \"\"\"Aggregated portfolio Greeks from risk system.\"\"\"\n    DEFAULT_CSS = \"GreeksPanel { border: solid yellow; height: 1fr; }\"\n\n    def compose(self) -> ComposeResult:\n        yield Label(\"🔢 PORTFOLIO GREEKS\")\n        yield Static(id=\"greeks-display\")\n\n    def update_greeks(self, delta, gamma, vega, theta):\n        d = self.query_one(\"#greeks-display\", Static)\n        color_d = \"green\" if abs(delta) < 50000 else \"red\"\n        d.update(\n            f\"Delta: [{color_d}]{delta:+,.0f}[/{color_d}]  \\\"n\"\n            f\"Gamma: {gamma:+,.2f}\\n\"\n            f\"Vega:  {vega:+,.0f}\\n\"\n            f\"Theta: {theta:+,.0f}/day\"\n        )\n\n\nclass OrderEntryPanel(Static):\n    \"\"\"Command input for manual order entry.\"\"\"\n    DEFAULT_CSS = \"OrderEntryPanel { border: solid white; height: 5; }\"\n\n    def compose(self) -> ComposeResult:\n        yield Label(\"⌨️  ORDER ENTRY  (e.g. BUY AAPL 100 LIMIT 150.50  |  CANCEL 12345  |  PNL)\")\n        yield Input(placeholder=\"Enter command...\", id=\"order-input\")\n\n    def on_input_submitted(self, event: Input.Submitted):\n        command = event.value.strip().upper()\n        self.process_command(command)\n        self.query_one(\"#order-input\", Input).value = \"\"\n\n    def process_command(self, cmd: str):\n        parts = cmd.split()\n        if not parts:\n            return\n        if parts[0] == \"BUY\" and len(parts) >= 4:\n            symbol, qty = parts[1], int(parts[2])\n            order_type = parts[3]  # LIMIT or MARKET\n            price = float(parts[4]) if order_type == \"LIMIT\" else None\n            self.app.place_order(symbol, \"BUY\", qty, order_type, price)\n        elif parts[0] == \"SELL\" and len(parts) >= 4:\n            symbol, qty = parts[1], int(parts[2])\n            order_type = parts[3]\n            price = float(parts[4]) if order_type == \"LIMIT\" else None\n            self.app.place_order(symbol, \"SELL\", qty, order_type, price)\n        elif parts[0] == \"PNL\":\n            self.app.show_pnl_summary()\n\n\nclass TradingTerminal(App):\n    \"\"\"Bloomberg Terminal-lite: full trading system in your terminal.\"\"\"\n    TITLE = \"⚡ Quant Trading Terminal\"\n    CSS = \"\"\"\n    Screen { background: #0a0a0a; }\n    \"\"\"\n\n    def __init__(self):\n        super().__init__()\n        # ZeroMQ context for all feed subscriptions\n        self.zmq_ctx = zmq.asyncio.Context()\n\n    def compose(self) -> ComposeResult:\n        yield Header()\n        yield Horizontal(\n            Vertical(PricePanel(), PositionPanel()),   # Left column\n            Vertical(GreeksPanel(),                     # Right column\n                     Static(\"📋 RISK ALERTS\", id=\"alerts\")),\n        )\n        yield OrderEntryPanel()\n        yield Footer()\n\n    async def on_mount(self):\n        \"\"\"Start all ZeroMQ feed listeners on mount.\"\"\"\n        asyncio.create_task(self.listen_market_data())\n        asyncio.create_task(self.listen_positions())\n        asyncio.create_task(self.listen_greeks())\n\n    async def listen_market_data(self):\n        \"\"\"Subscribe to market data from Project 3 (market data store).\"\"\"\n        sock = self.zmq_ctx.socket(zmq.SUB)\n        sock.connect(\"tcp://localhost:5555\")\n        sock.setsockopt(zmq.SUBSCRIBE, b\"\")  # Subscribe to all symbols\n        while True:\n            [topic, data] = await sock.recv_multipart()\n            # Update price panel with new tick\n            # (parse binary tick format from Project 3)\n\n    def place_order(self, symbol, side, qty, order_type, price=None):\n        \"\"\"Send order to execution engine via ZeroMQ.\"\"\"\n        self.notify(f\"Order: {side} {qty} {symbol} @ {price or 'MKT'}\", severity=\"information\")\n\n\nif __name__ == \"__main__\":\n    TradingTerminal().run()"}]},{"n":3,"c":"#00C47C","d":"rgba(0,196,124,0.11)","title":"Phase 2 — First QD Job (EU Tier 2)","range":"Months 6–15  · ~9 months · While working full-time","desc":"Land your first quant developer role at a Tier 2 EU firm — Murex, BNP CIB, SocGen Global Markets, IMC (junior), Flow Traders, or a crypto trading firm. While working: continue deepening C++, start Georgia Tech OMSCS applications, build your competitive programming rating, and develop production quant systems experience. This phase is about getting real QD on your CV.","skills":["Production C++","Real Trading Systems","GT OMSCS Application","Codeforces 1600+","Networking","CV Positioning"],"weeks":[{"w":31,"title":"Job Search Sprint — Target Tier 2 EU","t":["<b style='color:#F5A623'>⚡ DUAL TRACK — EU Tier 1 (Amsterdam) + EU Tier 2 (Paris/London):</b> Based on getcracked.io comp data, this changes your target list significantly. Optiver Amsterdam Junior Dev = $405,000 total comp. IMC Chicago Junior = $365,000. These are Tier 1 numbers, not Tier 2. And Amsterdam requires NO US visa. As a French citizen you have full EU work rights. Amsterdam is now a PRIMARY target, not a fallback.","<b style='color:#F5A623'>🎯 Amsterdam — why it changes everything:</b> Optiver Amsterdam hired Junior Devs at $405k (120k base + 238k bonus + 47k signing). IMC has an Amsterdam office too. Flow Traders is headquartered there. You can target these firms with your Phase 1 skills, no US visa needed, 2-hour flight from Paris, and Dutch tax system has the '30% ruling' for foreign workers (significant tax benefit for first 5 years). This could get you to $300k+ 2 years faster than the US path.","<b>Amsterdam vs US — honest comparison:</b> Amsterdam Tier 1 (Optiver/IMC/Flow Traders) = $300-450k total comp, no visa, EU lifestyle, lower cost of living than NYC. US Tier 1 (Jane Street/Citadel) = $350-600k total comp, O-1A visa required, NYC/Chicago cost of living (rent $4-6k/month). Neither is obviously better — depends on lifestyle preference. The smart play: target Amsterdam NOW and US after 2-3 years of Tier 1 experience.","<b>Optiver Amsterdam interview process (from getcracked data):</b> Round 1 = online numerical/probability test (Optiver's proprietary test, 'Optigames' — practice mental arithmetic under time pressure). Round 2 = phone with HR + basic math. Round 3 = on-site in Amsterdam (full day: trading simulation, probability deep dive, C++ technical, cultural fit). The trading simulation is Optiver's trademark — you make markets on simple games, they evaluate your decision-making under uncertainty.","<b>Optigames preparation — start now:</b> Optiver's proprietary screening test. 80 arithmetic problems in 8 minutes (so ~6 seconds per problem). Practice: tradertest.optiver.com (free, official Optiver practice). This is a hard filter — many strong candidates fail here. Do 15 minutes of mental arithmetic practice daily for 6 weeks before applying.","<b>Flow Traders Amsterdam:</b> Junior QD, more Python-focused than Optiver/IMC. Comp: €80-150k base + significant bonus. Less prestigious but easier to get in. Good stepping stone if Optiver/IMC reject. They hire aggressively and value strong Python + data pipeline skills — your Wigl/Feel-Mining background is directly relevant.","<b>IMC Trading Amsterdam:</b> Similar to Optiver. Strong engineering culture. C++ heavier than Flow Traders. Compensation similar to Optiver. Both firms are market makers — understanding market making deeply (not just trading) is key for their interviews.","<b style='color:var(--pc)'>📋 You've completed Phase 1. Now execute. Apply to 30+ positions in 3 weeks. Tier 2 EU is realistic right now. Tier 1 US is the end goal, not the starting point.</b>","<b>Target firms (realistic right now):</b> Murex (Paris, trading software, loves strong engineers), BNP Paribas CIB tech (Paris), SocGen Global Markets tech (Paris), Flow Traders (Amsterdam, junior), crypto trading firms (B2C2, Wintermute, GSR — remote-friendly), Akuna Capital (Chicago, but hires EU for junior roles).","<b>CV reframe for QD applications — do this before applying:</b> Lead with quantitative impact. 'Transaction export reduced to 300ms for 5,000+ records' → 'Optimised financial data processing pipeline: p99 latency 280ms for 5k+ record exports via streaming pagination and query plan analysis'. Finance context + numbers + technique.","<b>PreludeSDK is your differentiator:</b> 'Author of PreludeSDK, open-source PHP library deployed in production across 3 crypto/fintech platforms.' Open source authorship signals engineering maturity that most junior candidates don't have.","<b>GitHub portfolio check before applying:</b> C++23 pricing engine repo — CMakeLists.txt, benchmark table, CI badge, Mermaid architecture diagram. Python trading bot — running on Alpaca paper with 2-week trade log. Fama-French notebook — nbviewer link. These are your interview conversation starters.","<b>Cover letter angle:</b> 'I am a senior fintech backend engineer with 4 years of production experience in financial systems (crypto transactions, payment flows, compliance APIs) transitioning to quantitative development. I bring production engineering discipline that most quant candidates lack.' Lead with the engineering, not the quant learning.","<b>Application targets per week:</b> 10 applications + 3 LinkedIn outreach messages to QDs at target firms + 1 coffee chat request. Track everything in a spreadsheet. Most responses come from outreach, not cold applications.","<b>Salary expectation EU (2025):</b> Junior QD Paris: €55-75k. Junior QD Amsterdam: €65-90k. London: £65-90k. Crypto trading firm remote: €70-100k. Don't anchor low — your 4 years of fintech experience is above entry level."],"terms":["Murex","BNP CIB","Flow Traders","Akuna Capital","O-1 visa","coffee chat","LinkedIn outreach","eFinancialCareers","cover letter","salary negotiation"],"p":"30 Applications + 3 Coffee Chats","pd":"Apply to 30 QD positions across EU Tier 2 firms in 3 weeks. Reach out to 10 QDs at target firms on LinkedIn (genuine, specific message — not generic). Request 3 coffee chats. Track everything. The goal is 2-3 first-round interviews.","deliverables":["Application tracker: 30 companies, role, date, status, contact person, next action","CV updated with QD framing — every bullet has a number and finance context","GitHub: 3 pinned repos, each with README benchmark table and CI badge","LinkedIn: headline updated to 'Fintech Backend Engineer | Quant Developer | C++ | Python'","tradertest.optiver.com: complete at least 3 practice sessions, log your score each time","Amsterdam target list: Optiver, IMC, Flow Traders, Virtu — applications prepared","Dutch 30% ruling eligibility check: confirm you qualify as a French national (you do)"],"r":["🌐 efinancialcareers.com — primary job board for quant roles in EU","🌐 linkedin.com/jobs — 'Quant Developer' + Paris/Amsterdam/London filter","🌐 wilmott.com/forum — community job board, niche quant roles","🌐 crypto trading firms: Wintermute, B2C2, GSR, Cumberland — all hire remotely","🌐 tradertest.optiver.com — Official Optiver practice test (free) — do this daily for 6 weeks","🌐 getcracked.io — Quant Dev 250: probability section specifically for Optiver/IMC prep","🌐 iamsterdam.com/en/live-work-study/living/housing — Amsterdam housing research","🌐 belastingdienst.nl/30-percent-facility — Dutch 30% tax ruling for foreign workers"]},{"w":32,"title":"Interview Execution — Tier 2 EU Screens","t":["<b style='color:#F5A623'>🎯 Optiver-specific interview prep:</b> Optiver's trading simulation ('Figgie' or custom games) is unlike standard interviews. They give you a game with asymmetric information and ask you to make markets. Key: your bid-ask spread should reflect your uncertainty, not your best estimate. If you think a jar has 50 coins (±10), your market is 40-60, not 50-50. The width of your spread = your confidence. They're testing: can you think in probability distributions, not point estimates.","<b style='color:#F5A623'>🎯 IMC interview specifics:</b> IMC focuses more on C++ and system design than Optiver. Expect: implement a lock-free queue from scratch, design an order management system, explain false sharing and how to fix it. The math is lighter than Optiver but the systems depth is heavier. Your C++ weeks 9-16 are your primary prep for IMC.","<b style='color:#F5A623'>🎯 Flow Traders interview:</b> Most Python-focused of the Amsterdam firms. Expect: data pipeline design, pandas/polars manipulation, backtesting framework questions, basic options knowledge. Your Wigl/Feel-Mining data pipeline experience is highly relevant — lead with it.","<b style='color:#00C47C'>🔗 getcracked.io — Quant Dev 250 execution:</b> This week: complete at minimum 100 of the 250 questions. Do them timed (2 minutes per question for knowledge questions, 10 minutes for problems). Track which categories you're weakest on — spend extra time there. The 46 problems in the track are the highest-value items.","<b style='color:var(--pc)'>📋 You're in interview processes now. This week is about executing, not studying. Keep your LeetCode and probability puzzle practice warm — 1 hour per day minimum.</b>","<b>Tier 2 EU interview format (typical):</b> Round 1 = CV screen + 30min HR call. Round 2 = technical coding screen (LeetCode Medium, 1hr, usually Python or C++). Round 3 = technical deep dive (options theory, C++, system design, 1.5-2hr). Round 4 = culture fit. Total: 2-4 weeks.","<b>Murex-specific:</b> Heavily focused on Java/C++ engineering, financial instruments knowledge, and system design. They care about software architecture more than pure math. Your 4yr background is a genuine advantage here.","<b>Crypto trading firm interviews:</b> Often more relaxed than tradfi — Python-heavy, focus on data pipelines and execution systems. Your Wigl/Feel-Mining experience is extremely relevant. Lead with it.","<b>System design answers — always structure as:</b> (1) Clarify requirements and scale. (2) Define data model. (3) Design the update/read paths. (4) Latency requirements and bottlenecks. (5) Failure modes and redundancy. Never jump straight to a solution.","<b>When they ask about C++ experience:</b> Be honest that you're 6 months in but show depth. 'I've been intensively studying C++23 for 6 months, built a [specific project] achieving [specific benchmark], and und
