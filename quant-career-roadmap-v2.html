<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07090F;--surface:#0C1220;--card:#0F1826;--card-h:#131D2C;
  --border:#192840;--border-l:#233550;
  --text:#C8D8EC;--text-d:#7090B0;--muted:#3E5570;
  --fm:'Fira Code',monospace;--fb:'DM Sans',sans-serif;
  --r:8px;--rl:12px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.6;min-height:100vh;padding-bottom:52px;}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(26,40,64,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(26,40,64,.28) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
.header{position:relative;z-index:10;background:rgba(7,9,15,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:26px 48px 22px;}
.header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.brand-label{font-family:var(--fm);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#00E8A8;margin-bottom:7px;}
h1{font-size:26px;font-weight:700;color:#EBF3FF;letter-spacing:-.4px;line-height:1.15;}
h1 em{color:#00E8A8;font-style:normal;}
.brand-sub{font-size:12px;color:var(--text-d);margin-top:4px;font-weight:300;}
.header-stats{display:flex;gap:32px;flex-shrink:0;}
.stat{text-align:right;}
.stat-n{font-family:var(--fm);font-size:28px;font-weight:600;color:#EBF3FF;display:block;line-height:1;}
.stat-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px;}
.pnav{position:sticky;top:0;z-index:20;background:rgba(7,9,15,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.pnav-inner{max-width:1240px;margin:0 auto;display:flex;padding:0 48px;overflow-x:auto;scrollbar-width:none;}
.pnav-inner::-webkit-scrollbar{display:none;}
.ptab{display:flex;align-items:center;gap:9px;padding:13px 18px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-family:var(--fb);font-size:12.5px;font-weight:500;white-space:nowrap;transition:color .15s;margin-bottom:-1px;}
.ptab:hover{color:var(--text);}
.ptab.active{color:#EBF3FF;border-bottom-color:var(--tc);}
.tbadge{font-family:var(--fm);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--tcd);color:var(--tc);}
.main{position:relative;z-index:5;max-width:1240px;margin:0 auto;padding:30px 48px 48px;}
.phdr{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--pc);border-radius:var(--rl);padding:22px 26px;margin-bottom:26px;}
.pnum{font-family:var(--fm);font-size:52px;font-weight:300;color:var(--pc);opacity:.3;line-height:1;padding-top:2px;}
.pname{font-size:19px;font-weight:600;color:#EBF3FF;margin-bottom:3px;}
.prange{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--pc);margin-bottom:8px;}
.pdesc{font-size:12.5px;color:var(--text-d);line-height:1.7;max-width:680px;}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
.ptag{font-family:var(--fm);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--pc);color:var(--pc);opacity:.6;}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;align-items:start;}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:border-color .15s,background .15s;}
.wcard:hover{background:var(--card-h);border-color:var(--border-l);}
.wcard.done{border-color:var(--pc);}
.wcard.done .wcard-head{opacity:.6;}
.wcard-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;border-bottom:1px solid transparent;transition:border-color .15s;user-select:none;}
.wcard.open .wcard-head{border-color:var(--border);}
.wnum{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--pc);background:var(--pcd);padding:3px 8px;border-radius:4px;flex-shrink:0;}
.wtitle{font-size:12.5px;font-weight:500;color:#D8E8F8;flex:1;min-width:0;}
.wdone{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:9px;color:transparent;font-family:var(--fm);}
.wdone:hover{border-color:var(--pc);}
.wcard.done .wdone{background:var(--pc);border-color:var(--pc);color:#07090F;}
.wchev{color:var(--muted);font-size:10px;transition:transform .15s;flex-shrink:0;}
.wcard.open .wchev{transform:rotate(180deg);}
.wbody{display:none;padding:15px;}
.wcard.open .wbody{display:block;}
.slabel{font-family:var(--fm);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.tlist{list-style:none;margin-bottom:11px;}
.tlist li{font-size:12px;color:var(--text-d);padding:3px 0 3px 13px;position:relative;line-height:1.6;}
.tlist li::before{content:'›';position:absolute;left:0;color:var(--pc);font-weight:700;}
.terms-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px;}
.tchip{font-family:var(--fm);font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border-l);color:var(--text-d);}
.proj-box{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--pc);border-radius:6px;padding:11px 13px;margin-bottom:10px;}
.plbl{color:var(--pc);margin-bottom:4px;}
.ptitle2{font-size:12px;font-weight:600;color:#D8E8F8;margin-bottom:4px;}
.pdesc2{font-size:11px;color:var(--text-d);line-height:1.55;}
.dlist{list-style:none;margin-top:9px;border-top:1px solid var(--border);padding-top:8px;}
.dlist li{font-size:11px;color:var(--text-d);padding:2px 0 2px 17px;position:relative;line-height:1.55;}
.dlist li::before{content:'☑';position:absolute;left:0;color:var(--pc);font-size:10px;}
.rlist{display:flex;flex-wrap:wrap;gap:5px;}
.rtag{font-family:var(--fm);font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:4px;}
.pgwrap{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(7,9,15,.97);border-top:1px solid var(--border);padding:9px 48px;display:flex;align-items:center;gap:16px;}
.pgtxt{font-family:var(--fm);font-size:10px;color:var(--muted);white-space:nowrap;}
.pgbar{flex:1;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.pgfill{height:100%;background:linear-gradient(90deg,#00E8A8,#4D8EF0);border-radius:2px;transition:width .35s;}
.pgpct{font-family:var(--fm);font-size:10px;color:#00E8A8;white-space:nowrap;min-width:28px;text-align:right;}
@media(max-width:800px){
  .header{padding:18px 16px 14px;}
  .header-inner{flex-direction:column;align-items:flex-start;gap:14px;}
  .header-stats{gap:20px;}
  .stat{text-align:left;}
  .pnav-inner{padding:0 16px;}
  .main{padding:18px 16px 48px;}
  .wgrid{grid-template-columns:1fr;}
  .phdr{grid-template-columns:1fr;gap:6px;}
  .pnum{display:none;}
  .pgwrap{padding:8px 16px;}
}

/* ── Starter code toggle ── */
.code-btn{display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:10px;padding:6px 12px;background:none;
  border:1px solid var(--border-l);border-radius:5px;cursor:pointer;
  color:var(--muted);font-family:var(--fm);font-size:10px;transition:all .15s;}
.code-btn:hover{color:var(--pc);border-color:var(--pc);}
.code-box{display:none;margin-top:8px;background:#020408;
  border:1px solid var(--border);border-radius:6px;overflow-x:auto;}
.code-box.open{display:block;}
pre.scode{font-family:var(--fm);font-size:10.5px;color:#8BAFD4;
  padding:14px;line-height:1.65;white-space:pre;tab-size:2;}

</style>

<script>
const DONE=new Set();let AP=0;
const PH=[{"n":1,"c":"#4D8EF0","d":"rgba(77,142,240,0.11)","title":"Phase 1 — Foundation (Self-Study)","range":"Weeks 1–22  · ~726h · 33h/week · ~5.5 months","desc":"The complete foundation roadmap tailored to your fintech background. Python quant stack, financial domain, Black-Scholes, backtesting, C++23 (8 weeks), competitive programming, and interview prep. This makes you a credible junior QD candidate for Tier 2 EU firms. Completion unlocks Phase 2.","skills":["Python Quant","C++23","Financial Models","Backtesting","Competitive Programming","Options Pricing"],"weeks":[{"w":1,"title":"Python Quant Stack — NumPy, pandas & Vectorization","t":["<b style='color:var(--pc)'>📋 Week note: You're a strong dev — Python syntax is 1 day max. Spend the rest on understanding vectorization deeply and getting comfortable with financial data (OHLCV, log returns, rolling windows). These patterns repeat everywhere.</b>","<b style='color:var(--pc)'>── Python Setup & Your First Stock Chart ──</b>","Install everything first — open your terminal and run: <code>pip install numpy pandas matplotlib seaborn yfinance jupyterlab scipy statsmodels</code>. Then open JupyterLab (type <code>jupyter lab</code>) and run <code>import numpy</code> — if no error, you're set.","<b>What is NumPy?</b> It's the math backbone of Python. A normal Python list is slow for numbers. NumPy gives you an 'ndarray' (n-dimensional array) that does math 50× faster. Think of it like Excel columns — you apply a formula to the entire column at once, not cell by cell.","<b>Why no for-loops?</b> Writing <code>for x in arr: total += x</code> is slow. Writing <code>np.sum(arr)</code> is 50× faster because it runs in compiled C under the hood. This is called 'vectorization' — the #1 rule of scientific Python. If you write a for-loop over a NumPy array, you're doing it wrong.","<b>What is pandas?</b> NumPy is for raw numbers. pandas is for tables with labels (like a spreadsheet in code). The main object is a DataFrame — rows are dates, columns are stocks. Key operations you'll use daily: <code>.rolling(20).mean()</code> (sliding average), <code>.shift(1)</code> (yesterday's value), <code>.pct_change()</code> (daily % change).","<b>What is yfinance?</b> A free library that downloads stock price history from Yahoo Finance. One line: <code>df = yf.download('AAPL', start='2019-01-01')</code> gives you 5 years of daily prices. Always use the 'Adj Close' column — it corrects for stock splits and dividends automatically.","<b style='color:var(--pc)'>── pandas Deep Dive — Working with Tables of Data ──</b>","<b>Boolean masking:</b> Instead of a for-loop to filter rows, write <code>arr[arr > 0]</code> — this returns only positive values. <code>np.where(condition, value_if_true, value_if_false)</code> is a vectorized if/else. These are the building blocks for computing buy/sell signals without any loops.","<b>Broadcasting:</b> NumPy can do math between arrays of different sizes without copying data. Example: a (100, 1) array times a (1, 20) array gives a (100, 20) result automatically — 100 days × 20 stocks. This is how you apply a calculation to all stocks at once.","<b>Lookahead bias — the #1 backtest mistake:</b> If you use today's closing price to generate a signal for today's trade, you're cheating — you wouldn't know that price when deciding to trade. Fix: always use <code>.shift(1)</code> on signals so your 'decision today' is based on 'yesterday's data'. Forgetting this makes backtests look amazing but lose money in real life.","<b>Joining DataFrames:</b> Like SQL JOIN in Laravel's Eloquent. <code>pd.merge(df1, df2, on='date')</code> merges two tables by a shared column. <code>df.join(other_df)</code> merges by index (the row labels). You'll constantly combine price data with factor data and fundamental data.","<b>Missing data — the rules:</b> <code>.ffill()</code> (forward fill) fills gaps with the last known value — correct for prices. NEVER use <code>.bfill()</code> (backward fill) on price data — it fills gaps using future values, which is a hidden form of lookahead bias.","<b style='color:#00C47C'>🔗 getcracked.io:</b> Start the <b>Beginner C++</b> track in parallel (269 resources, 211 questions). Don't try to finish it — use it as a reference. When you hit a concept in weeks 9-16 that you don't understand, search for it in getcracked first.","<b>Polars — the pandas replacement you should learn now:</b> Polars is a DataFrame library written in Rust that is 10-50× faster than pandas for large datasets. Job listings at HFT firms and hedge funds increasingly list it alongside pandas. Syntax is similar but not identical. Key difference: Polars is lazy by default (builds a query plan before executing — like a query optimizer). <code>pip install polars</code>. This week: redo your W1 AAPL analysis in Polars. Compare the speed on 5yr of tick data.","<b>Polars vs pandas — when to use which:</b> pandas = small datasets (< 1M rows), quick analysis, maximum library compatibility. Polars = large datasets (> 1M rows), production data pipelines, performance-critical code. In a real quant shop: pandas for notebooks, Polars for the data pipeline."],"terms":["ndarray","DataFrame","vectorization","OHLCV","Adj Close","log return","moving average","boolean mask","broadcasting","DatetimeIndex","ffill","lookahead bias","merge vs join","resample"],"p":"Stock Return Analyzer — 4 Charts in One Figure + Multi-Stock Return Matrix — 20 Stocks","pd":"Download 5 years of data for 20 large-cap stocks. Build a notebook with: a correlation heatmap (which stocks move together?), a 1-year return bar chart sorted from best to worst, a drawdown chart (how far below peak?), and a Sharpe ratio league table.","deliverables":["<b>Python Setup & Your First Stock Chart:</b>","A 2×2 chart grid (2 rows, 2 columns = 4 panels) saved as a PNG file","Two moving averages (20-day and 50-day) on the price chart — no for-loops","Histogram with a Normal bell curve overlaid — look for 'fat tails' where actual bars exceed the curve at the extremes","<b>pandas Deep Dive — Working with Tables of Data:</b>","A 20×20 correlation heatmap using seaborn — every cell shows a number between −1 and +1","Drawdown series: at each day, how far below the all-time high is the portfolio? (always 0 or negative)","Zero for-loops anywhere — all math done with pandas/NumPy operations","Redo the W1 AAPL analysis in Polars — compare runtime vs pandas on 5yr daily data (expect 5-20× speedup)"],"r":["📺 Corey Schafer — 'Pandas Tutorial' series on YouTube (Parts 1–5, totally free, very clear)","📖 Python for Finance — Yves Hilpisch, Chapter 4 (NumPy) + Chapter 5 (pandas)","🌐 10 Minutes to pandas: pandas.pydata.org/docs/user_guide/10min.html","📺 Corey Schafer — 'Pandas Tutorial' Parts 6–10 on YouTube","📖 Python for Data Analysis — Wes McKinney (pandas creator), Chapters 4–5","🌐 pandas indexing guide: pandas.pydata.org/docs/user_guide/indexing.html","🌐 getcracked.io — Beginner C++ track (269 resources) — use as reference alongside weeks 9-16","🌐 pola.rs/docs — Polars official documentation, 'Getting Started' section","📺 'Polars vs Pandas' — multiple YouTube comparisons, watch one to understand the syntax differences"],"code":"# ═══ Python Setup & Your First Stock Chart ═══\n# WEEK 1 STARTER CODE — Run this line by line in JupyterLab\n# Install first (in terminal): pip install yfinance pandas numpy matplotlib scipy\n\nimport yfinance as yf\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\n# ── Step 1: Download stock data ────────────────────────────────────────────────\n# yf.download gives us a table (DataFrame) with columns: Open, High, Low, Close,\n# Adj Close, Volume — one row per trading day.\n# 'Adj Close' = closing price ADJUSTED for stock splits and dividends.\n# Always use Adj Close for return calculations — raw Close gives wrong results.\ndf    = yf.download('AAPL', start='2019-01-01', auto_adjust=False, progress=False)\nclose = df['Adj Close']\nprint('Downloaded', len(close), 'trading days of data')\n\n# ── Step 2: Compute daily log returns ─────────────────────────────────────────\n# Log return = ln(today's price / yesterday's price)\n# Why log? Two reasons: (1) they add up correctly over time, (2) they're ~symmetric\n# .shift(1) gives you yesterday's price in each row (shift everything down 1 day)\nlog_returns = np.log(close / close.shift(1))\n# First row is NaN (no 'yesterday' for day 1) — that's normal, pandas handles it\n\n# ── Step 3: Moving averages ────────────────────────────────────────────────────\n# A Moving Average (MA) = average of the last N days' prices\n# It smooths the price line so you can see the trend without daily noise\n# .rolling(20).mean() = for each day, average the previous 20 days\nma_20 = close.rolling(window=20).mean()   # 20-day moving average\nma_50 = close.rolling(window=50).mean()   # 50-day moving average\n\n# ── Step 4: Rolling volatility ─────────────────────────────────────────────────\n# Volatility = how much the stock bounces around (standard deviation of returns)\n# .rolling(30).std() = std dev of the last 30 days of returns\n# * sqrt(252): there are 252 trading days/year, this converts daily vol to annual vol\nvol_30 = log_returns.rolling(window=30).std() * np.sqrt(252)\n\n# ── Step 5: Build the 2x2 chart grid ──────────────────────────────────────────\n# plt.subplots(2, 2) creates one figure with 4 panels (2 rows x 2 columns)\n# axes[row, col]: [0,0]=top-left, [0,1]=top-right, [1,0]=bot-left, [1,1]=bot-right\nfig, axes = plt.subplots(2, 2, figsize=(14, 8))\n\n# Panel 1: Price + Moving Averages\naxes[0, 0].plot(close, label='Price', linewidth=1.5)\naxes[0, 0].plot(ma_20, label='20-day MA', linewidth=1)\naxes[0, 0].plot(ma_50, label='50-day MA', linewidth=1)\naxes[0, 0].legend()\naxes[0, 0].set_title('Price & Moving Averages')\n\n# Panel 2: Daily Return Bars\naxes[0, 1].bar(log_returns.index, log_returns, width=1, alpha=0.7)\naxes[0, 1].set_title('Daily Log Returns')\naxes[0, 1].axhline(0, color='white', linewidth=0.5)\n\n# Panel 3: Return Histogram with Normal bell curve overlay\nclean = log_returns.dropna()   # remove the first NaN row\n# density=True: y-axis = probability so area under histogram = 1\naxes[1, 0].hist(clean, bins=80, density=True, alpha=0.7, label='Actual returns')\n# Fit a Normal (bell curve) to the data and draw it as a line\nmu, sigma = stats.norm.fit(clean)\nx = np.linspace(clean.min(), clean.max(), 200)\naxes[1, 0].plot(x, stats.norm.pdf(x, mu, sigma), color='white', lw=2, label='Normal bell curve')\naxes[1, 0].legend()\naxes[1, 0].set_title('Return Distribution — look for fat tails!')\n# Fat tails = actual bars are taller than the bell curve at the extremes\n# This means extreme crashes/surges happen more often than Normal predicts\n\n# Panel 4: Rolling 30-day Volatility\naxes[1, 1].plot(vol_30, color='cyan')\naxes[1, 1].set_title('Rolling 30-day Annualized Volatility')\n# You should see a massive spike in March 2020 (COVID crash)\n\nplt.suptitle('AAPL Stock Analysis — Week 1 Project', fontsize=14)\nplt.tight_layout()\nplt.savefig('week01_output.png', dpi=120)\nplt.show()\nprint('Chart saved as week01_output.png!')\n\n# ═══ pandas Deep Dive — Working with Tables of Data ═══\nimport yfinance as yf\nimport numpy as np\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\n# 20 large-cap US stocks\ntickers = ['AAPL','MSFT','GOOGL','AMZN','NVDA','META','TSLA','JPM',\n           'V','JNJ','WMT','UNH','PG','HD','MA','BAC','ABBV','XOM','LLY','AVGO']\n\n# Download all 20 at once (one API call, much faster)\nprices  = yf.download(tickers, start='2019-01-01', auto_adjust=False, progress=False)['Adj Close']\nreturns = np.log(prices / prices.shift(1))   # log returns for all 20 stocks\n\n# ── Chart 1: Correlation Heatmap ───────────────────────────────────────────────\n# Correlation: +1 = move identically, 0 = no relationship, -1 = always opposite\n# .corr() computes this for every pair of stocks automatically\ncorr = returns.corr()\nplt.figure(figsize=(12, 10))\nsns.heatmap(corr, annot=True, fmt='.2f', cmap='coolwarm', center=0,\n            annot_kws={'size': 7})\nplt.title('20-Stock Correlation Matrix (2019-2024)')\nplt.tight_layout()\nplt.show()\n\n# ── Chart 2: 1-Year Return Bar Chart ──────────────────────────────────────────\n# .tail(252) = last 252 trading days ≈ 1 year\n# .sum() on log returns ≈ total annual return\ntrailing_1yr = returns.tail(252).sum()\ntrailing_1yr.sort_values().plot.barh(figsize=(9, 7),\n    title='Trailing 1-Year Return (sorted)', color='steelblue')\nplt.tight_layout()\nplt.show()\n\n# ── Drawdown calculation ────────────────────────────────────────────────────────\n# Drawdown = how far below the all-time peak are we right now?\n# Step 1: cumulative return (portfolio value if you started at 1.0)\ncum_ret = (1 + returns).cumprod()\n# Step 2: running maximum (the peak value up to each day)\nrolling_peak = cum_ret.cummax()\n# Step 3: drawdown = (current value - peak) / peak  -- always <= 0\ndrawdown = (cum_ret - rolling_peak) / rolling_peak\n\n# Plot drawdown for 3 stocks\ndrawdown[['AAPL', 'TSLA', 'JPM']].plot(figsize=(12, 5),\n    title='Drawdown -- 0% = at all-time high, -50% = half of peak value')\nplt.axhline(0, color='white', linewidth=0.5)\nplt.show()\n\n# ── Sharpe Ratio League Table ──────────────────────────────────────────────────\n# Sharpe = (average return) / (return volatility) * sqrt(252)\n# Higher Sharpe = better risk-adjusted return\nsharpe = returns.mean() / returns.std() * np.sqrt(252)\nprint('\\nSharpe Ratio League Table:')\nprint(sharpe.sort_values(ascending=False).round(2).to_string())"},{"w":2,"title":"Linear Algebra, Calculus & Probability","t":["<b style='color:var(--pc)'>📋 Week note: This is the hardest week mathematically. w.T @ Σ @ w (portfolio variance) and Monte Carlo simulation are the two things to truly understand — they appear in every subsequent phase. Watch 3Blue1Brown before touching the code.</b>","<b style='color:var(--pc)'>── Linear Algebra I — The Math Behind Portfolios ──</b>","<b>Vectors and dot products:</b> A portfolio is a list of weights, e.g. w = [0.3, 0.4, 0.3] (30% in stock A, 40% in B, 30% in C). The portfolio's daily return = w · r = (0.3×r_A) + (0.4×r_B) + (0.3×r_C). In NumPy: <code>w @ r</code>. The <code>@</code> operator means 'dot product / matrix multiply'.","<b>Matrices:</b> A matrix is a 2D table of numbers. You can multiply matrix A by matrix B only if A's number of columns equals B's number of rows. Always check with <code>A.shape</code> while learning. The result shape is (A_rows × B_cols).","<b>The central formula of portfolio theory — σ²_p = w.T @ Σ @ w:</b> Portfolio variance (risk²) equals weights transposed × covariance matrix × weights. Here Σ (Greek letter sigma) is the 'covariance matrix' — a table showing how much every stock moves with every other stock. This formula underlies ALL of portfolio theory.","<b>What is a covariance matrix?</b> A square table where entry [i,j] = how much stock i and stock j move together. Values near +1 = they move in tandem (both tech stocks). Values near 0 = independent. Values near −1 = they move opposite (gold vs equities). The diagonal = each stock's own variance.","<b>np.linalg.solve vs np.linalg.inv:</b> Both can solve the equation Ax=b (find x). But <code>np.linalg.solve(A, b)</code> is more accurate and faster. Only use <code>np.linalg.inv(A)</code> when you genuinely need the full inverse matrix (rare in practice).","<b style='color:var(--pc)'>── Linear Algebra II — PCA: Finding Hidden Patterns ──</b>","<b>What is PCA (Principal Component Analysis)?</b> Imagine 20 stocks that all mostly go up and down together (because of the market). PCA finds the underlying 'directions' of movement. The first direction (PC1) is usually 'the market factor' — the single biggest driver of all stocks. The second is often 'growth vs value'. It's like finding the hidden axes of a dataset.","<b>Eigenvalues and eigenvectors — don't panic:</b> For our covariance matrix, each eigenvector is one hidden direction, and its eigenvalue tells you how much variance (price movement) that direction explains. Bigger eigenvalue = more important factor. Compute with <code>np.linalg.eigh(Sigma)</code> — the function does all the hard math.","<b>Step-by-step PCA (5 steps):</b> (1) Center your data: subtract each stock's average return. (2) Compute the covariance matrix. (3) Get eigenvalues + eigenvectors. (4) Sort by eigenvalue, largest first. (5) Project your data onto the top K eigenvectors. That's it — no magic, just matrix operations.","<b>Explained variance ratio:</b> Each eigenvalue ÷ sum of all eigenvalues = how much of total variance that component explains. In a 20-stock universe, PC1 (the market) typically explains 40–60% of all movement. Visualized as a 'scree plot' — a bar chart of explained variance per component.","<b>Why does a QD need this?</b> Risk managers decompose portfolio risk into factors: '65% of our risk is market risk, 15% is sector risk, 20% is stock-specific risk.' PCA is one way to find those factors directly from the data.","<b style='color:var(--pc)'>── Calculus — How Things Change (Options Edition) ──</b>","<b>What is a derivative (in math)?</b> It measures how fast something changes. If the stock price rises $1, how much does the option price rise? That's the option's Delta — a derivative. If you drive 100km in 2 hours, your average speed (50km/h) is the derivative of distance with respect to time.","<b>Numerical derivatives — the practical shortcut:</b> Instead of calculus by hand, approximate: f'(x) ≈ (f(x + tiny) − f(x − tiny)) / (2 × tiny). This is called 'central difference'. With tiny = 0.00001, you get very accurate results. This is exactly how option pricing software computes Greeks when no formula exists.","<b>Partial derivatives:</b> When a function depends on multiple inputs (like an option that depends on price, time, and volatility), a partial derivative measures the change from one input while holding all others constant. Delta = partial derivative of option price with respect to stock price.","<b>Taylor series — why options gain from big moves:</b> f(x + Δx) ≈ f(x) + f'(x)Δx + ½f''(x)Δx². The f'' term is the Gamma correction — options have positive convexity, meaning they gain extra value from large moves (regardless of direction). This is why traders buy options before big news events.","<b>Gradient descent:</b> The algorithm behind machine learning. Idea: you have a function you want to minimize (error in your model). Gradient = direction of steepest ascent. Step in the opposite direction. Repeat until you reach the minimum. Same idea as walking downhill blindfolded — always step in the steepest downward direction.","<b style='color:var(--pc)'>── Probability — The Language of Uncertainty ──</b>","<b>Normal distribution (the bell curve):</b> Most quant models assume stock returns follow a bell curve — symmetric, with most values near the center and fewer extreme values. Described by two numbers: mean (μ, where the center is) and standard deviation (σ, how wide it is). Key fact: ±1σ captures 68% of outcomes, ±2σ captures 95%, ±3σ captures 99.7%.","<b>PDF vs CDF:</b> PDF (probability density function) = the bell curve shape itself — its height at a point shows relative probability. CDF (cumulative distribution function) = area under the bell curve to the left of a value = probability of being below that value. <code>norm.cdf(-0.02)</code> = probability of a daily loss worse than 2%.","<b>Log-normal distribution (why stock prices can't go negative):</b> If daily log-returns are Normal, then price after T days = S₀ × e^(Normal random number). Since e^(anything) is always positive, prices are always positive. This log-normal assumption is the foundation of Black-Scholes (Week 19).","<b>Expected value and variance:</b> Expected value E[X] = the long-run average if you repeated the experiment many times. Variance = how spread out the outcomes are. For a portfolio: E[portfolio] = weights · mean_returns, and Variance = weights · Σ · weights (the same formula from Week 3).","<b>Monte Carlo simulation:</b> When no formula exists, generate thousands of random scenarios and average the results. For option pricing: simulate 100,000 random stock paths, compute the payoff on each, average them. The law of large numbers guarantees this converges to the true answer.","<b>From your experience:</b> You've done performance optimisation (RAM, query times). The mindset is identical here — you're optimising mathematical operations instead of SQL queries. Use that intuition."],"terms":["dot product","matrix multiply","transpose","covariance matrix","variance","standard deviation","norm","eigenvalue","eigenvector","principal component","scree plot","explained variance","factor loading","dimensionality reduction","derivative","partial derivative","gradient","Taylor series","chain rule","convexity","numerical differentiation","PDF","CDF","Normal distribution","Log-normal","expectation","CLT","Monte Carlo","random seed"],"p":"Portfolio Covariance & Risk Calculator + Reveal the Hidden Factors in 20 Stocks + Build a Numerical Derivative Calculator + Monte Carlo Portfolio Simulator","pd":"Simulate 1,000 random portfolio paths over 252 days. Draw a fan chart showing the spread of outcomes at the 5th, 25th, 50th, 75th, and 95th percentiles. Compute the probability of losing more than 20% in a year and the probability of gaining more than 20%.","deliverables":["<b>Linear Algebra I — The Math Behind Portfolios:</b>","Manual covariance matrix verified against <code>df.cov()</code> — difference must be less than 1e-10","Portfolio variance (σ²_p = w.T @ Σ @ w) for: equal-weight, 100% one stock, and market-cap-weight","Scatter plot: 1000 random portfolios with risk on x-axis, expected return on y-axis","<b>Linear Algebra II — PCA: Finding Hidden Patterns:</b>","Full manual PCA — np.linalg.eigh only, no sklearn allowed this week (learn the mechanics first)","Scree plot + cumulative explained variance in one figure","PC1 vs SPY returns correlation: should be above 0.90 — confirm and print the value","<b>Calculus — How Things Change (Options Edition):</b>","central_diff() verified: error vs the known exact derivative < 0.001% for three test functions","Numerical Delta for a call option at different stock prices — should be near 0 deep out of money, near 1 deep in the money","Gradient descent convergence chart: 3 different learning rates, showing what happens when rate is too high (diverges)","<b>Probability — The Language of Uncertainty:</b>","Fan chart: 5 probability bands clearly colored and labeled (5/25/50/75/95th percentiles)","P(portfolio loses >20% in 1 year) computed from the simulation — print the number","Histogram of terminal portfolio values — compare the shape to a log-normal bell curve"],"r":["📺 3Blue1Brown — 'Essence of Linear Algebra' on YouTube (15 short videos, free, visual and intuitive — watch all of them)","📺 MIT 18.06 Linear Algebra — Gilbert Strang free lectures at ocw.mit.edu","🌐 NumPy linear algebra reference: numpy.org/doc/stable/reference/routines.linalg.html","📺 StatQuest — 'PCA Step-by-Step' on YouTube (the clearest explanation anywhere, very visual)","📺 StatQuest — 'PCA in Python' on YouTube (implementation walkthrough)","🌐 scikit-learn.org/stable/modules/decomposition.html (for next week when you use the library)","📺 3Blue1Brown — 'Essence of Calculus' on YouTube (12 free videos, beautiful visuals)","📺 3Blue1Brown — 'Gradient Descent, How Neural Networks Learn' on YouTube","📺 Khan Academy — Multivariable Calculus (free, focus on partial derivatives section)","📖 Introduction to Probability — Blitzstein & Hwang (free PDF at probabilitybook.net)","📺 StatQuest — 'Probability Distributions' and 'Central Limit Theorem' on YouTube","🌐 scipy.stats documentation: docs.scipy.org/doc/scipy/reference/stats.html"],"code":"# ═══ Linear Algebra I — The Math Behind Portfolios ═══\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# ── The dot product: portfolio return ─────────────────────────────────────────\n# weights @ returns = weighted sum = portfolio return\nweights = np.array([0.25, 0.35, 0.40])   # must sum to 1.0\ntoday_returns = np.array([0.01, -0.005, 0.008])   # stock A, B, C daily returns\n\nportfolio_return = weights @ today_returns   # = 0.25*0.01 + 0.35*(-0.005) + 0.40*0.008\nprint(f'Portfolio return today: {portfolio_return*100:.3f}%')\n\n# ── Covariance matrix from scratch ────────────────────────────────────────────\n# The covariance matrix Sigma tells us: how much do pairs of stocks move together?\nnp.random.seed(42)\nR = np.random.randn(252, 3) * 0.01   # fake 252-day, 3-stock return matrix\n\n# Manual formula: Sigma = (1/(T-1)) * R_centered' * R_centered\nR_centered = R - R.mean(axis=0)    # subtract each stock's mean return\nT = R.shape[0]                      # number of days (252)\nSigma = (1 / (T - 1)) * R_centered.T @ R_centered\n\nprint('\\nCovariance matrix (manual):')\nprint(Sigma.round(8))\nprint('\\nCovariance matrix (numpy built-in -- should match):')\nprint(np.cov(R.T).round(8))\n\n# ── Portfolio variance: the central formula ────────────────────────────────────\n# sigma^2_portfolio = w' * Sigma * w\n# This one formula underlies ALL of portfolio theory\nport_var = weights @ Sigma @ weights   # result is a scalar (one number)\nport_std  = np.sqrt(port_var)          # standard deviation = square root of variance\nannual_vol = port_std * np.sqrt(252)   # scale daily -> annual (252 trading days)\nprint(f'\\nPortfolio annual volatility: {annual_vol*100:.2f}%')\n\n# ── Monte Carlo: 1000 random portfolios ───────────────────────────────────────\nnp.random.seed(0)\nn_portfolios = 1000\nall_returns = []\nall_vols = []\n\nfor _ in range(n_portfolios):\n    w = np.random.random(3)\n    w = w / w.sum()    # normalize so weights sum to 1\n    ret = w @ R.mean(axis=0) * 252      # annualized expected return\n    vol = np.sqrt(w @ Sigma @ w) * np.sqrt(252)   # annualized volatility\n    all_returns.append(ret)\n    all_vols.append(vol)\n\nplt.figure(figsize=(8, 6))\nplt.scatter(all_vols, all_returns, alpha=0.3, s=10)\nplt.xlabel('Annual Volatility (Risk)')\nplt.ylabel('Annual Expected Return')\nplt.title('1000 Random Portfolios -- the efficient frontier is the upper-left edge')\nplt.tight_layout()\nplt.show()\n\n# ═══ Linear Algebra II — PCA: Finding Hidden Patterns ═══\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nnp.random.seed(0)\n# Simulate 20-stock return matrix (252 days x 20 stocks)\n# In your real project: use the 20-stock data from Week 2\nreturns = np.random.randn(252, 20) * 0.01\n\n# ── Manual PCA -- step by step ──────────────────────────────────────────────────\n\n# Step 1: Center the data (subtract each stock's average return)\n# Required -- PCA is about variance around the mean, not from zero\nX = returns - returns.mean(axis=0)\n\n# Step 2: Covariance matrix (20x20)\nSigma = X.T @ X / (len(X) - 1)   # shape: (20, 20)\n\n# Step 3: Eigendecomposition\n# eigh() is for symmetric matrices -- always use eigh (not eig) for covariance matrices\n# It guarantees real eigenvalues and is numerically more stable\neigenvalues, eigenvectors = np.linalg.eigh(Sigma)\n# eigenvectors: each COLUMN is one principal component direction\n\n# Step 4: Sort descending (eigh returns ascending order)\nidx = np.argsort(eigenvalues)[::-1]       # argsort then reverse\neigenvalues  = eigenvalues[idx]\neigenvectors = eigenvectors[:, idx]        # reorder columns\n\n# Step 5: How much variance does each PC explain?\nexplained  = eigenvalues / eigenvalues.sum()   # fraction (0 to 1)\ncumulative = np.cumsum(explained)\n\nprint(f'PC1 explains {explained[0]*100:.1f}% of all variance')\nprint(f'Top 3 PCs explain {cumulative[2]*100:.1f}% of all variance')\n\n# Step 6: Project data onto top 3 PCs\n# This gives us 3 factor scores per day instead of 20 stock returns\nZ = X @ eigenvectors[:, :3]   # shape: (252, 3)\n\n# ── Scree Plot ─────────────────────────────────────────────────────────────────\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 5))\n\nax1.bar(range(1, 11), explained[:10] * 100, color='steelblue')\nax1.set_xlabel('Principal Component #')\nax1.set_ylabel('% of variance explained')\nax1.set_title('Scree Plot -- how important is each PC?')\n\nax2.plot(range(1, 21), cumulative * 100, marker='o')\nax2.axhline(80, color='red', linestyle='--', label='80% threshold')\nax2.set_xlabel('Number of components')\nax2.set_ylabel('Cumulative % variance')\nax2.set_title('Cumulative Explained Variance')\nax2.legend()\n\nplt.tight_layout()\nplt.show()\n\n# PC1 factor loadings: if all positive, PC1 is 'the market factor'\nplt.figure(figsize=(10, 4))\nplt.bar(range(20), eigenvectors[:, 0])\nplt.xlabel('Stock index (0-19)')\nplt.ylabel('Loading')\nplt.title('PC1 Factor Loadings -- if all positive, this is the market factor')\nplt.axhline(0, color='white', linewidth=0.5)\nplt.tight_layout()\nplt.show()\n\n# ═══ Calculus — How Things Change (Options Edition) ═══\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# ── Part 1: Numerical derivative (central difference) ─────────────────────────\n# Instead of doing calculus by hand, approximate f'(x) numerically:\n# f'(x) approx (f(x + e) - f(x - e)) / (2*e)\n# This works for ANY function, even when no formula for the derivative exists\n\ndef central_diff(f, x, eps=1e-5):\n    \"\"\"Approximate the derivative of f at x using central difference.\"\"\"\n    return (f(x + eps) - f(x - eps)) / (2 * eps)\n\nprint('Verifying numerical derivatives vs exact answers:')\nprint(f'  d/dx[x^3] at x=2:    numerical={central_diff(lambda x: x**3, 2):.6f}  exact=12.0')\nprint(f'  d/dx[ln(x)] at x=4:  numerical={central_diff(np.log, 4):.6f}  exact={1/4}')\nprint(f'  d/dx[sin(x)] at pi:  numerical={central_diff(np.sin, np.pi):.6f}  exact=-1.0')\n\n# ── Part 2: Option Delta -- how much does option price change per $1 move? ─────\n# Delta = d(option_price) / d(stock_price)\n# We compute this numerically: (price at S+1 - price at S-1) / 2\n\n# Simplified call option payoff at expiry: max(S - K, 0)\ncall_payoff = lambda S, K=100: max(S - K, 0.0)\n\nfor S in [90, 95, 100, 105, 110]:\n    delta = (call_payoff(S + 1) - call_payoff(S - 1)) / 2\n    print(f'  Delta at S={S}, K=100: {delta:.2f}  (0=far out-of-money, 1=far in-the-money)')\n\n# ── Part 3: Gradient Descent ──────────────────────────────────────────────────\n# Problem: find the minimum of f(x) = x^2 + 3x + 2\n# Real minimum at x = -1.5  (set f'(x) = 2x + 3 = 0, solve for x)\n\nf = lambda x: x**2 + 3*x + 2\n\nfig, axes = plt.subplots(1, 2, figsize=(12, 5))\n\n# Try 3 different learning rates (step sizes)\nfor alpha, color, label in [(0.5, 'green', 'a=0.5 (good)'),\n                              (0.1, 'blue',  'a=0.1 (slow)'),\n                              (1.5, 'red',   'a=1.5 (diverges!!)')]:\n    x = 5.0   # start far from minimum\n    path = [x]\n    for _ in range(20):\n        grad = central_diff(f, x)   # gradient = slope at current x\n        x = x - alpha * grad         # step downhill (subtract because we minimize)\n        path.append(x)\n\n    axes[0].plot(path, marker='.', color=color, label=label)\n    losses = [f(xi) for xi in path]\n    axes[1].plot(losses, marker='.', color=color, label=label)\n\naxes[0].axhline(-1.5, color='white', linestyle='--', label='exact minimum (x=-1.5)')\naxes[0].set(xlabel='Iteration', ylabel='x value', title='Gradient Descent -- Position')\naxes[0].legend()\naxes[1].set(xlabel='Iteration', ylabel='f(x)', title='Loss -- lower is better')\naxes[1].legend()\nplt.tight_layout()\nplt.show()\n\n# ═══ Probability — The Language of Uncertainty ═══\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\n# ── Part 1: Normal distribution basics ────────────────────────────────────────\n# Daily stock return parameters (rough averages for a large-cap US stock)\nmu    = 0.0005   # mean daily return ~ 0.05%\nsigma = 0.015    # daily volatility ~ 1.5%\n\ndist = stats.norm(mu, sigma)\n\nprint('Normal distribution queries:')\nprint(f'  P(lose more than 3% today):  {dist.cdf(-0.03)*100:.2f}%')\nprint(f'  P(gain more than 3% today):  {(1-dist.cdf(0.03))*100:.2f}%')\nprint(f'  5th percentile (daily VaR):  {dist.ppf(0.05)*100:.2f}%')\nprint()\nprint('The +/- sigma rules (memorize these):')\nprint(f'  P(return within +/-1 sigma): {(dist.cdf(mu+sigma) - dist.cdf(mu-sigma))*100:.1f}%  (expect 68%)')\nprint(f'  P(return within +/-2 sigma): {(dist.cdf(mu+2*sigma) - dist.cdf(mu-2*sigma))*100:.1f}%  (expect 95%)')\n\n# ── Part 2: Log-normal -- why stock prices can't go negative ───────────────────\n# If daily log-return ~ Normal, then after T days:\n# S_T = S_0 * exp( sum of T random normal returns )\n# exp(anything) is always > 0 -- prices can never go negative\nS0, T = 100, 252   # starting price $100, 1 year\nnp.random.seed(42)\nsimulated_final = S0 * np.exp(np.random.normal(mu * T, sigma * np.sqrt(T), 100_000))\nprint(f'\\n1-year simulation (100k paths):')\nprint(f'  Mean final price: ${simulated_final.mean():.1f}')\nprint(f'  5th percentile:   ${np.percentile(simulated_final, 5):.1f}  (bad year)')\nprint(f'  95th percentile:  ${np.percentile(simulated_final, 95):.1f}  (good year)')\n\n# ── Part 3: Monte Carlo fan chart ─────────────────────────────────────────────\n# Simulate many random paths and show the spread of outcomes\nnp.random.seed(42)\nn_paths, n_days = 1000, 252\nshocks  = np.random.normal(mu, sigma, (n_paths, n_days))\ncum_ret = np.exp(np.cumsum(shocks, axis=1))   # shape: (1000, 252)\n\nfig, ax = plt.subplots(figsize=(12, 6))\npercentiles = [5, 25, 50, 75, 95]\ncolors      = ['#d62728', '#ff7f0e', '#2ca02c', '#ff7f0e', '#d62728']\nfor p, col in zip(percentiles, colors):\n    ax.plot(np.percentile(cum_ret, p, axis=0), color=col, label=f'P{p}')\n\nax.axhline(1.0, color='white', linewidth=0.5, linestyle='--', label='breakeven')\nax.set(title='Monte Carlo Fan Chart (1000 portfolio paths)',\n       xlabel='Trading Days', ylabel='Portfolio Value (start = 1.0)')\nax.legend(loc='upper left')\nplt.tight_layout()\nplt.show()\n\nfinal_values = cum_ret[:, -1]   # last day values\np_loss_20 = (final_values < 0.80).mean()\np_gain_20 = (final_values > 1.20).mean()\nprint(f'\\nP(lose >20% in 1 year): {p_loss_20:.1%}')\nprint(f'P(gain >20% in 1 year): {p_gain_20:.1%}')"},{"w":3,"title":"Statistics, OLS Regression & Time Series","t":["<b style='color:var(--pc)'>📋 Week note: W7 (hypothesis testing) is critical — you'll use it to validate every backtest. W9 (stationarity/ADF) is critical — use returns not prices. W10 (GARCH) is lighter — run the code, understand the output, move on.</b>","<b style='color:var(--pc)'>── Statistics I — Is This Signal Real or Just Luck? ──</b>","<b>The core question of quant finance:</b> 'My strategy returned 15% last year — is that skill or luck?' Statistics gives you the tools to answer this rigorously. The main tool is hypothesis testing.","<b>Hypothesis testing in plain English:</b> (1) Assume the boring explanation is true: H₀ = 'there's no real effect, this is just random noise'. (2) Compute: 'how unlikely is my data if the boring explanation were true?' (3) If the data would be very unlikely under H₀ (p < 5%), reject H₀ — something real is probably happening.","<b>p-value — the most misunderstood thing in statistics:</b> A p-value is NOT 'the probability that the strategy is real.' It IS 'the probability of seeing results this extreme if there were truly no effect.' Small p → the data would be very unlikely by pure chance → probably something real is happening.","<b>The multiple testing problem — critical for quant:</b> If you test 100 random strategies at p < 5%, you expect ~5 to look 'significant' purely by chance. This is why most backtested strategies fail in production. The fix: use the Bonferroni correction — divide your threshold by the number of tests.","<b>Normality tests:</b> Jarque-Bera tests whether your data's skewness (asymmetry) and kurtosis (fat-tailedness) match a Normal distribution. Stock returns almost always fail — they have 'fat tails' (extreme events happen more often than Normal predicts). Q-Q plots visually show where the distribution departs from Normal.","<b style='color:var(--pc)'>── Statistics II — OLS Regression (How Factors Drive Returns) ──</b>","<b>What is OLS regression?</b> You have a stock's returns (y) and want to know: 'how much of this return is explained by the market going up?' OLS finds the best straight line: y = α + β × market_return + noise. The slope β is 'beta' (market sensitivity), the intercept α is 'alpha' (extra return beyond what the market explains).","<b>The formula — β = (X'X)⁻¹X'y:</b> This looks scary but in Python it's two lines using np.linalg.solve. X is your factor data (e.g. daily SPY returns), y is the stock returns. Always add a column of ones to X for the intercept term (to capture alpha).","<b>t-statistic for a coefficient:</b> t = β ÷ standard_error(β). Large |t| (> 2) means the coefficient is statistically significant — the factor genuinely explains the returns. Small |t| (< 1) means it might just be noise. This is how you distinguish real relationships from coincidences.","<b>R² (R-squared):</b> Fraction of the stock's variance explained by your factors. R² = 0 means your factors explain nothing. R² = 0.3 means they explain 30% of the moves. In daily return prediction, R² = 5–15% is typical and actually very useful. Low R² doesn't mean the model is wrong.","<b>Spurious regression warning:</b> If you regress one price series on another price series (not returns), you'll get high R² and significant t-stats even if they have nothing to do with each other. This is called spurious regression — always use returns, not price levels, in regressions.","<b style='color:var(--pc)'>── Time Series I — Does the Past Predict the Future? ──</b>","<b>Stationarity — the #1 requirement for time series models:</b> A stationary series has constant mean and variance over time — it 'stays in place.' Stock log-RETURNS are approximately stationary (bounce around a stable mean). Stock PRICE LEVELS are NOT stationary (they trend up over decades). All forecasting models require stationarity — if your data isn't stationary, transform it first.","<b>ADF test:</b> A statistical test for stationarity. p < 0.05 → stationary (good). p > 0.05 → non-stationary (take returns or differences). In Python: <code>from statsmodels.tsa.stattools import adfuller; p_value = adfuller(series)[1]</code>.","<b>ACF (Autocorrelation Function):</b> ACF[k] = correlation between today's value and the value k days ago. For stock returns in an efficient market: ACF ≈ 0 at all lags (yesterday's return tells you essentially nothing about today's). For prices: ACF decays very slowly (confirms non-stationarity).","<b>PACF (Partial ACF):</b> Like ACF but removes the indirect effects through intermediate lags. Used together with ACF to identify model order: PACF cuts off at lag p for an AR(p) model, ACF cuts off at lag q for an MA(q) model.","<b>Cointegration — the foundation of pairs trading:</b> Two non-stationary series (like two stock prices) whose combination IS stationary (their spread). Example: Coca-Cola and Pepsi prices drift independently, but their price ratio is stable because arbitrageurs keep them in line. Test: <code>from statsmodels.tsa.stattools import coint</code>.","<b style='color:var(--pc)'>── Time Series II — ARIMA & GARCH Volatility Models ──</b>","<b>ARIMA in plain English:</b> A model that predicts the next value of a time series using its past values and past errors. The '(p, d, q)' parameters: p = how many past values to use, d = how many times to difference to make stationary (usually 0 for returns), q = how many past errors to use. For daily returns, small values (p=1, d=0, q=1) are typical.","<b>GARCH in plain English:</b> ARIMA predicts the return level. GARCH predicts the VOLATILITY. Key observation: 'volatility clustering' — calm days cluster together, turbulent days cluster together. You can see this in any stock chart: quiet periods followed by stormy periods. GARCH models this pattern explicitly.","<b>GARCH(1,1) formula:</b> σ²_t = ω + α×ε²_{t-1} + β×σ²_{t-1}. Meaning: tomorrow's variance = base level + today's shock² × α + today's variance × β. α + β is usually close to 1.0 — meaning volatility is very persistent (a volatile week takes weeks/months to calm down).","<b>AIC (Akaike Information Criterion):</b> A score that balances model fit vs complexity. Lower AIC = better model. Used by auto_arima to choose the best (p,d,q): it tries many combinations and picks the lowest AIC. Think of it as a quality score that penalizes complexity.","<b>Out-of-sample testing — the only honest test:</b> Train your model on the first 80% of data. Test on the last 20% — data the model never saw. If you test on the same data you trained on, you're memorizing answers, not learning. Always report out-of-sample results.","<b>The lookahead bias rule — burn this in:</b> Your webhook/event systems already process data in order. Apply the same discipline here: signal at time T must only use data available before time T. .shift(1) on every signal, no exceptions.","<b>From your experience:</b> Your Eloquent query optimisation (−30% DB response times) is exactly the mindset for OLS — you're finding the minimum-error fit, same as finding the optimal query plan."],"terms":["null hypothesis","p-value","t-statistic","Type I error","Type II error","Bonferroni correction","Jarque-Bera","fat tails","OLS","R-squared","residuals","standard error","beta","alpha","spurious regression","factor loading","stationarity","unit root","ADF test","ACF","PACF","cointegration","random walk","white noise","AR","MA","ARIMA","GARCH","volatility clustering","AIC","BIC","out-of-sample","conditional variance"],"p":"Statistical Report for 15 Stocks + Factor Exposure Model — Build OLS from Scratch + Stationarity Audit of 15 Assets + SPY Volatility Forecasting Model","pd":"Fit ARIMA to SPY log returns (using auto_arima for automatic order selection). Fit GARCH(1,1) using the arch library. Out-of-sample: train on 4 years, test on 1 year. Plot GARCH forecast vs actual rolling volatility. Compute RMSE to quantify accuracy.","deliverables":["<b>Statistics I — Is This Signal Real or Just Luck?:</b>","Summary table: stock, mean daily return, t-statistic, p-value, JB p-value, 'Normal?' column","3×5 Q-Q plot grid — if points follow the diagonal, data is Normal; S-curves at ends = fat tails","Multiple testing analysis: how many significant at raw p<5% vs Bonferroni-corrected threshold","<b>Statistics II — OLS Regression (How Factors Drive Returns):</b>","ols() function from scratch — verified against statsmodels (coefficients must match exactly)","Regression table printed: each factor's beta, t-stat for each of 5 stocks","Residual diagnostic plots: time series of residuals, Q-Q plot, fitted vs actual","<b>Time Series I — Does the Past Predict the Future?:</b>","Summary table: asset, ADF p-value on price levels (expect > 0.05 = not stationary), ADF p-value on returns (expect < 0.05 = stationary)","3×5 ACF plot grid for log returns — should show near-zero autocorrelation","Cointegration test: VIX vs SPY realized vol — print the p-value and interpret it","<b>Time Series II — ARIMA & GARCH Volatility Models:</b>","ARIMA: the selected (p,d,q) order, AIC score, and ACF of residuals (should look like white noise — bars all near zero)","GARCH: print α + β (should be close to 1.0 = high persistence), plot the conditional volatility over time","RMSE comparison: GARCH forecast vs naive baseline (always predict historical average vol)"],"r":["📺 StatQuest — 'Hypothesis Testing' and 'p-values' series on YouTube (essential, very clear)","📖 Think Stats — Allen Downey (free PDF at greenteapress.com/thinkstats2)","🌐 scipy.stats for ttest_1samp, jarque_bera, shapiro: docs.scipy.org/doc/scipy/reference/stats.html","📺 StatQuest — 'Linear Regression' series on YouTube (8 videos, very clear)","📖 Python for Finance — Yves Hilpisch, Chapter 9 (Regression Analysis)","🌐 statsmodels OLS example: statsmodels.org/stable/regression.html","📺 ritvikmath — 'Stationarity', 'ADF Test', 'ACF and PACF' on YouTube (concise and clear)","🌐 statsmodels time series docs: statsmodels.org/stable/tsa.html","📖 Time Series Analysis — James Hamilton (advanced reference for later)","📺 ritvikmath — 'ARIMA' and 'GARCH models' on YouTube (~15 min each, clear explanations)","🌐 arch library docs: arch-py.readthedocs.io","🌐 pmdarima docs: pmdarima.org/en/stable"],"code":"# ═══ Statistics I — Is This Signal Real or Just Luck? ═══\nimport yfinance as yf\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\ntickers = ['AAPL','MSFT','GOOGL','AMZN','NVDA','META','TSLA','JPM','V','JNJ',\n           'WMT','UNH','PG','HD','MA']\nprices  = yf.download(tickers, start='2019-01-01', auto_adjust=False, progress=False)['Adj Close']\nreturns = np.log(prices / prices.shift(1)).dropna()\n\nresults = []\nfor ticker in returns.columns:\n    r = returns[ticker].dropna().values\n\n    # t-test: H0 = mean daily return is exactly 0 (no edge)\n    # t_stat = mean / (std / sqrt(n)) -- how many standard errors away from 0\n    # Large |t_stat| (> 2) means probably not zero\n    t_stat, p_val = stats.ttest_1samp(r, 0)\n\n    # Jarque-Bera: tests skewness and kurtosis against Normal distribution\n    # p < 0.05 means distribution is NOT Normal (fat tails exist)\n    jb_stat, jb_p = stats.jarque_bera(r)\n    kurt = stats.kurtosis(r)   # excess kurtosis: Normal = 0, stocks typically 2-8\n\n    results.append({\n        'Ticker': ticker,\n        'Mean daily %': round(r.mean() * 100, 4),\n        't-stat': round(t_stat, 2),\n        'p-value': round(p_val, 4),\n        'JB p-value': round(jb_p, 6),\n        'Kurtosis': round(kurt, 2),\n        'Normal?': 'NO' if jb_p < 0.05 else 'yes'\n    })\n\ndf = pd.DataFrame(results).set_index('Ticker')\nprint('Statistical tests for 15 stocks:')\nprint(df.to_string())\n\n# Multiple testing problem\nn_tests = len(tickers)\nn_sig_raw  = (df['p-value'] < 0.05).sum()\nbonferroni = 0.05 / n_tests\nn_sig_bonf = (df['p-value'] < bonferroni).sum()\nprint(f'\\nMultiple testing: {n_tests} tests')\nprint(f'  Significant at raw p<0.05:        {n_sig_raw}/{n_tests}  (may include false positives!)')\nprint(f'  Bonferroni threshold: p < {bonferroni:.4f}')\nprint(f'  Significant after Bonferroni:     {n_sig_bonf}/{n_tests}  (more conservative, more honest)')\n\n# Q-Q Plot grid: visual test for Normality\n# If data is Normal: points follow the diagonal line\n# S-curves at the ends = fat tails (very common for stocks)\nfig, axes = plt.subplots(3, 5, figsize=(16, 9))\nfor ax, ticker in zip(axes.flat, returns.columns):\n    stats.probplot(returns[ticker].dropna(), dist='norm', plot=ax)\n    ax.set_title(ticker, fontsize=9)\n    ax.set_xlabel(''); ax.set_ylabel('')\nplt.suptitle('Q-Q Plots -- points off the diagonal = NOT Normal (fat tails!)', fontsize=11)\nplt.tight_layout()\nplt.show()\n\n# ═══ Statistics II — OLS Regression (How Factors Drive Returns) ═══\nimport yfinance as yf\nimport numpy as np\nimport statsmodels.api as sm\n\ntickers = ['SPY', 'GLD', 'TLT', 'AAPL', 'MSFT', 'TSLA', 'JPM', 'JNJ']\nprices  = yf.download(tickers, start='2019-01-01', auto_adjust=False, progress=False)['Adj Close']\n# Resample to monthly: sum of daily log returns within each month\nmonthly = np.log(prices / prices.shift(1)).resample('ME').sum().dropna()\n\nfactors = monthly[['SPY', 'GLD', 'TLT']].values\nstocks  = ['AAPL', 'MSFT', 'TSLA', 'JPM', 'JNJ']\n\ndef ols_from_scratch(X, y):\n    \"\"\"\n    OLS regression from scratch using NumPy only.\n    X: feature matrix, shape (T, k) -- factors + intercept column\n    y: target vector, shape (T,) -- stock returns\n    Returns: (betas, t_stats, r_squared)\n    \"\"\"\n    n, k = X.shape\n\n    # beta = (X'X)^-1 * X'y  -- but use solve() not inv() for numerical stability\n    beta = np.linalg.solve(X.T @ X, X.T @ y)\n\n    y_hat = X @ beta          # model predictions\n    resid = y - y_hat         # what the model couldn't explain\n\n    # R-squared = fraction of total variance explained by the model\n    RSS = resid @ resid                     # residual sum of squares\n    TSS = ((y - y.mean()) ** 2).sum()      # total sum of squares\n    r2  = 1 - RSS / TSS\n\n    # Standard errors for t-statistics\n    sigma2   = RSS / (n - k)\n    var_beta = sigma2 * np.linalg.inv(X.T @ X)\n    t_stats  = beta / np.sqrt(np.diag(var_beta))\n\n    return beta, t_stats, r2\n\nprint(f'{\"Stock\":6s} | {\"alpha (monthly)\":>14s} | {\"beta_SPY\":>9s} | {\"beta_GLD\":>9s} | {\"beta_TLT\":>9s} | {\"R^2\":>6s}')\nprint('-' * 70)\n\nX = np.column_stack([np.ones(len(factors)), factors])  # add intercept column\nfor ticker in stocks:\n    y = monthly[ticker].values\n    beta, tstat, r2 = ols_from_scratch(X, y)\n    print(f'{ticker:6s} | {beta[0]*100:>12.3f}%  | {beta[1]:>9.2f} | {beta[2]:>9.2f} | {beta[3]:>9.2f} | {r2:>6.3f}')\n\nprint('\\nVerification with statsmodels (AAPL) -- should match exactly:')\ny = monthly['AAPL'].values\nmodel = sm.OLS(y, sm.add_constant(factors)).fit()\nprint(model.summary())\n\n# ═══ Time Series I — Does the Past Predict the Future? ═══\nimport yfinance as yf\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom statsmodels.tsa.stattools import adfuller, coint\nfrom statsmodels.graphics.tsaplots import plot_acf, plot_pacf\n\ntickers = ['AAPL','SPY','GLD','TLT','^VIX','BTC-USD','XOM','JPM','AMZN','NVDA',\n           'IEF','AGG','UNG','DBA','VNQ']\nprices  = yf.download(tickers, start='2019-01-01', auto_adjust=False, progress=False)['Adj Close']\nreturns = np.log(prices / prices.shift(1)).dropna()\n\n# ── ADF test ──────────────────────────────────────────────────────────────────\n# H0 = 'the series has a unit root' = 'it drifts / is non-stationary'\n# p < 0.05 -> reject H0 -> series IS stationary\n# Price levels: almost always fail (p > 0.05) -- they trend\n# Log returns: almost always pass (p < 0.05) -- they bounce around a stable mean\n\nprint('ADF Stationarity Test (p < 0.05 = stationary):')\nprint(f'{\"Asset\":12s}  {\"Price p-val\":>12s}  {\"Return p-val\":>13s}')\nprint('-' * 42)\nfor t in list(prices.columns)[:8]:\n    p_price  = adfuller(prices[t].dropna())[1]\n    p_return = adfuller(returns[t].dropna())[1]\n    print(f'{t:12s}  {p_price:>12.4f}  {p_return:>13.5f}')\n\n# ── ACF and PACF plots ────────────────────────────────────────────────────────\n# ACF[lag k] = correlation between today and k days ago\n# For log returns: bars should be tiny (inside the blue confidence band)\n# For price levels: bars decay slowly (non-stationary, confirms ADF result)\nfig, axes = plt.subplots(2, 2, figsize=(14, 8))\nplot_acf( returns['SPY'].dropna(), lags=30, ax=axes[0,0], title='SPY RETURNS ACF (should be near zero)')\nplot_pacf(returns['SPY'].dropna(), lags=30, ax=axes[0,1], title='SPY RETURNS PACF')\nplot_acf( prices['SPY'].dropna(),  lags=30, ax=axes[1,0], title='SPY PRICE ACF (decays slowly = non-stationary!)')\nplot_pacf(prices['SPY'].dropna(),  lags=30, ax=axes[1,1], title='SPY PRICE PACF')\nplt.tight_layout()\nplt.show()\n\n# ── Cointegration test ────────────────────────────────────────────────────────\n# Two non-stationary series can be 'cointegrated' if their spread is stationary\n# Foundation of pairs trading\nspy = prices['SPY'].dropna()\ngld = prices['GLD'].dropna()\naligned_spy, aligned_gld = spy.align(gld, join='inner')\n\nt_stat, p_val, _ = coint(aligned_spy, aligned_gld)\nprint(f'\\nCointegration test -- SPY vs GLD:')\nprint(f'  p-value: {p_val:.4f}')\nprint(f'  Cointegrated: {\"YES -- pairs trade possible\" if p_val < 0.05 else \"NO -- not cointegrated\"}')\n\n# ═══ Time Series II — ARIMA & GARCH Volatility Models ═══\n# Install first: pip install arch pmdarima\nimport yfinance as yf\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom pmdarima import auto_arima\nfrom arch import arch_model\n\ndf      = yf.download('SPY', start='2015-01-01', auto_adjust=False, progress=False)\nreturns = np.log(df['Adj Close'] / df['Adj Close'].shift(1)).dropna() * 100  # in %\nprint(f'Downloaded {len(returns)} daily SPY returns')\n\n# ── ARIMA model ────────────────────────────────────────────────────────────────\n# auto_arima tries many (p,d,q) combinations and picks the best by AIC\n# For daily stock returns, it often selects (0,0,0) -- because returns are hard to predict!\nprint('\\nFitting ARIMA...')\narima = auto_arima(returns, start_p=0, start_q=0, max_p=3, max_q=3,\n                   information_criterion='aic', stepwise=True,\n                   seasonal=False, verbose=False)\nprint(f'Best ARIMA order: {arima.order}')\nprint(f'AIC score: {arima.aic():.2f}')\n\n# ── GARCH(1,1) model ──────────────────────────────────────────────────────────\n# GARCH models how volatile the market is (not the return direction)\n# sigma^2_t = omega + alpha * (yesterday shock)^2 + beta * (yesterday variance)\n# Interpretation: tomorrow's risk = base + how shocked we were today + how risky yesterday was\nprint('\\nFitting GARCH(1,1)...')\ngarch_model = arch_model(returns, vol='Garch', p=1, q=1, mean='Constant')\nres = garch_model.fit(disp='off')\nprint(res.summary())\n\nalpha = res.params['alpha[1]']\nbeta  = res.params['beta[1]']\nprint(f'\\nalpha = {alpha:.4f}  (today shock -> tomorrow vol)')\nprint(f'beta  = {beta:.4f}  (yesterday vol -> tomorrow vol)')\nprint(f'alpha + beta = {alpha+beta:.4f}  (close to 1.0 = high persistence, vol takes weeks to calm down)')\n\n# ── Out-of-sample test ────────────────────────────────────────────────────────\nsplit = int(len(returns) * 0.8)\ntrain = returns.iloc[:split]\ntest  = returns.iloc[split:]\n\ng_train = arch_model(train, vol='Garch', p=1, q=1, mean='Constant').fit(disp='off')\nfitted_vol  = np.sqrt(g_train.conditional_volatility) * np.sqrt(252)  # annualized\nrealized_vol = returns.rolling(21).std().dropna() * np.sqrt(252)\n\nplt.figure(figsize=(12, 5))\nplt.plot(fitted_vol.index, fitted_vol, label='GARCH fitted vol', alpha=0.8)\nplt.plot(realized_vol.index, realized_vol, label='21-day realized vol', alpha=0.8)\nplt.axvline(returns.index[split], color='red', linestyle='--', label='train/test split')\nplt.legend()\nplt.title('GARCH Volatility vs Realized Vol')\nplt.show()"},{"w":4,"title":"Markets, Options, Order Books & Portfolio Theory","t":["<b style='color:var(--pc)'>📋 Week note: W11 (markets 101) = half day, you know exchanges from crypto. W12 (options) = 2 days, genuinely new, take your time. W13 (order book) = 1 day, your Wigl transaction processing maps directly to this. W14 (MPT) = 0.5 day.</b>","<b style='color:var(--pc)'>── Financial Markets 101 ──</b>","Asset classes: equity (ownership), fixed income (debt), derivatives (contracts on underlying), FX (currencies), commodities. As QD, you will mostly work with equities and equity derivatives.","Market participants: buy-side (funds — they take risk), sell-side (banks/brokers — they facilitate), market makers (continuously quote bid/ask, profit from spread), HFTs (market makers at µs scale).","Order types cold: market (fill immediately at best available price), limit (fill only at specified price or better), stop (triggers when price crosses level), fill-or-kill (all or cancel), iceberg (hidden qty).","Exchange vs OTC: exchange-traded = standardized, centrally cleared, e.g. NYSE, CME. OTC = bilateral agreements, e.g. most FX and swaps. You interact with both via FIX protocol.","NBBO (National Best Bid and Offer): the best bid/ask consolidated across all US trading venues. Broker must route orders to achieve best execution. This is why market fragmentation matters.","<b style='color:var(--pc)'>── Options & Derivatives ──</b>","Call option: right (not obligation) to BUY 100 shares at strike K before expiry T. Max loss = premium paid. Max gain = unlimited. Breakeven = K + premium. Long call = bullish.","Put option: right to SELL at K. Max loss = premium. Max gain = K − premium. Breakeven = K − premium. Long put = bearish or hedge for existing stock position.","Intrinsic value: max(S−K, 0) for call, max(K−S, 0) for put. Time value = option price − intrinsic. ATM options have ZERO intrinsic, maximum time value.","Put-call parity: C − P = S − K·e^(−rT). This is a no-arbitrage relationship. If violated, a risk-free profit exists. Know the arbitrage strategy: if LHS > RHS, sell call, buy put, buy stock, borrow.","Futures: obligation to buy/sell at price F at date T. F = S·e^((r−q)T) = cost of carry. Marked-to-market daily. ES futures = S&P 500 futures. Used for hedging and speculation.","<b style='color:var(--pc)'>── Market Microstructure ──</b>","Limit Order Book: bids (buyers) sorted high→low, asks (sellers) sorted low→high. Best bid = highest buy price. Best ask = lowest sell price. Spread = ask − bid. A market order consumes the best limit order.","Price-time priority: orders at same price filled first-in-first-out. This is why HFT firms co-locate at exchanges — being 10µs earlier means front-of-queue = better fills and less adverse selection.","Bid-ask spread decomposition: (1) adverse selection cost (informed traders know more than market maker), (2) inventory risk, (3) order processing cost. The bigger the adverse selection, the wider the spread.","Market impact: a large buy order moves price UP against you before it is fully filled. Impact ≈ proportional to √(order_size / ADV). This is why execution algorithms (TWAP/VWAP) exist.","Level 1/2/3 data: L1 = best bid/ask only (free). L2 = full order book depth (thousands/month from exchanges). L3 = individual order events (very expensive). yfinance gives L1 only.","<b style='color:var(--pc)'>── Portfolio Theory I — MPT & Efficient Frontier ──</b>","Portfolio expected return: E[R_p] = w·μ (dot product). If AAPL expects 15% and MSFT 12%, 50/50 = 13.5%. Linear in weights.","Portfolio variance: σ²_p = w·Σ·w. KEY INSIGHT: combining assets with ρ<1 reduces variance BELOW the weighted average — this is diversification, the only free lunch in finance.","Efficient frontier: all portfolios with minimum variance for each expected return level. Portfolios below/right are suboptimal (same risk, lower return). Compute by minimizing w·Σ·w subject to constraints.","Sharpe ratio: (E[R_p] − r_f) / σ_p. Tangency portfolio = maximum Sharpe ratio. Every rational investor should hold the tangency portfolio mixed with cash (per MPT).","MPT limitations: (1) uses historical estimates as future inputs (estimation error explodes weights), (2) assumes Normal returns (ignores fat tails), (3) weights highly sensitive to small input changes. Always regularize in practice.","<b>From your experience:</b> Your Wigl crypto order/transaction processing is a simplified order management system. The concepts (order state machine, fills, cancellations, webhooks as execution reports) map directly to W13 and to FIX protocol in Phase 4.","<b>Options vocab to memorize cold:</b> Call = right to buy. Put = right to sell. Strike K = agreed price. Delta = option price change per $1 stock move. Vega = option price change per 1% vol change. These appear in every quant interview."],"terms":["buy-side","sell-side","market maker","bid","ask","spread","ECN","NBBO","order book","dark pool","call","put","strike","expiry","intrinsic value","time value","ITM","ATM","OTM","put-call parity","futures","cost of carry","LOB","price-time priority","adverse selection","market impact","ADV","Level 1/2","co-location","queue position","fill","efficient frontier","min-variance portfolio","tangency portfolio","Sharpe ratio","diversification","mean-variance optimization","risk aversion"],"p":"Multi-Asset Market Dashboard + Option Payoff Diagram Generator + Limit Order Book Matching Engine + Efficient Frontier Visualization","pd":"For 10 stocks: Monte Carlo simulate 50,000 random weight portfolios (Σwᵢ=1, wᵢ≥0). Plot σ vs E[R] scatter colored by Sharpe ratio. Mark min-variance and max-Sharpe portfolios. Compare to equal-weight 1/N.","deliverables":["<b>Financial Markets 101:</b>","Dashboard refreshes on every run — no hardcoded values","Sector heatmap with YTD return color-coding (green/red)","30-day correlation matrix for the 10 stocks","<b>Options & Derivatives:</b>","6+ strategies implemented as separate functions","Breakeven point(s) computed analytically and annotated on chart","Show both payoff at expiry AND current BS value at 30 days to expiry","<b>Market Microstructure:</b>","LOB class with 3 methods, price-time priority correctly implemented","Fill objects generated with: price, qty, aggressor side, timestamp","Test with a scripted sequence of 25+ events including cancels and partial fills","<b>Portfolio Theory I — MPT & Efficient Frontier:</b>","50,000-point scatter with Sharpe ratio colorbar (yellow=high Sharpe)","Min-variance and max-Sharpe portfolios highlighted, weights shown in a bar chart","Equal-weight portfolio marked — is it on the efficient frontier?"],"r":["📖 Options, Futures & Other Derivatives – John Hull, Ch.1–2 (own this book, it is the reference)","🌐 Investopedia → Markets section (read thoroughly)","📺 Patrick Boyle – 'How Does the Stock Market Work?' (YouTube)","📖 Hull – Options, Futures & Other Derivatives, Ch.1–10","📖 Option Volatility & Pricing – Sheldon Natenberg (practitioner bible)","🌐 Investopedia → Options section","📖 Advances in Financial ML – López de Prado, Ch.2 (microstructure features)","📺 Patrick Boyle – 'Market Microstructure Explained' (YouTube)","📄 'Empirical Market Microstructure' – Hasbrouck (advanced, for later)","🌐 PyPortfolioOpt docs: pyportfolioopt.readthedocs.io","📄 Markowitz 1952 'Portfolio Selection' (free online, 5 pages — read the original)","📺 Patrick Boyle – 'Modern Portfolio Theory' (YouTube)"]},{"w":5,"title":"CAPM, Risk Metrics, Fixed Income & Data Pipelines","t":["<b style='color:var(--pc)'>📋 Week note: W16 (risk metrics) = most important this week — VaR/CVaR/drawdown appear in every risk interview. W17 (bonds/duration) = 1 day, know it conceptually. W18 (data pipelines) = half day MAX, you've built production data pipelines.</b>","<b style='color:var(--pc)'>── Portfolio Theory II — CAPM & Factor Models ──</b>","CAPM: E[Rᵢ] = Rᶠ + βᵢ(E[Rₘ]−Rᶠ). Expected return = risk-free rate + beta × market risk premium. The model says you should ONLY be compensated for systematic risk — idiosyncratic risk is diversifiable and thus free to eliminate.","Beta via OLS: βᵢ = Cov(Rᵢ,Rₘ)/Var(Rₘ) = the slope when regressing stock returns on market returns. Compute with scipy.stats.linregress(market_returns, stock_returns). Rolling beta: use rolling 252d windows.","Alpha: the OLS regression intercept. α = actual return − CAPM prediction. Positive alpha = risk-adjusted outperformance. Test if statistically significant using t-stat = α / se(α). Most alphas are not significant.","Fama-French 3-factor: Rᵢ = α + β₁·Mkt + β₂·SMB + β₃·HML + ε. SMB = small minus big (size premium). HML = high minus low B/M (value premium). Download factor returns FREE from Ken French's data library.","Risk decomposition using factors: total portfolio risk = w·Σ·w = factor risk + idiosyncratic risk. 'This portfolio has 65% market risk, 15% sector risk, 20% stock-specific risk.' Used by risk managers daily.","<b style='color:var(--pc)'>── Risk Metrics ──</b>","VaR (Value-at-Risk): 'with 95% confidence, portfolio will not lose more than X% in 1 day.' Three methods: parametric (assume Normal, VaR = μ−1.645σ), historical simulation (5th percentile of past returns), Monte Carlo (simulate returns, take percentile).","Expected Shortfall (CVaR / ES): average loss conditional on exceeding VaR. ES_95% = E[Loss | Loss > VaR_95%]. Better than VaR because it describes the tail shape. Basel III requires banks to use ES over VaR.","Max drawdown: max peak-to-trough loss over a period. rolling_max = cum_ret.cummax(); drawdown = (cum_ret − rolling_max)/rolling_max. A 50% drawdown requires a 100% gain to recover — asymmetric pain.","Sortino ratio: (R_p − R_f) / σ_downside where σ_downside = std of negative returns only. Better than Sharpe for strategies with positive skewness — doesn't penalize upside volatility.","Risk attribution: total portfolio risk = √(w·Σ·w). Marginal contribution of asset i = (Σw)_i × w_i / σ_p. Risk contribution % per stock often surprises: a 5% position can drive 30% of portfolio risk.","<b style='color:var(--pc)'>── Fixed Income Basics ──</b>","Bond price formula: P = Σ[C/(1+y)^t] + F/(1+y)^T where C=coupon/2, F=face value, y=YTM/2 (semi-annual). A bond is a discounted cashflow calculation. Implement as a simple NumPy sum.","YTM (Yield to Maturity): the discount rate making P = PV of all cashflows. No closed form — solve numerically using scipy.optimize.brentq(). Inverse relationship: price rises when yield falls.","Modified Duration: % price change per 1% yield change ≈ −ΔP/(P·Δy). A 10yr bond with duration 8 falls ~8% when rates rise 1%. Duration is the single most important risk metric for bonds.","Convexity: second-order correction. ΔP/P ≈ −D·Δy + ½·Convexity·Δy². Long bonds have positive convexity = they gain more when yields fall than they lose when yields rise. Beneficial for holders.","Yield curve: plot YTM vs maturity for same-quality bonds (e.g. US Treasuries). Normal = upward sloping. Inverted (short > long yields) = historically predicts recessions. Fetch live from FRED API (free).","<b style='color:var(--pc)'>── Financial Data Pipelines ──</b>","Adjusted vs raw prices: stock price drops on ex-dividend date (dividend is removed). Raw 'Close' shows this as a fake loss. 'Adj Close' restores continuity. Always use adjusted prices for backtest return calculation.","Data quality checklist: (1) missing dates (exchange holidays vs genuine gaps?), (2) price outliers (>10% 1-day moves — split? data error?), (3) zero volume (suspended trading?), (4) stale prices (price unchanged 3+ days = suspicious).","Multiple sources: yfinance (free, good enough for learning), Polygon.io (better quality, free tier), FRED (macro data — free), Quandl/NASDAQ Data Link (fundamentals). Build pipelines that merge these.","Parquet format: columnar storage, 10× faster query than CSV for analytical workloads. pd.to_parquet('data.parquet'), pd.read_parquet(). Partition by year: pd.to_parquet('data/', partition_cols=['year']). Standard for financial data lakes.","Idempotency: re-running the pipeline should not create duplicates or corrupt data. Use upsert logic: if data exists, update it; if not, insert. This is the same principle as Laravel database migrations — familiar territory for you.","<b>From your experience:</b> Your S3/Redis/database health monitoring (Wigl) IS an observability system. Your Amplitude/Adjust/Brevo marketing pipeline IS a financial data pipeline. W18 is review — spend the saved time on W16 risk metrics.","<b>Risk metrics to know cold:</b> VaR = max expected loss at X% confidence. CVaR/Expected Shortfall = average loss on worst X% of days. Max drawdown = worst peak-to-trough loss. Sharpe = return÷risk. Sortino = return÷downside_risk."],"terms":["CAPM","beta","alpha","systematic risk","idiosyncratic risk","SMB","HML","factor model","risk decomposition","VaR","CVaR","Expected Shortfall","max drawdown","Sharpe","Sortino","Calmar","risk attribution","marginal risk contribution","bond price","coupon","face value","YTM","duration","convexity","yield curve","basis points","FRED API","inverted curve","adjusted close","corporate action","ex-dividend","Parquet","idempotent","data quality","upsert","partitioning","data lake"],"p":"CAPM Beta, Alpha & Fama-French Regression + Portfolio Risk Analytics Engine + Bond Pricing & Yield Curve Tool + Production-Grade Data Pipeline","pd":"Build a DataPipeline class: fetch 5yr daily OHLCV for 100 stocks, run quality checks (missing/outliers/stale), log issues per stock, store clean data to date-partitioned Parquet. Re-run → no duplicates.","deliverables":["<b>Portfolio Theory II — CAPM & Factor Models:</b>","Rolling beta chart for all 10 stocks — show beta compression during 2020","FF3 regression table: β_mkt, β_smb, β_hml, α, t-stats, R² for each stock","Scatter: CAPM-predicted vs actual annual returns — which stocks deviate most?","<b>Risk Metrics:</b>","Clean class with type hints and docstrings","All 3 VaR methods returning consistent results (within 20% of each other)","Risk attribution: which stock contributes most risk? (often surprisingly concentrated)","<b>Fixed Income Basics:</b>","bond_price() verified: $1000 face, 5% coupon, 10yr, YTM=5% → price = $1000.00","ytm_solver() verified: solve for YTM then plug back into bond_price() → matches market price","Live US Treasury yield curve: 3m/6m/1yr/2yr/5yr/10yr/30yr plotted","<b>Financial Data Pipelines:</b>","DataPipeline.run() method that is fully idempotent","Validation report: per-stock issues (missing dates count, outliers flagged)","Parquet files: verify pd.read_parquet() loads correctly and returns clean data"],"r":["🌐 Kenneth French Data Library: mba.tuck.dartmouth.edu/pages/faculty/ken.french (free)","📄 Fama & French 1993 paper (free on SSRN)","📺 Patrick Boyle – 'CAPM Explained' (YouTube)","📄 Risk Metrics Technical Document – JP Morgan (Google 'RiskMetrics 1996 PDF', free)","📖 Philippe Jorion – Value at Risk (the risk management textbook)","🌐 PyPortfolioOpt docs → risk contributions","📖 Hull – Ch.4 Interest Rates","🌐 FRED API: fred.stlouisfed.org (free, no API key needed for basic use)","📺 Patrick Boyle – 'Bond Pricing Explained' (YouTube)","📖 Python for Finance – Hilpisch, Ch.7","🌐 Apache Arrow/Parquet docs: arrow.apache.org/docs/python/parquet.html","🌐 Polygon.io docs: polygon.io/docs (free tier gives 5yr data)"]},{"w":6,"title":"Black-Scholes, All Greeks & Implied Volatility","t":["<b style='color:var(--pc)'>📋 Week note: W19 (BS formula) = 1 day. W20 (Greeks) = 1.5 days — Delta and Gamma are the most important. W21 (IV solver) = 0.5 day. Treat each formula like an API endpoint: unit test against known values before moving on.</b>","<b style='color:var(--pc)'>── Option Pricing — Black-Scholes ──</b>","GBM assumption: dS = μS·dt + σS·dW. Stock log-returns follow N((μ−σ²/2)T, σ²T). This is why prices are log-normally distributed and log-returns are approximately Normal.","BS formula: C = S·N(d₁) − K·e^(−rT)·N(d₂) where d₁=[ln(S/K)+(r+σ²/2)T]/(σ√T), d₂=d₁−σ√T. Implement as: def d1(S,K,T,r,sig), def d2(S,K,T,r,sig), def bs_call(S,K,T,r,sig), def bs_put(S,K,T,r,sig).","scipy.stats.norm.cdf() computes N(). Split into helper functions — this makes Greeks trivial to implement in the next week because d1 and d2 are already extracted.","Verify put-call parity: C − P should equal S − K·e^(−rT). If |C−P−(S−K·e^(−rT))| > 1e-10 your implementation is wrong. This is your unit test.","BS limitations to know: (1) constant vol assumption is violated (vol smile exists), (2) no jumps, (3) no dividends (fix: replace S with S·e^(−qT)), (4) continuous trading. Despite this, BS is the universal quoting convention for options.","<b style='color:var(--pc)'>── Option Greeks ──</b>","Delta Δ = N(d₁) for a call, ranges (0,1). Δ=0.6 means: $1 stock move → $0.60 option move. To delta-hedge a call: short Δ shares of stock. Portfolio then has zero sensitivity to small stock moves.","Gamma Γ = N'(d₁) / (S·σ·√T). Always positive for long options. Gamma is why delta-hedging isn't perfect — Γ means delta changes as stock moves. Long Gamma = profit from large moves regardless of direction.","Vega ν = S·N'(d₁)·√T. Always positive for long options. If Vega=0.05, a 1% increase in implied vol adds $0.05 to option price. Highest ATM. The most traded Greek in practice.","Theta Θ = −[S·N'(d₁)·σ/(2√T) + r·K·e^(−rT)·N(d₂)]. Usually negative (options lose value with time). Highest for ATM near expiry. Daily thet
