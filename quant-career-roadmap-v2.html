erstand [specific concept]. I'm aware I'm still building production experience and plan to continue deepening it.' Depth of understanding + honesty beats bluffing.","<b>Salary negotiation:</b> Never accept the first offer. 'I'm very excited about this role. I was expecting something closer to [X+15%] based on my research on comparable roles and my fintech background. Is there flexibility?' Works 60% of the time."],"terms":["technical screen","system design","culture fit","salary negotiation","offer letter","notice period","counter-offer"],"p":"Pass 2 Technical Screens","pd":"Execute your interview pipeline. Goal: receive at least 1 job offer from a Tier 2 EU QD role within 6 weeks of starting applications. Keep LeetCode warm (1 problem/day). Review probability puzzles the night before each technical screen.","deliverables":["At least 2 technical screens completed (pass or fail — both are learning)","Post-interview notes: what was asked, what you answered, what you'd improve","1 job offer received and negotiated","Signed contract at a QD-adjacent role"],"r":["📖 'Heard on the Street' — reread the night before each probability screen","🌐 glassdoor.com — search your target firm + 'Quant Developer' for real interview questions","🌐 leetcode.com — 1 medium per day to stay warm, don't let the skill decay","📺 'Salary Negotiation' — Patrick McKenzie blog (best resource on this topic, free)","🌐 getcracked.io — Quant Dev 250: aim for 100+ questions this week, timed","🌐 tradertest.optiver.com — daily practice, target 70+ score before applying","🌐 reddit.com/r/quant — search 'Optiver interview experience' and 'IMC interview' for real reports"]},{"w":33,"title":"First 90 Days — Learning in Production","t":["<b style='color:var(--pc)'>📋 You're in your first QD role. This is the highest-leverage learning period of your career. Absorb everything. Ask more questions than feels comfortable. The codebase you're working in is worth more than any textbook.</b>","<b>The production C++ gap closes fast here:</b> Reading and modifying real trading system C++ code teaches you more in 3 months than 6 months of self-study. Focus on understanding the existing codebase deeply before writing new code.","<b>Ask these questions in your first week:</b> What is the end-to-end flow of a single trade from signal to fill? What is the latency budget at each stage? What breaks most often in production? What does the on-call rotation look like? Where is the runbook?","<b>Learn the business first:</b> Understand what strategies you're supporting, what instruments they trade, what their risk limits are, how PnL is attributed. You cannot build good infrastructure for a business you don't understand.","<b>Find a senior C++ mentor:</b> Identify the best C++ engineer on the team and ask if they'll do informal code reviews of your PRs. 'I'm actively trying to improve my C++ — would you be open to giving me feedback beyond the standard review?' Most senior engineers say yes.","<b>Start GT OMSCS application now:</b> Applications open typically in March (for fall) and September (for spring). Requirements: bachelor's degree, 3 letters of recommendation, statement of purpose. Apply in your first month of working — don't wait.","<b>Build your internal reputation fast:</b> Fix a real bug in your first week (there's always one). Document something that wasn't documented. Automate something manual. Small wins compound. Your web dev experience means you can ship production code faster than a new grad.","<b>Keep studying in parallel — 1hr/day minimum:</b> C++ competitive programming (Codeforces, target 1600 rating). Keep your math skills warm. The gap to Tier 1 is still large — you're closing it from both ends now (study + experience)."],"terms":["onboarding","codebase reading","code review","production incident","runbook","GT OMSCS","mentor","Codeforces rating"],"p":"90-Day Learning Plan","pd":"Write a 90-day learning plan for your new role. Week 1: understand the full trade lifecycle. Week 2-4: read the core C++ codebase, understand every component. Month 2: make meaningful code contributions. Month 3: own a feature end-to-end. Separately: submit GT OMSCS application.","deliverables":["Trade lifecycle diagram: tick → signal → risk check → order → fill → PnL, with latency at each stage","Codebase map: every major component, its responsibility, its interfaces","GT OMSCS application submitted (or planned submission date confirmed)","Codeforces account: 10 rated contests entered, working toward 1400+ rating"],"r":["🌐 omscs.gatech.edu — Georgia Tech OMSCS program details and application","🌐 omscentral.com — reviews of every GT OMSCS course (critical for choosing courses)","🌐 codeforces.com — enter rated contests regularly, not just practice problems","📺 'How to Read Code' — YouTube, multiple good videos on navigating large codebases"]},{"w":34,"title":"Months 3–9 — Deepen, Build, Position","t":["<b style='color:#F5A623'>⚡ Amsterdam fast track — if you land Optiver/IMC/Flow Traders:</b> This changes the timeline significantly. If you're at Optiver Amsterdam as a Junior Dev earning $405k total comp by month 9, you've already hit the $300k+ goal. The US path becomes optional — take it if you want to maximize further, but you've achieved the core financial objective. The roadmap continues to be relevant (C++ deepening, competitive programming) but the urgency of the US move decreases.","<b>Dutch 30% ruling in practice:</b> As a French national working in the Netherlands for the first time, you qualify. Effect: 30% of your salary is tax-free for up to 5 years. On a €150k base: you pay tax on €105k instead of €150k. That's roughly €15-20k/year extra take-home vs a Dutch national in the same role. Apply through your employer in your first week.","<b>Amsterdam → US transition (if you want it):</b> After 2-3 years at Optiver/IMC Amsterdam, you have: (1) Tier 1 firm on your CV, (2) real HFT production C++ experience, (3) a much stronger O-1A visa case (high salary documented, critical role at distinguished org). Optiver has a Chicago office — internal transfer is the cleanest path to the US.","<b style='color:#00C47C'>🔗 getcracked.io — ongoing use:</b> Keep getcracked.io open throughout your first role. The Quant Dev 250 questions you couldn't answer in Phase 1 — revisit them monthly. In production, you'll understand them differently. Aim to get through all 250 before the end of Year 1.","<b style='color:var(--pc)'>📋 You're past the initial learning curve. Now you're compounding. Every month of production QD experience makes the next career step easier. Use this period to build the signal that Tier 1 US firms look for.</b>","<b>What Tier 1 US firms look for beyond skills:</b> (1) Demonstrable impact in a trading context — specific latency improvements, specific PnL attributable systems. (2) C++ production experience — years, not months. (3) Degree signal — GT OMSCS or equivalent. (4) Competitive programming signal — Codeforces 1600+ or competition wins. (5) Strong technical writing — blog posts showing deep understanding.","<b>Build your measurable impact list:</b> Every optimisation you make at work, write it down with numbers. 'Reduced market data handler p99 from 45µs to 12µs by replacing std::map with custom hash map.' 'Eliminated 2GB memory leak in overnight risk batch.' These are your Tier 1 interview stories.","<b>GT OMSCS course selection for QD:</b> Take in order: (1) Computing for Data Analysis (easiest, warms up coding). (2) Machine Learning (core ML, very applicable). (3) High Performance Computing (directly relevant). (4) Computational Finance (directly relevant). (5) Graduate Algorithms (competitive programming, interview prep). Budget: 2 courses per semester max while working full-time.","<b>Codeforces grind:</b> Target Codeforces Expert (1600) within 12 months of starting. Enter every Div 2 contest. Upsolve the problems you couldn't solve in contest. At 1600, you can solve Div 2 C problems reliably — the level Tier 1 screens operate at.","<b>Start US visa research now:</b> O-1A visa (extraordinary ability) is the realistic path for someone without a US job offer yet. Requires: published work, citations, high salary, membership in associations, judging others' work, critical role at distinguished org. Start building these criteria now — it takes 1-2 years to accumulate.","<b>Network with US firms from EU:</b> Attend QuantLib User Conference, CppCon (online), QCon. Comment thoughtfully on papers by researchers at target firms. Contribute to open source projects they maintain. Build a reputation before applying.","<b>Technical blog — start now:</b> Write 1 post per month. Topics: things you implemented at work (anonymised), deep dives on C++ performance, replication of a quant paper. These compound — a body of technical writing is a signal that no degree provides."],"terms":["O-1A visa","GT OMSCS","Codeforces Expert","technical blog","open source contribution","US networking","impact quantification","performance story"],"p":"6-Month Impact + Position Plan","pd":"By end of month 9: (1) 3+ quantified performance improvements at work documented. (2) GT OMSCS first semester complete (1 course). (3) Codeforces rating 1500+. (4) Technical blog with 6+ posts published. (5) 3+ connections at US Tier 1/2 firms from conferences or open source.","deliverables":["Impact log: 5+ work achievements with specific numbers (latency, throughput, memory)","GT OMSCS: at least 1 course completed with grade B+ or above","Codeforces: rated 1500+ (Specialist level), 20+ rated contests entered","Technical blog: 6 posts published, 2 with 500+ views, linked from LinkedIn profile"],"r":["🌐 omscs.gatech.edu/program-info/admission-criteria","🌐 codeforces.com/blog/entry/62690 — how to improve your Codeforces rating","🌐 dev.to or medium.com — publish your technical blog posts here for distribution","📄 USCIS O-1A visa requirements: uscis.gov/working-in-the-united-states/temporary-workers/o-1-visa"]}]},{"n":4,"c":"#F5A623","d":"rgba(245,166,35,0.11)","title":"Phase 3 — Sharpen the Edge (Year 2)","range":"Year 2  · ~12 months · Working full-time + studying","desc":"Year 2: you have real QD experience, GT OMSCS courses completed, and growing competitive programming skills. Now build the specific signals that Tier 1 US firms (Jane Street, Citadel, HRT, Two Sigma) filter on: advanced C++, ML in finance, high-frequency trading systems, and the O-1A visa pathway. This is the grinding year.","skills":["Advanced C++23","HFT Systems","ML Trading","Codeforces Expert","GT OMSCS","O-1A Visa Prep","US Networking"],"weeks":[{"w":35,"title":"Advanced C++ — Production-Grade HFT Patterns","t":["<b style='color:var(--pc)'>📋 Year 2, still at your EU Tier 2 firm. You've been writing C++ in production for 12 months. Now go deeper on the patterns that differentiate HFT systems from regular trading systems.</b>","<b>Kernel bypass networking (DPDK / RDMA):</b> Standard sockets go through the Linux kernel — adds 1-5µs per packet. DPDK (Data Plane Development Kit) bypasses the kernel entirely: packets go from NIC directly to your application. Used by all HFT firms for market data. Study the concepts even if you can't run it at work.","<b>FPGA basics (conceptual):</b> Field-Programmable Gate Arrays process data in hardware — sub-microsecond latency. Jane Street uses FPGAs for order routing. You don't need to program FPGAs but you need to know what they are, why they're used, and when they're appropriate vs C++.","<b>Custom memory allocators — production patterns:</b> Beyond the basic pool allocator from Phase 1. Slab allocator (fixed-size objects), arena allocator (bulk allocation, bulk free), NUMA-aware allocation (allocate memory on the same CPU socket as the thread using it). Study jemalloc and tcmalloc internals.","<b>Wait-free algorithms:</b> Lock-free = at least one thread makes progress. Wait-free = every thread makes progress in bounded steps. Implementing wait-free queues requires understanding ABA problem, hazard pointers, and epoch-based reclamation. Study Folly (Facebook's C++ library) source code.","<b>Cache oblivious algorithms:</b> Algorithms designed to perform well regardless of cache size — they work well on all levels of the cache hierarchy automatically. Van Emde Boas trees, cache-oblivious sorting. Important for data structures that operate on large datasets.","<b>SIMD advanced — AVX-512:</b> 512-bit registers = 8 doubles simultaneously. Available on Intel Skylake-X and newer. Used for batch option pricing, volatility surface interpolation, covariance matrix operations. Study Intel's optimization manual.","<b>Profile-guided optimization (PGO):</b> Compile, run with representative data, recompile using the profiling data. Compiler uses hot/cold path information to make better optimization decisions. Typical improvement: 5-15% on realistic workloads."],"terms":["DPDK","kernel bypass","FPGA","slab allocator","NUMA","wait-free","ABA problem","hazard pointer","AVX-512","PGO","cache oblivious"],"p":"HFT Component Deep Dive","pd":"Choose one area from above and go deep: either implement a DPDK-based UDP receiver (if you have access to test hardware), or implement a wait-free MPSC queue using epoch-based reclamation, or implement a NUMA-aware memory pool. Benchmark thoroughly against baseline. Write a detailed technical blog post about it.","deliverables":["One advanced C++ component implemented, benchmarked, and documented","Blog post: minimum 2,000 words, with benchmark charts and code snippets","Performance numbers: compare to naive implementation (expect 2-10× improvement)","Code published on GitHub with detailed README"],"r":["📖 'Computer Systems: A Programmer's Perspective' — Bryant & O'Hallaron (the definitive systems book)","🌐 github.com/facebook/folly — Facebook's production C++ library, read the source","📄 Intel 64 and IA-32 Architectures Optimization Reference Manual (free, intel.com)","🌐 dpdk.org — DPDK documentation and getting started guide"]},{"w":36,"title":"Machine Learning for Trading — Production-Grade","t":["<b style='color:var(--pc)'>📋 Phase 1 covered basic ML signals. Year 2 goes deeper: feature engineering that doesn't leak, model validation that doesn't overfit, and deployment patterns that work in production.</b>","<b>Alternative data sources:</b> Satellite imagery (parking lot counts → retail sales), credit card transaction data, job postings (→ company hiring = growth signal), shipping data, web scraping (product reviews, pricing). All require careful feature engineering and legal clearance.","<b>NLP for earnings calls:</b> Fine-tuned BERT/FinBERT on earnings call transcripts. Sentiment score as alpha signal. Key challenge: the signal decays as more firms use it. Implement with HuggingFace transformers, backtest with purged CV.","<b>Reinforcement learning for execution:</b> RL agent learns to minimise market impact when executing large orders. State = order book, remaining quantity, time left. Action = quantity to trade now. Reward = negative market impact. Much harder than it sounds — most papers don't survive transaction costs.","<b>Feature store architecture:</b> Centralised repository of ML features shared across models. Ensures consistency between training and serving. Tools: Feast (open source), Tecton (managed). Critical for production ML systems — prevents training/serving skew.","<b>Model monitoring in production:</b> Detect when a model's predictions have drifted from expected distribution (concept drift). Monitor: prediction distribution, feature distribution, performance metrics. Alert when drift exceeds threshold. Your Prometheus/Grafana knowledge applies directly.","<b>Backtesting ML models — the right way:</b> Combinatorial purged cross-validation (CPCV) — López de Prado's framework. Multiple test paths, purging overlap, embargo periods. Deflated Sharpe Ratio to account for multiple testing. These are in 'Advances in Financial ML' chapters 12-14.","<b>GPU acceleration for backtesting:</b> CUDA/CuPy for matrix operations in backtesting — 50-100× speedup for large universes. cuDF (GPU DataFrame) from RAPIDS for data processing. If your firm has GPU access, learn these."],"terms":["alternative data","NLP","FinBERT","reinforcement learning","feature store","concept drift","CPCV","deflated Sharpe","cuDF","RAPIDS","training/serving skew"],"p":"Production ML Alpha Pipeline","pd":"Build a production-grade ML trading signal: alternative data source (news sentiment via FinBERT, or earnings call NLP), purged/embargoed cross-validation, feature store pattern (even if simple), model monitoring dashboard (Prometheus metrics), walk-forward backtest with CPCV. Deploy to Alpaca paper trading.","deliverables":["Feature engineering: 20+ features with time-shift audit proving zero lookahead","CPCV validation: not standard k-fold — document why and show implementation","Model monitoring: Prometheus metrics for prediction drift detection","Live paper trading: 4 weeks of live signals logged, compare to backtest expectations"],"r":["📖 'Advances in Financial ML' — López de Prado, Chapters 12-14 (CPCV, deflated Sharpe)","📖 'Machine Learning for Asset Managers' — López de Prado","🌐 huggingface.co/models — FinBERT and other finance-specific NLP models","🌐 rapids.ai — GPU-accelerated data science for Python"]},{"w":37,"title":"GT OMSCS Deep Dive + Advanced Math","t":["<b style='color:var(--pc)'>📋 You're ~1 year into GT OMSCS now. 2-3 courses complete. This week is a structured review and planning week — make sure your academic path is optimised for QD career goals.</b>","<b>GT OMSCS course path for QD (optimal order):</b> Semester 1: Computing for Data Analysis (easy, confidence builder). Semester 2: Machine Learning (core). Semester 3: High Performance Computing (C++ parallel patterns, CUDA). Semester 4: Computational Finance (directly relevant). Semester 5: Graduate Algorithms (interview prep). Semester 6: Deep Learning (ML depth).","<b>Stochastic calculus — go deeper now:</b> In Phase 1 you learned Brownian motion and Itô's lemma conceptually. Now implement: geometric Brownian motion simulation, Euler-Maruyama scheme for SDE numerical solutions, Milstein scheme (better accuracy), CIR model (interest rates), Heston model (stochastic volatility).","<b>Heston model — the industry standard vol model:</b> dS = μS dt + √v S dW₁. dv = κ(θ-v)dt + σ√v dW₂. Corr(dW₁, dW₂) = ρ. Parameters: κ (mean reversion speed), θ (long-run variance), σ (vol of vol), ρ (correlation). Captures vol smile better than Black-Scholes. Calibrate to market option prices.","<b>Interest rate models:</b> Vasicek model: dr = κ(θ-r)dt + σdW. CIR model: adds √r term ensuring rates stay positive. Hull-White: time-varying parameters to fit the yield curve exactly. You'll encounter these in rates desks and fixed income.","<b>Measure theory basics (conceptual):</b> The mathematical foundation of modern finance. Probability measure P (real world), risk-neutral measure Q (pricing). Radon-Nikodym derivative = the density that converts between measures. Girsanov's theorem = how Brownian motion changes under measure change. You don't need full rigour but these concepts appear in senior QD interviews.","<b>Linear programming and convex optimisation:</b> Portfolio optimisation is a quadratic program (QP). Scipy.optimize, CVXPY for Python. Understand: objective function, constraints (Σwᵢ=1, wᵢ≥0, sector limits), Lagrange multipliers. These appear in risk systems and portfolio construction.","<b>Advanced statistics — MLE and Bayesian methods:</b> Maximum likelihood estimation for model calibration (fitting GARCH, Heston parameters). Bayesian updating: update prior beliefs with new data. Kalman filter: optimal linear state estimation — used for factor model estimation and signal processing."],"terms":["Heston model","CIR model","Euler-Maruyama","Milstein scheme","risk-neutral measure","Girsanov theorem","convex optimisation","CVXPY","MLE","Kalman filter","Bayesian updating"],"p":"Heston Model Calibration + GT OMSCS Mid-Point Review","pd":"Implement the Heston stochastic volatility model: Monte Carlo simulation using Euler-Maruyama scheme, calibration to real SPY options data (minimize difference between model and market implied vols), compare vol surface vs Black-Scholes. Separately: write a GT OMSCS progress report — courses completed, planned, projected graduation date.","deliverables":["Heston MC pricer: European call prices within 0.5% of market for calibrated parameters","Heston vol surface: clearly shows smile/skew that Black-Scholes cannot produce","GT OMSCS plan: courses taken, grades, remaining courses, projected graduation","CVXPY portfolio optimiser: minimum variance + maximum Sharpe + risk parity weights compared"],"r":["📖 'The Concepts and Practice of Mathematical Finance' — Mark Joshi (graduate level, readable)","🌐 cvxpy.org — convex optimisation in Python","📄 Heston 1993 paper — 'A Closed-Form Solution for Options with Stochastic Volatility' (free online)","🌐 omscentral.com — GT OMSCS course reviews, critical for planning your path"]},{"w":38,"title":"Competitive Programming — Tier 1 Screen Level","t":["<b style='color:var(--pc)'>📋 By end of Year 2 you need Codeforces Expert (1600+) and the ability to solve LeetCode Hard problems in < 25 minutes. This is a dedicated sprint to close that gap. Daily practice, not weekly.</b>","<b>Where you need to be for Tier 1 screens:</b> Jane Street: Codeforces Div 1 C level problems (rating ~1900). Citadel: LeetCode Hard + probability puzzles. HRT: algorithmic puzzles + probability. Two Sigma: ML + coding. Target: Codeforces 1700 (Expert) before applying to Tier 1.","<b>Advanced DP patterns:</b> Bitmask DP (subsets of N elements, 2^N states), digit DP (count numbers with property), tree DP (optimal subtree selection), DP on intervals, DP with convex hull trick (optimise O(n²) DP to O(n log n)).","<b>Advanced graph algorithms:</b> Strongly connected components (Tarjan's / Kosaraju's), maximum flow (Dinic's algorithm), minimum cut, bipartite matching (Hungarian algorithm, Hopcroft-Karp). These appear in Div 1 B/C problems.","<b>Number theory for competitive programming:</b> Modular arithmetic, fast modular exponentiation, Euler's totient function, Sieve of Eratosthenes, Chinese Remainder Theorem, Bezout's identity. Appear in ~30% of Codeforces Div 1 problems.","<b>String algorithms:</b> KMP (pattern matching in O(n+m)), Z-algorithm, suffix arrays, Aho-Corasick (multiple pattern matching). Less common in quant interviews but appear in Codeforces Div 1.","<b>Competitive math / combinatorics:</b> Stars and bars, inclusion-exclusion, generating functions, Burnside's lemma. These blend with the probability puzzles in quant interviews.","<b>Virtual contests:</b> Pick a past Codeforces contest, set a 2hr timer, solve as if it's real. Then upsolve. This is the highest-leverage practice format. Do 2 virtual contests per week."],"terms":["bitmask DP","digit DP","convex hull trick","SCC","max flow","Hungarian algorithm","modular arithmetic","suffix array","Aho-Corasick","virtual contest","upsolving"],"p":"Codeforces Expert Sprint","pd":"Dedicated competitive programming month. 2 virtual Codeforces contests per week + daily upsolving. Implement from scratch: Dinic's max flow, suffix array, Aho-Corasick. Solve 50 problems rated 1600-1900 on Codeforces. Target: reach Expert (1600) by end of month.","deliverables":["Codeforces rating 1600+ (Expert) — screenshot the achievement","8 virtual contests completed — log solve count and time per problem","50 problems rated 1600-1900 solved — tagged by category in a spreadsheet","Dinic's, suffix array, and Aho-Corasick implemented from scratch and tested"],"r":["🌐 codeforces.com/problemset — filter by rating 1600-1900, sort by solve count","🌐 cp-algorithms.com/graph/dinic.html — Dinic's max flow with C++ implementation","📺 Errichto — advanced competitive programming techniques (YouTube)","🌐 atcoder.jp/contests — AtCoder Grand Contest problems for variety"]},{"w":39,"title":"US Market Research + O-1A Visa Strategy","t":["<b style='color:#F5A623'>⚡ Re-evaluate: Amsterdam Tier 1 vs US Tier 1:</b> By Year 2, if you're at Optiver/IMC Amsterdam earning $300-450k, do you still need the US? Honest answer: probably not for comp. You need it only if: (1) you want the specific prestige of Jane Street/Citadel, (2) you want US career optionality (VC, startups, etc), (3) you prefer US lifestyle. If your goal is purely financial independence as fast as possible — Amsterdam Tier 1 gets you there 2 years earlier than the US path.","<b>Optiver Chicago transfer — the cleanest US path:</b> After 2+ years at Optiver Amsterdam, request an internal transfer to Optiver Chicago. Success rate is high for strong performers. This gives you: US Tier 1 experience, employer-sponsored visa (E-3 or H-1B for non-Australians, or TN for Canadians — for French nationals it's H-1B or O-1A), and continuity of comp. Far less risky than cold-applying to US firms.","<b>Updated comp targets based on getcracked.io data:</b> Junior Amsterdam Optiver = $405k. Mid-level Amsterdam Optiver = similar to Voleon remote mid-level ($474k). Senior = $615k (Voleon senior). Principal IMC Chicago = $1,060,000. The ceiling is real — and the floor ($405k junior at Optiver) is already above your original $300k target.","<b style='color:var(--pc)'>📋 Year 2, month 12. You're 2 years into the journey. This is the planning and positioning week before Phase 4 (US applications). Understand the landscape, build the visa strategy, identify target firms specifically.</b>","<b>US Tier 1 QD firms — know each one's culture:</b> Jane Street (Oxford/Cambridge culture, love formal methods, Haskell, options trading, incredible comp but very selective). Citadel Securities (most aggressive hiring, C++ heavy, fastest pace, multiple offices). HRT (Hudson River Trading, very quant-heavy, harder math, Chicago). Two Sigma (ML-heavy, data science angle, New York). Virtu (market making, latency obsessed, smaller teams). SIG (Susquehanna, options specialist, Philadelphia but US work).","<b>O-1A visa — your most realistic US path:</b> For extraordinary ability. Does NOT require a job offer first (unlike H-1B). Criteria (need to meet 3 of 8): (1) High salary, (2) judging others' work, (3) original contributions, (4) scholarly articles, (5) critical role at distinguished org, (6) press coverage, (7) awards, (8) membership in exclusive associations. Start building these now.","<b>Building O-1A criteria while in EU:</b> (1) High salary at EU QD firm — document this. (2) Judge a hackathon or technical competition — easy to arrange. (3) Original contributions — your technical blog posts, open source contributions, PreludeSDK. (4) Articles — publish a paper on arXiv (quant finance preprints accepted there). (5) Critical role — get a title like 'Senior QD' or 'Lead Engineer' before applying.","<b>H-1B lottery alternative:</b> H-1B is capped (85k/yr) and lottery-based — unreliable. O-1A has no cap and no lottery. But requires demonstrating extraordinary ability. With 2yr QD experience + GT OMSCS + Codeforces Expert + publications + open source — you can build a credible O-1A case.","<b>EB-1A green card (long term):</b> Extraordinary ability green card — same criteria as O-1A but permanent. 2-5yr process. Start thinking about this in Year 3.","<b>US networking before applying:</b> Attend CppCon in person (Aurora, Colorado — worth the trip). Jane Street and HRT regularly have engineers speak there. Have a conversation, get a LinkedIn connection. Internal referrals at Tier 1 firms skip the CV screen and go straight to technical rounds.","<b>Compensation negotiation for US Tier 1:</b> Base $150-200k. Bonus $100-200k. Total comp $300-400k for mid-level. Never negotiate base alone — negotiate total comp. Equity at some firms (Two Sigma). Signing bonus (often $50-100k at Tier 1). Counter-offer tactics."],"terms":["O-1A visa","H-1B","EB-1A","extraordinary ability","total compensation","signing bonus","referral","arXiv","CppCon networking"],"p":"O-1A Criteria Audit + US Target List","pd":"Audit your O-1A eligibility: which criteria do you currently meet? Which can you build in 12 months? Create a US target firm list with: firm name, culture fit, likely interview format, internal contacts, application timeline. Identify one criterion to actively build this quarter.","deliverables":["O-1A audit: 8 criteria scored (met / partially met / not met) with evidence","US firm target list: 8 firms, prioritised, with notes on interview format and contacts","arXiv draft started or published — even a short technical note counts","1 industry event planned (CppCon, QuantLib conference, etc.)"],"r":["🌐 uscis.gov/working-in-the-united-states/temporary-workers/o-1-visa","📺 'O-1A Visa for Software Engineers' — multiple YouTube explainers by immigration lawyers","🌐 levels.fyi — US tech/finance compensation data, use to benchmark offers","🌐 cppcon.org — CppCon schedule and registration"]}]},{"n":5,"c":"#E05555","d":"rgba(224,85,85,0.11)","title":"Phase 4 — US Tier 1 Assault (Year 3)","range":"Year 3  · ~6 months · The final push","desc":"By Year 3 you have: 2+ years production QD experience, GT OMSCS nearing completion, Codeforces Expert, a body of technical writing, O-1A visa criteria building, and US industry connections. Now run the most rigorous technical interview preparation of your life and execute the campaign. This is what $300k+ looks like from the inside.","skills":["Tier 1 Interview Prep","O-1A Filing","US Relocation","Compensation Negotiation","Jane Street / Citadel / HRT"],"weeks":[{"w":40,"title":"Tier 1 Interview Preparation — 8-Week Sprint","t":["<b style='color:#F5A623'>💰 Compensation anchoring from getcracked.io data:</b> Walk into every negotiation knowing these numbers cold. Junior Development at Optiver (Chicago/Austin): $450k ($200k base + $175k bonus + $75k signing). Junior at IMC Chicago: $365k ($200k base + $65k bonus + $100k signing). CTC Junior Chicago: $400k ($175k base + $75k bonus + $150k signing). CitSec Mid-Level NYC: $550k ($275k base + $275k bonus). These are real, recent numbers — use them as anchors.","<b>Signing bonus is always negotiable:</b> From the getcracked data: signing bonuses range from $30k (Voleon mid-level) to $150k (CTC junior). The signing bonus is the easiest component to negotiate up because it's a one-time cost to the firm. Always ask: 'Is there flexibility on the signing bonus?' even if they say the base and target bonus are fixed.","<b style='color:#00C47C'>🔗 getcracked.io — Quant Dev 250 final sprint:</b> Complete all 250 questions before your first Tier 1 application. Track your weakest categories and do a final week of focused study on them. The 46 problems are your highest priority — these are the closest to actual interview problems.","<b style='color:var(--pc)'>📋 Treat this like studying for a final exam that determines your income for the next decade. 3 hours per day of dedicated prep on top of your full-time job. No shortcuts.</b>","<b>Jane Street interview format (2024):</b> Round 1 = online math/probability test (30 questions, 30 min, no calculator — pure mental math and probability). Round 2 = technical phone (probability puzzles, trading games, 45 min). Round 3 = on-site (full day: probability deep dive, coding, trading simulation, culture). Acceptance rate < 1%.","<b>Citadel Securities interview format:</b> Round 1 = HackerRank (2 coding problems, 90 min, C++ or Python). Round 2 = phone technical (C++ deep dive, system design, 60 min). Round 3 = on-site (4 rounds: algorithms, C++ systems, quant finance, culture). More engineering-focused than Jane Street.","<b>HRT (Hudson River Trading) format:</b> Round 1 = coding screen (competitive programming level, C++). Round 2 = math/probability phone screen. Round 3 = on-site (very heavy probability and statistics, less coding). Known for the hardest probability questions in the industry.","<b>Two Sigma format:</b> Round 1 = CodeSignal (algorithms). Round 2 = technical phone (ML + coding). Round 3 = on-site (4-5 rounds: ML, statistics, coding, system design, behavioural). Most ML-focused of the Tier 1 firms.","<b>Probability topics for Tier 1 (go deeper than Phase 1):</b> Optional stopping theorem (why martingales don't work), random walks and hitting times, order statistics (distribution of min/max of N random variables), coupon collector problem, secretary problem (optimal stopping), Bayesian updating with multiple observations, Kelly criterion derivation.","<b>Trading games in interviews:</b> Jane Street often runs trading simulations — you make markets (quote bid/ask), others trade against you. Practice: given a jar of N coins, what's your bid/ask for the number of heads? Key: bid/ask spread should reflect your uncertainty, not your best estimate alone.","<b>Mental math under pressure:</b> Practice daily: 2-digit × 2-digit multiplication (38 × 47 in 5 seconds), square roots to 2 decimal places, probability calculations without paper. The Jane Street online test specifically tests this."],"terms":["Jane Street","Citadel Securities","HRT","Two Sigma","trading game","mental math","optional stopping","order statistics","coupon collector","Kelly criterion","market making simulation"],"p":"Tier 1 Mock Interview Gauntlet","pd":"8-week intensive: Week 1-2 = probability deep dive (all topics above). Week 3-4 = C++ hard problems + system design. Week 5-6 = 10 mock interviews (find partners on Reddit r/quant, Blind, or hire a coach). Week 7 = trading game practice. Week 8 = final review and mental prep.","deliverables":["50 probability problems solved (Heard on the Street + Quant Finance Interviews), timed","10 mock interviews completed — at least 3 recorded and self-reviewed","Trading game: practice market-making simulation 20+ rounds until comfortable","C++ SPSC queue, LRU cache, and order book implemented from memory without looking up"],"r":["📖 'Heard on the Street' — Crack, 20th edition (do every problem, multiple times)","📖 'A Practical Guide to Quant Finance Interviews' — Zhou (essential)","📖 'Probability and Statistics for Finance' — Rachev et al.","🌐 r/quant on Reddit — find mock interview partners, read interview experiences","🌐 getcracked.io — complete all 250 Quant Dev questions before first Tier 1 application","🌐 getcracked.io/careers — comp data for negotiation anchoring"]},{"w":41,"title":"Application Campaign — US Tier 1","t":["<b style='color:var(--pc)'>📋 Applications are live. This is the execution phase. Treat job searching like a sales pipeline — volume, follow-up, and conversion rate optimisation.</b>","<b>Application order (strategic):</b> Start with your 3rd-choice firms for practice (Virtu, SIG, Akuna). Middle: Citadel, Two Sigma, DRW. End with your top 2 (Jane Street, HRT) — by then you'll have done 5+ full interview processes and will be much sharper.","<b>Referrals are everything:</b> A referral at Tier 1 firms skips the CV screen. Your CppCon connections, open source contributions, and LinkedIn network are here to use. Message connections directly: 'I'm applying to [firm] — would you be willing to refer me? I'm happy to share my background.'","<b>The CV for US Tier 1:</b> 1 page. Every bullet with a number. Lead with: GT OMSCS (in progress), Codeforces rating, GitHub link, open source authorship. Work experience: lead with QD role, not web dev. Your fintech background is now supporting context, not the headline.","<b>O-1A visa timing:</b> Apply for O-1A as soon as you have a US job offer. Processing: 2-3 months standard, 15 days premium ($2,805 fee). Have your immigration lawyer ready before you get the offer — don't scramble after.","<b>Compensation negotiation at Tier 1:</b> Never accept on the spot. Always: 'I'm very excited about this offer. I need a few days to review the details. Can you send it in writing?' Competing offers are your leverage — if you have two, play them against each other. Standard ask: 'Is there flexibility on the signing bonus?' (almost always yes).","<b>US cost of living adjustment:</b> NYC QD $350k total comp ≠ $350k in Paris. NYC federal + state + city tax = ~40%. After tax: ~$210k. Rent in Manhattan: $4-6k/month. Net: still transformative, but model it realistically.","<b>If rejected from Tier 1:</b> This is normal. Jane Street rejects 99%+ of applicants. Citadel rejects 95%+. Rejection is data, not identity. Ask for feedback (rarely given but worth asking). Reapply in 12-18 months. Use the time to build more signal. Many successful Tier 1 hires applied 2-3 times."],"terms":["referral","competing offers","signing bonus","total comp","O-1A filing","immigration lawyer","NYC cost of living","rejection strategy","reapplication"],"p":"US Tier 1 Application Campaign","pd":"Apply to 8 US Tier 1/2 firms in strategic order. Execute 6+ full interview processes. Receive at least 1 offer. Negotiate total compensation. File O-1A visa. Relocate to US.","deliverables":["8 applications submitted in strategic order (3rd choice first, 1st choice last)","6+ full interview processes completed — detailed notes from each","1 US Tier 1 or Tier 2 offer received and negotiated (target: $250k+ total comp)","O-1A visa filed with immigration lawyer"],"r":["🌐 levels.fyi/company — compensation benchmarks for every firm","🌐 glassdoor.com — interview experiences, very useful for firm-specific prep","🌐 blind — anonymous tech worker forum, real comp data and interview intel","📺 'Negotiating a Job Offer' — multiple good YouTube resources"]},{"w":42,"title":"In the US — Year 1 and Beyond","t":["<b style='color:var(--pc)'>📋 You made it. Now the goal is to compound your advantage. The $300k+ is the starting point, not the destination. The best QDs continue learning indefinitely — the field moves fast.</b>","<b>First 90 days at a US Tier 1:</b> The talent density is unlike anything you've experienced. Everyone around you is exceptional. This is the environment that forces the fastest growth. Absorb everything. Ask questions aggressively. The imposter syndrome is normal and universal — push through it.","<b>What $300k+ actually means in practice:</b> Base ~$150-175k. Bonus ~$100-200k (discretionary, paid in January/February, based on firm PnL and individual performance). Total comp range: $250-400k for mid-level. Senior/principal: $500k-$1M+. The ceiling is high — but the floor moves with firm performance.","<b>Continued learning at Tier 1:</b> You'll be surrounded by people who know things you don't. That's the point. Learn from them relentlessly. The firm's internal research papers, codebase, and senior engineers are better learning resources than any book.","<b>The next ceiling — principal/staff QD:</b> $500k-$1M+ territory. Requires: owning a significant system or strategy, mentoring junior QDs, contributing to firm-level technical decisions, consistently measurable PnL impact. Timeline: 3-5 years after joining.","<b>Green card (EB-1A) process:</b> Start immediately on joining. O-1A to EB-1A is a natural progression. With US Tier 1 employer sponsorship: much faster processing. Timeline from O-1A: 2-4 years to green card depending on country of birth (French nationals: shorter queue than India/China).","<b>Keep building externally:</b> The best QDs continue publishing, speaking at conferences, contributing to open source. This builds optionality — you're never dependent on one employer. The quant finance community is small and reputation travels.","<b>The real goal beyond $300k:</b> Financial independence. At $300-400k/yr, aggressive saving + investing enables financial independence in 8-12 years depending on lifestyle. Model this now — it changes how you think about every career decision."],"terms":["principal QD","EB-1A green card","financial independence","firm PnL","discretionary bonus","optionality","quant community","FIRE"],"p":"5-Year US Career Plan","pd":"Write a concrete 5-year plan from your US Tier 1 starting point: Year 1 (survive and learn), Year 2 (own something meaningful), Year 3 (measurable PnL impact), Year 4 (principal track), Year 5 (financial independence modelling). This is the document you return to when the grind gets hard.","deliverables":["5-year career plan: specific milestones, not vague goals","Financial model: projected savings rate, investment returns, FI target date","EB-1A green card process started with immigration lawyer","One external talk proposed (conference, meetup, podcast) — start building your public profile"],"r":["🌐 uscis.gov/green-card/green-card-eligibility/green-card-for-people-with-extraordinary-ability","🌐 mrmoneymustache.com — FIRE (financial independence) framework and community","🌐 portfoliocharts.com — long-term investment modelling for high earners","📖 'The Psychology of Money' — Morgan Housel (important read for high comp, high pressure careers)"]}]}];
function sv(p){return `--pc:${p.c};--pcd:${p.d}`;}
function renderNav(){
  document.getElementById('pnavEl').innerHTML=PH.map((p,i)=>`
    <button class="ptab${i===AP?' active':''}" style="--tc:${p.c};--tcd:${p.d}" onclick="goPhase(${i})">
      <span class="tbadge">P${p.n}</span>${p.title}
    </button>`).join('');
}
function renderMain(){
  const p=PH[AP];
  document.getElementById('mainEl').innerHTML=`
    <div class="phdr" style="${sv(p)}">
      <div class="pnum">0${p.n}</div>
      <div>
        <div class="prange">${p.range}</div>
        <div class="pname">${p.title}</div>
        <div class="pdesc">${p.desc}</div>
        <div class="ptags">${p.skills.map(s=>`<span class="ptag">${s}</span>`).join('')}</div>
      </div>
    </div>
    <div class="wgrid">${p.weeks.map(w=>card(w,p)).join('')}</div>`;
}
function card(w,p){
  const id=`w${w.w}`,dn=DONE.has(id);
  return `<div class="wcard${dn?' done':''}" id="${id}" style="${sv(p)}">
    <div class="wcard-head" onclick="toggle('${id}')">
      <span class="wnum">W${String(w.w).padStart(2,'0')}</span>
      <span class="wtitle">${w.title}</span>
      <button class="wdone" onclick="event.stopPropagation();mark('${id}')" title="Mark complete">✓</button>
      <span class="wchev">▼</span>
    </div>
    <div class="wbody">
      <div class="slabel">Topics</div>
      <ul class="tlist">${w.t.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="terms-row">${w.terms.map(t=>`<span class="tchip">${t}</span>`).join('')}</div>
      <div class="proj-box">
        <div class="slabel plbl">🛠 Weekend Project</div>
        <div class="ptitle2">${w.p}</div>
        <div class="pdesc2">${w.pd}</div>
        <ul class="dlist">${w.deliverables.map(d=>`<li>${d}</li>`).join('')}</ul>
      </div>
      <div class="slabel" style="margin-top:10px;">📚 Resources</div>
      <div class="rlist">${w.r.map(r=>`<span class="rtag">${r}</span>`).join('')}</div>
      ${w.code?`<button class="code-btn" onclick="event.stopPropagation();toggleCode('${id}',this)">{ } Show starter code</button><div class="code-box" id="code-${id}"><pre class="scode">${escHtml(w.code)}</pre></div>`:''}
    </div>
  </div>`;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleCode(id,btn){const box=document.getElementById('code-'+id);box.classList.toggle('open');btn.textContent=box.classList.contains('open')?'{ } Hide starter code':'{ } Show starter code';}
function toggle(id){document.getElementById(id).classList.toggle('open');}
function mark(id){
  DONE.has(id)?DONE.delete(id):DONE.add(id);
  document.getElementById(id).classList.toggle('done');
  updateProg();
}
function updateProg(){
  const n=DONE.size,t=42,pct=Math.round(n/t*100);
  document.getElementById('pgTxt').textContent=`${n} / 22 weeks completed`;
  document.getElementById('pgFill').style.width=pct+'%';
  document.getElementById('pgPct').textContent=pct+'%';
}
function goPhase(i){AP=i;renderNav();renderMain();window.scrollTo({top:0,behavior:'smooth'});}
renderNav();renderMain();
</script>
</body>
</html>
