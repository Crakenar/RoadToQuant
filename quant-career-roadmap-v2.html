a = annual/365.","Rho ρ = K·T·e^(−rT)·N(d₂). Sensitivity to risk-free rate. Usually small. Became important in 2022 when rates moved rapidly. Know it exists but focus your energy on Delta, Gamma, Vega.","<b style='color:var(--pc)'>── Implied Volatility & Vol Surface ──</b>","Historical vol vs implied vol: historical = backward-looking (from past returns). Implied = market's forward-looking consensus view embedded in option prices. Implied vol changes daily as market sentiment changes.","Vol smile/skew: for equities, lower strikes have higher implied vol than higher strikes. This reflects tail-risk fear (puts are expensive as crash insurance). BS predicts flat vol — reality is not flat.","Newton-Raphson IV inversion: σ_new = σ_old − (BS(σ_old)−market_price)/Vega(σ_old). Start at σ₀=0.3. Iterate until |error| < 0.0001. Typically converges in 5–7 steps. Vega > 0 guarantees convergence.","Vol surface: a 2D grid of implied vols across (strike, expiry). Used for pricing exotic options not quoted in the market. Fetch a real options chain: ticker = yf.Ticker('SPY'); chain = ticker.option_chain('2024-12-20').","VIX: CBOE's measure of SPY 30-day implied vol using a model-free method (weighted sum of OTM option prices). Often called 'fear gauge'. Spikes during market stress — a key macro risk indicator.","<b>Unit test for BS (non-negotiable):</b> Put-call parity — C − P must equal S − K×e^(−rT) to within 1e-10. Run this as an assertion in your code. If it fails, your implementation is wrong.","<b>From your experience:</b> Your PHPUnit discipline (200+ tests on Feel-Mining) applies directly. Every pricing function should have: known-value tests, boundary tests (T→0, σ→0), and put-call parity verification.","<b>Newton-Raphson IV:</b> σ_new = σ_old − (BS(σ_old) − market_price) / Vega. Start at σ=0.3, iterate until |error| < 0.0001. Converges in 5–7 steps. This is how every options desk computes implied vol."],"terms":["GBM","risk-neutral measure","d₁","d₂","log-normal","put-call parity","BS assumptions","continuous compounding","Delta","Gamma","Vega","Theta","Rho","delta hedge","long gamma","short gamma","time decay","vol sensitivity","historical vol","implied vol","vol smile","vol skew","vol surface","Newton-Raphson","VIX","IV inversion"],"p":"Black-Scholes Pricer + Complete Greeks Calculator & Dashboard + IV Calculator & Vol Surface","pd":"Implement Newton-Raphson IV solver converging in < 10 iterations. Fetch real SPY options chain via yfinance. Compute IV for each strike/expiry. Plot: (1) vol smile for 3 expiries, (2) full 3D vol surface.","deliverables":["<b>Option Pricing — Black-Scholes:</b>","bs_call() and bs_put() verified against 5 known benchmark values","Put-call parity test: |C − P − (S − K·e^(−rT))| < 1e-10 for all test cases","3D surface clearly showing time decay (theta) and moneyness effects","<b>Option Greeks:</b>","All 5 Greeks for both calls and puts, verified against Hull textbook examples","2×3 heatmap grid — clearly labeled axes, colorbars, titles","Delta hedge P&L simulation: daily hedge vs no-hedge over 30-day period","<b>Implied Volatility & Vol Surface:</b>","Newton-Raphson solver: converges to < 0.0001% error in < 10 iterations","Vol smile: clear downward slope for equities (lower strikes = higher IV)","3D vol surface showing term structure and skew simultaneously"],"r":["📖 Hull – Ch.15 Black-Scholes-Merton (the source)","🌐 QuantLib Python: quantlib-python.readthedocs.io","📺 Patrick Boyle – 'Black-Scholes Explained' (YouTube)","📖 Hull – Ch.19 The Greek Letters (all formulas are here)","📖 Option Volatility & Pricing – Natenberg, Part 3","📺 tastytrade YouTube – Greeks explained (free, practitioner perspective)","📖 Hull – Ch.20 Volatility Smiles","🌐 yfinance: ticker.option_chain(date) for real options data","📺 tastytrade – 'Understanding Implied Volatility' (YouTube)"]},{"w":7,"title":"Monte Carlo Option Pricing & Binomial Trees","t":["<b style='color:var(--pc)'>📋 Week note: W22 (Monte Carlo) = 2 days. W23 (binomial trees) = 1.5 days. Vectorize everything — np.random.normal(0,1,(N,T)) generates a full path matrix at once. No Python loops in simulation code.</b>","<b style='color:var(--pc)'>── Monte Carlo Option Pricing ──</b>","GBM discretization: S(t+Δt) = S(t)·exp((r−σ²/2)Δt + σ√Δt·Z), Z~N(0,1). Simulate N paths of T steps. Terminal prices should follow LogNormal — verify by comparing mean and variance to theoretical values.","Risk-neutral pricing: option price = e^(−rT) × (1/N) × Σ payoff(S_T^i). For call: average max(S_T−K, 0) over all paths, then discount. With N=100,000 paths should match BS to within ~0.1%.","Antithetic variates: for each random path using draws Z, also simulate the path using −Z. Pair them up, average the two payoffs. Reduces standard error by √2 with zero extra computation. Always use in production.","Vectorized simulation: generate full path matrix at once: Z = np.random.normal(0,1,(N,T)); paths = S0 * np.exp(np.cumsum((r−σ²/2)dt + σ*√dt*Z, axis=1)). No Python loops.","Exotic option payoffs: Asian call = max(mean(S over path)−K, 0). Barrier knock-out = max(S_T−K, 0) if S never crosses barrier B, else 0. Both are path-dependent → closed-form doesn't exist → MC is the natural tool.","<b style='color:var(--pc)'>── Binomial Trees & American Options ──</b>","CRR parameters: u = e^(σ√Δt), d = 1/u, p = (e^(rΔt)−d)/(u−d). The tree recombines: up-then-down = down-then-up, keeping tree size O(N²) not O(2^N). Build stock price tree first, then option value tree.","Backward induction: at final nodes compute payoff. Work backwards: V_node = e^(−rΔt) × (p·V_up + (1−p)·V_down). For European options, this is always the continuation value.","American options: at each node, compare continuation value vs immediate exercise (max(0, S−K) for call, max(0, K−S) for put). V_node = max(continuation, exercise). This is the key difference vs European.","Convergence test: European binomial price → BS as N increases. N=100 gives ~99.9% accuracy. Average odd-N and even-N results for better convergence. N=200 is adequate for production.","Early exercise premium: American put price > European put (can exercise early if deep ITM). American call on non-dividend stock: early exercise is never optimal (proven by Hull). On dividend-paying stocks: may be optimal.","<b>Antithetic variates — always use:</b> For every random path with draws Z, also simulate −Z. Average the two payoffs. Halves variance with zero extra compute. One line of code, 40% better accuracy.","<b>American vs European in the tree:</b> At each node, V = max(continuation_value, exercise_value). That's the only code difference. Everything else — CRR parameters, backward induction — is identical."],"terms":["GBM simulation","antithetic variates","control variates","variance reduction","path-dependent","Asian option","barrier option","standard error","convergence","CRR","up factor","down factor","risk-neutral probability","backward induction","early exercise","American option","recombining tree"],"p":"Exotic Option Pricer with Variance Reduction + Binomial Tree Option Pricer","pd":"Implement CRR tree (N=200+ steps) for American and European puts and calls. Verify: European tree converges to BS as N increases. American put price > European put. Visualize full tree for N=10.","deliverables":["<b>Monte Carlo Option Pricing:</b>","European MC price within 0.1% of analytical BS at N=100,000 paths","Antithetic variates: confirm √2 reduction in standard error empirically","Convergence plot: price stabilizes, CI narrows — show both naive and antithetic","<b>Binomial Trees & American Options:</b>","European tree price within 0.1% of BS at N=200 steps","American put > European put confirmed for all test cases","Tree diagram for N=10: show both stock price and option value at each node"],"r":["📖 Monte Carlo Methods in Finance – Peter Jäckel","📖 Hull – Ch.21 Basic Numerical Procedures","🌐 NumPy random module docs: numpy.org/doc/stable/reference/random","📖 Hull – Ch.13 Binomial Trees","🌐 QuantLib Python – BinomialVanillaEngine (production implementation)","📺 Patrick Boyle – 'Binomial Option Pricing' (YouTube)"]},{"w":8,"title":"Backtesting Framework, Walk-Forward & Risk System","t":["<b style='color:var(--pc)'>📋 Week note: W24 (vectorized backtest) = 1.5 days. W25 (walk-forward) = 1 day. W26 (risk system) = 0.5 day. Your API design instincts are perfect here — a backtester is just a well-designed class with clean inputs/outputs.</b>","<b style='color:var(--pc)'>── Backtesting Infrastructure I — Vectorized Framework ──</b>","Lookahead bias: using information not available at decision time. Example: using today's close return to generate a signal for today's close → that's the future. Fix: signals[t] = f(data up to t−1). Use .shift(1) on every signal religiously.","Survivorship bias: testing on only the stocks that still exist today excludes all the ones that went bankrupt or were delisted. Inflates backtested alpha by 1–3% annually. Acknowledge this limitation when reporting results.","Vectorized backtester architecture: signals DataFrame (1=long, 0=flat, −1=short) → .shift(1) for execution lag → daily_returns = positions × asset_returns → equity_curve = (1+daily_returns).cumprod().","Transaction costs: realistic estimate = 5–10bps per trade one-way. In pandas: cost = abs(positions.diff()) × 0.001 × 0.5. Subtract from daily returns. This makes most very-short-term strategies unprofitable.","Key performance metrics: CAGR = (final/initial)^(252/n_days)−1, Sharpe = √252 × mean(ret)/std(ret), max_drawdown, n_trades, win_rate. Compute all before making any conclusion about a strategy.","<b style='color:var(--pc)'>── Backtesting Infrastructure II — Walk-Forward ──</b>","Walk-forward analysis: train on rolling window of N months, test on next M months, roll forward. Repeat across full dataset. This is the only credible backtesting methodology — one split is insufficient.","Deflated Sharpe Ratio (Harvey, Liu, Zhu 2016): adjust Sharpe for multiple testing. If you tried 20 parameter combinations and report the best, your Sharpe is inflated. Minimum credible t-stat = 3.0 for published finance results.","Slippage models: (1) fixed bps, (2) vol-adjusted: slippage = k × σ_daily × √(order_size/ADV), (3) 1/2-spread model: lose half the bid-ask spread per trade. Model (2) is most realistic for institutional size.","Position sizing methods: equal notional (equal $ per position), equal vol (scale by 1/σ so each position contributes equal vol), Kelly criterion f*=μ/σ² (use half-Kelly in practice). Vol-targeting is the industry standard.","Overfitting detection: in-sample Sharpe >> out-of-sample Sharpe → overfitted. Compare strategy Sharpe to a naive benchmark (e.g. buy-and-hold). If strategy barely beats benchmark, it is not interesting.","<b style='color:var(--pc)'>── Risk System Architecture ──</b>","Real-time PnL: daily_pnl = Σ(positions × price_changes). Separate realized PnL (from closed trades) from unrealized (open positions marked at current price). Risk systems track both separately.","Greeks aggregation for a book: total_delta = Σ(Δᵢ × notionalᵢ), total_gamma, total_vega, total_theta. A delta-neutral, long-gamma, long-vega book profits from vol expansion. Risk manager monitors these aggregates hourly.","Portfolio VaR with options: linear approximation = delta × σ_portfolio is fast but ignores gamma. Full revaluation = reprice every option under 1000 scenarios is accurate but slow. Use linear for real-time, full reval for end-of-day.","Stress testing: define scenario → reprice all positions → sum PnL. Scenarios: 'market −10%, vol +5pts, rates −50bps'. Regulatory requirement: must test vs 2008 crisis, 2020 COVID, 1987 Black Monday.","Pre-trade risk checks (before sending any order): new position within limit? total delta within limit? total notional within limit? max single-name concentration? If any fails: reject order, log reason. This lives in the order management layer.","<b>From your experience:</b> Your cron/job optimisation on Feel-Mining (8GB→6GB RAM, −30% query time) is directly applicable. A backtest that processes 5yr of 500 stocks needs the same vectorisation discipline.","<b>Walk-forward only — never one split:</b> Train 36mo, test 6mo, roll forward. Report the distribution of out-of-sample Sharpes across all windows. One good period can be luck. Consistent performance across 8+ windows is signal.","<b>Transaction costs kill strategies:</b> 10bps round-trip. Run every strategy with AND without. If costs make it unprofitable, it's not a strategy — it's overfitting."],"terms":["lookahead bias","survivorship bias","position sizing","transaction costs","equity curve","CAGR","Sharpe","max drawdown","turnover","walk-forward","out-of-sample","deflated Sharpe","overfitting","slippage model","Kelly criterion","vol-targeting","half-Kelly","mark-to-market","realized PnL","unrealized PnL","Greeks book","full revaluation","stress testing","pre-trade check","risk limit","concentration"],"p":"Vectorized Backtesting Framework + Walk-Forward Momentum Strategy + Portfolio Risk System","pd":"Build a RiskSystem class: given a list of Position objects (instrument, notional, delta, gamma, vega), compute aggregated Greeks, delta-normal VaR, 3 stress scenario P&Ls, and a pre-trade validator that raises RiskLimitBreached.","deliverables":["<b>Backtesting Infrastructure I — Vectorized Framework:</b>","VectorizedBacktester.run() returns PerformanceReport dataclass","PerformanceReport: CAGR, Sharpe, max drawdown, n_trades, win_rate, monthly return heatmap","Side-by-side comparison: strategy with vs without transaction costs","<b>Backtesting Infrastructure II — Walk-Forward:</b>","Cross-sectional ranking with correct 1-month lag (no lookahead bias)","Walk-forward results: per-period Sharpe plotted as bar chart","Turnover analysis: monthly % portfolio turnover × cost = strategy drag estimate","<b>Risk System Architecture:</b>","Position, Book, RiskSystem classes with type hints throughout","Pre-trade check raises RiskLimitBreached with descriptive message","Stress test report: 2008, COVID, and rate-shock scenarios with P&L for each"],"r":["📖 Algorithmic Trading – Ernest Chan, Ch.3 (backtesting pitfalls, excellent)","📺 ritvikmath – 'Building a Backtester in Python' (YouTube)","🌐 Backtrader docs: backtrader.com (event-driven, for next week)","📖 Advances in Financial ML – López de Prado, Ch.11–12 (critical on backtesting)","🌐 Backtrader docs: backtrader.com/docu/","📄 Risk Metrics Technical Document – JP Morgan (Google 'RiskMetrics 1996 PDF')","📖 Philippe Jorion – Value at Risk, Ch.5–6","🌐 QuantLib Python risk documentation"]},{"w":9,"title":"C++23 Fundamentals I — Memory Model & Classes","t":["<b style='color:#00C47C'>🔗 getcracked.io — C++ tracks to use alongside weeks 9-16:</b> (1) <b>Beginner C++</b> (269 resources, 211 questions, 16 problems) = your week-by-week reference. (2) <b>C++ Concurrency</b> (93 resources, 40 questions, 11 problems) = start this in week 12 when you hit concurrency. (3) <b>Operating Systems - Virtualization</b> (94 resources, 58 questions) = virtual memory and OS fundamentals that HFT interviewers ask about.","<b style='color:#00C47C'>🔗 getcracked.io — How to use it:</b> Before each study session, pick 2-3 questions from the relevant getcracked track and answer them in writing. This is active recall — far more effective than re-reading notes. After each week, do the associated quiz. Track your score — anything below 70% = revisit that topic.","<b style='color:var(--pc)'>📋 Week note: Compile every example immediately: g++ -std=c++23 -O2 -Wall file.cpp -o file && ./file. Your PHP/JS background means you've never thought about stack vs heap, pointers, or manual memory. This week is a complete mental model shift — take it slow.</b>","<b style='color:var(--pc)'>── C++23 Fundamentals I — Memory Model ──</b>","Stack vs heap: stack = automatic (function locals, fast, ~8MB limit). Heap = manual with new/delete or smart pointers (slower allocation, unlimited). Python hides this — C++ exposes it. Prefer stack; use heap only when necessary.","Pointers (*): memory addresses. int* p = &x; *p = 42. Pointer arithmetic: p++ advances by sizeof(int). Raw pointer ownership = source of bugs. In modern C++23: raw pointers for non-owning access only.","References (&): safer alias for existing variable. int& ref = x; — no null, no reassignment. Use for function parameters to avoid copying: void price(const Instrument& inst). Prefer references over pointers when possible.","RAII (Resource Acquisition Is Initialization): constructor acquires resources, destructor releases them. Stack-allocated RAII objects guarantee cleanup even on exceptions. This is how C++ avoids memory leaks without a GC.","const correctness: const double x = 5.0 (immutable). const double* p (pointer to const). double* const p (const pointer). Mark everything const unless it needs to change — it communicates intent and prevents bugs.","<b style='color:var(--pc)'>── C++23 Fundamentals II — Classes & OOP ──</b>","Class anatomy: public/private/protected access, constructor initializer list (preferred over body assignment), member functions, const methods. Struct vs class: only default access differs. Use struct for data bags, class for behavior.","Destructor: called automatically at end of scope (stack) or on delete (heap). Virtual destructor: REQUIRED if class has virtual methods and you ever delete via base pointer. Forgetting this = memory leak. No exception.","Operator overloading: make types work naturally with +, -, *, [], ==. Matrix m1 + Matrix m2 → Matrix operator+(const Matrix& rhs) const. Return by value for arithmetic, by reference for +=.","Inheritance and virtual: class Call : public Option { double price() override; }. Use override keyword always (catches typos). Pure virtual = abstract: virtual double price() = 0. Avoid deep hierarchies — prefer composition.","Rule of 5 in C++: if you define any of (destructor, copy ctor, copy assign, move ctor, move assign) — define all 5 or explicitly default/delete them. Incomplete rule-of-5 = subtle bugs that corrupt memory silently.","<b>From your experience:</b> Laravel's service container does dependency injection for you. C++ makes you do it explicitly — you control every allocation. Think of it as understanding what Laravel does under the hood.","<b>RAII — the most important C++ concept:</b> Constructor acquires resources, destructor releases automatically when scope ends. No manual cleanup needed. This is how C++ achieves safety without a garbage collector.","<b>Stack vs heap:</b> Stack = fast, automatic, ~8MB limit. Heap = slow to allocate, unlimited, manual. Rule: prefer stack. Use heap only when you need dynamic size or lifetimes beyond the current scope."],"terms":["stack","heap","pointer","dereference","reference","RAII","const","nullptr","automatic storage","dynamic allocation","class","struct","constructor","destructor","virtual","override","pure virtual","abstract","operator overloading","rule of 5","const method"],"p":"Black-Scholes Pricer in C++23 + Financial Instrument Class Hierarchy","pd":"Design in C++23: abstract Instrument with pure virtual price(double spot). Derive: EuropeanCall, EuropeanPut, AmericanPut, ZeroCouponBond. Portfolio holds vector<unique_ptr<Instrument>>. Compute total PnL and verify no memory leaks (valgrind).","deliverables":["<b>C++23 Fundamentals I — Memory Model:</b>","bs_call(S,K,T,r,sigma) and bs_put() in C++23 with double precision","Unit test: max error vs Python < 1e-10 for 5 test cases","Benchmark: report millions of pricings per second vs Python equivalent","<b>C++23 Fundamentals II — Classes & OOP:</b>","4+ concrete instrument classes, virtual destructor in base class","Portfolio::mark_to_market() sums price() calls via polymorphism","valgrind --leak-check=full shows zero leaks"],"r":["📖 C++ Primer – Lippman, 5th edition (best beginner C++ book)","🌐 cppreference.com — bookmark this, the definitive C++ reference","📺 CppCon 2015: Kate Gregory – 'Stop Teaching C' (YouTube, key mindset shift)","📖 C++ Primer, Ch.12–15 (classes, inheritance, polymorphism)","🌐 cppreference.com/w/cpp/language/virtual","📺 CppCon 2019: Jason Turner – 'The Best Parts of C++' (YouTube)","🌐 getcracked.io — Beginner C++ track: start from 'Memory Model' section for this week","🌐 getcracked.io — Operating Systems track: 'Virtual Memory' section (relevant for understanding heap/stack at OS level)"]},{"w":10,"title":"C++23 Modern Features, Templates & Concepts","t":["<b style='color:var(--pc)'>📋 Week note: std::expected, std::mdspan, std::flat_map are the C++23 features trading firms actually use. Templates and Concepts let you write generic, type-safe code with zero runtime overhead — critical for pricing engines.</b>","<b style='color:var(--pc)'>── C++23 Key Features ──</b>","std::expected<T,E> (C++23): return either a value OR an error — like Rust's Result<T,E>. No exceptions in hot path. auto result = pricer.price(params); if (result) use *result; else handle result.error(). Use this for ALL operations that can fail.","std::mdspan (C++23): multi-dimensional VIEW into contiguous data. No copy, no ownership. Perfect for option pricing grids and matrices: std::mdspan<double, std::extents<int,N,N>> vol_surface(data.data(), N, N); vol_surface[i,j] = 0.25;","std::flat_map / std::flat_set (C++23): sorted containers backed by contiguous vector. 2–3× faster iteration vs std::map (which uses a tree). Use for: order book price levels, symbol lookup tables where iteration dominates insertion.","Smart pointers: unique_ptr<T> (sole ownership, zero overhead), shared_ptr<T> (shared, reference counted), weak_ptr<T> (non-owning observer). Rule: unique_ptr by default, shared_ptr when genuinely shared, never raw pointers for ownership.","std::print / std::println (C++23): std::println(\"Price: {:.4f}\", price). Type-safe, faster than printf, cleaner than cout. Replace all printf/cout with std::print in new C++23 code.","<b style='color:var(--pc)'>── Templates, Concepts & STL ──</b>","Function templates: template<typename T> T max_val(T a, T b) { return a > b ? a : b; }. Compiler generates separate code for each type. Zero runtime overhead. Use when you need identical algorithm for multiple types.","Class templates: template<typename T, int N> class FixedArray { T data[N]; }. Non-type parameter N is a compile-time constant — enables stack allocation: FixedArray<double, 4> greeks;","Concepts (C++20/23): template<std::floating_point T> — constrain what types are valid. Better error messages than raw templates. Write: concept Priceable = requires(T t) { {t.price()} -> std::same_as<double>; };","STL containers: vector (contiguous, random-access), unordered_map (hash table, O(1) lookup), deque (double-ended queue), priority_queue (heap). Know time complexity of all basic operations for every container.","STL algorithms: std::sort(v.begin(), v.end(), cmp), std::transform(in, end, out, func), std::accumulate(in, end, 0.0, func), std::lower_bound (binary search on sorted range). These replace manual loops.","<b>std::expected<T,E> (C++23) — use everywhere:</b> Returns value OR error without exceptions. auto result = pricer.price(params); if (result) use *result; else handle result.error(). No exceptions in hot path.","<b>Concepts — better than raw templates:</b> template<std::floating_point T> constrains what types are valid. Better error messages. Write concepts for your Priceable, Instrument, and Strategy types.","<b>std::flat_map vs std::map:</b> flat_map = sorted vector (cache-friendly, 2-3× faster iteration). map = tree (slower). Use flat_map for order book price levels and symbol lookup tables."],"terms":["std::expected","std::mdspan","std::flat_map","std::unique_ptr","std::shared_ptr","move semantics","std::optional","std::variant","std::print","function template","class template","concept","CTAD","std::vector","std::unordered_map","std::sort","constexpr","static_assert"],"p":"Modernized C++23 Instrument Library + Generic Matrix Class with Concepts","pd":"Implement templated Matrix<T, Rows, Cols> (stack-allocated). Use C++23 concept: requires std::floating_point<T>. Implement: operator*, transpose(), operator[], begin()/end(). Benchmark vs vector<vector<double>> for 4×4 multiply.","deliverables":["<b>C++23 Key Features:</b>","std::expected used — no exceptions thrown anywhere in the library","std::mdspan view over a 2D double array for vol surface","flat_map vs map benchmark: iteration speed on 10,000 entries (expect 2–3× improvement)","<b>Templates, Concepts & STL:</b>","Matrix<double,3,3> correct 3×3 multiply verified numerically","Matrix<int,...> fails to compile with clear concept-error message","Benchmark: stack Matrix<double,4,4> vs heap vector<vector> — 10× speedup expected for small sizes"],"r":["🌐 cppreference.com/w/cpp/utility/expected (C++23)","🌐 cppreference.com/w/cpp/container/mdspan","🌐 cppreference.com/w/cpp/23 — full C++23 features list","📖 C++ Primer, Ch.16 (Templates and Generic Programming)","🌐 cppreference.com/w/cpp/language/constraints (C++20 Concepts)","🌐 cppreference.com/w/cpp/container — all STL containers"]},{"w":11,"title":"C++23 Performance — Cache, SIMD & Vectorization","t":["<b style='color:var(--pc)'>📋 Week note: This week changes how you think about code forever. Every performance optimisation you've done in PHP/Laravel was at a high level (query plans, caching, job batching). C++ performance goes all the way down to individual CPU instructions.</b>","<b style='color:var(--pc)'>── C++23 Performance I — CPU & Cache ──</b>","Memory hierarchy (memorize these): L1 cache ~4ns, L2 ~12ns, L3 ~40ns, DRAM ~100ns. A cache miss (L3→DRAM) costs 25× more than an L1 hit. If your hot loop touches non-contiguous data, you are paying this penalty every iteration.","Structure-of-Arrays (SoA) vs Array-of-Structures (AoS): for batch processing all prices, SoA (prices[], strikes[], vols[]) is cache-friendly. AoS (struct Option{price,strike,vol}[]) causes cache misses when iterating a single field.","False sharing: two threads write to variables that share the same 64-byte cache line → they invalidate each other's cache on every write. Fix: pad structs to 64 bytes using alignas(64). Critical for lock-free queues.","Branch prediction: predictable branches (always true, alternating) cost ~1 cycle. Mispredicted branches cost ~15 cycles. Use [[likely]] / [[unlikely]] attributes (C++20) to hint the compiler. Profile with perf stat.","Compiler flags: -O2 (safe), -O3 (aggressive, usually safe), -march=native (use all CPU features including AVX2), -DNDEBUG (disable assert()), -flto (link-time optimization). Always benchmark with -O2/-O3 or you measure noise.","<b style='color:var(--pc)'>── C++23 Performance II — SIMD & Vectorization ──</b>","Auto-vectorization: the compiler converts scalar loops to SIMD automatically if the pattern is simple. Compile -O3 -march=native -fopt-info-vec to see which loops vectorize. Aliasing (restrict / __restrict) helps the compiler.","AVX2 intrinsics: 256-bit registers hold 4 doubles simultaneously. Load: __m256d a = _mm256_load_pd(ptr). Multiply: _mm256_mul_pd(a, b). FMA: _mm256_fmadd_pd(a, b, c) = a*b+c. Check support at runtime: __builtin_cpu_supports(\"avx2\").","Memory alignment: AVX2 loads must be 32-byte aligned. Use alignas(32) double arr[N] or std::aligned_alloc(32, N*8). _mm256_loadu_pd works unaligned but is slower than _mm256_load_pd. Always align hot arrays.","Batch Black-Scholes: pack 4 spot prices, 4 strikes, 4 vols into __m256d registers. Compute d1, d2, exp(), norm_cdf() in SIMD. Expected speedup vs scalar: 3–4× from SIMD alone (before cache effects).","When to use intrinsics: if auto-vectorization works, prefer it — intrinsics are maintenance burden. Use intrinsics only when the compiler fails to vectorize a critical loop and you have measured the bottleneck with perf.","<b>Cache hierarchy — memorize:</b> L1 ~4ns, L2 ~12ns, L3 ~40ns, RAM ~100ns. A cache miss costs 25× more than L1 hit. This is why data layout matters more than algorithm complexity at this level.","<b>Structure-of-Arrays (SoA):</b> Store prices[], strikes[], vols[] separately instead of struct Option{price,strike,vol}[]. When iterating all prices, SoA loads only price data into cache. AoS loads all fields — 3× cache waste.","<b>From your experience:</b> Your cron RAM optimisation on Feel-Mining (8GB→6GB) was probably chunking/batching. SIMD is batching at the CPU register level — process 4 doubles simultaneously in one instruction.","<b>-O3 -march=native — always benchmark with these:</b> Without optimization flags you're measuring compiler overhead, not real performance. Never report benchmark numbers from debug builds."],"terms":["cache line","L1/L2/L3","cache miss","false sharing","SoA vs AoS","branch prediction","[[likely]]","-O3","-march=native","perf stat","SIMD","AVX2","intrinsics","auto-vectorization","aligned load","FMA","__m256d","vector register","throughput","latency"],"p":"Cache-Friendly Matrix Multiply Benchmark + SIMD Batch Option Pricer","pd":"Write batch_bs_call(const double* S, K, T, r, sigma, double* out, int N). Version 1: rely on auto-vectorization (-fopt-info-vec). Version 2: explicit AVX2 intrinsics. Test on N=1,000,000. Report pricings/second for each.","deliverables":["<b>C++23 Performance I — CPU & Cache:</b>","3 implementations with clear comments explaining cache access pattern","Google Benchmark results: naive vs ikj vs blocked (expect 5–10× difference)","perf stat -e cache-misses: confirm clear correlation between misses and performance","<b>C++23 Performance II — SIMD & Vectorization:</b>","Auto-vectorized version: -fopt-info-vec confirms loop vectorizes","AVX2 version: correct results matching scalar, 3–4× speedup confirmed","Benchmark report: scalar, auto-vec, AVX2 in millions of pricings/second"],"r":["📄 'What Every Programmer Should Know About Memory' – Drepper (free PDF, 100 pages, essential)","🌐 google/benchmark: github.com/google/benchmark","📺 CppCon 2014: Mike Acton – 'Data-Oriented Design' (YouTube, classic talk)","🌐 Intel Intrinsics Guide: software.intel.com/sites/landingpage/IntrinsicsGuide/","📄 Agner Fog – 'Optimizing C++' (free PDF at agner.org, essential for performance)","📺 CppCon 2016: Fedor Pikus – 'The Speed of Concurrency' (YouTube)"]},{"w":12,"title":"C++23 Concurrency & Lock-Free Data Structures","t":["<b style='color:#00C47C'>🔗 getcracked.io — C++ Concurrency track:</b> This is the week to start the C++ Concurrency track on getcracked (93 resources, 40 questions, 11 problems, 3 quizzes). It maps almost perfectly to this week's content. Work through the getcracked questions in parallel with the starter code. The 40 questions are the kind that appear in Optiver/IMC technical screens.","<b style='color:var(--pc)'>📋 Week note: You've used Redis queues, job queues, async processing in Laravel/NestJS. C++ concurrency is the same concepts but without the framework handling the hard parts for you. std::jthread, std::atomic, SPSC ring buffers.</b>","<b style='color:var(--pc)'>── C++23 Concurrency ──</b>","std::jthread (C++20/23): like std::thread but auto-joins on destruction (no forgotten joins, no std::terminate). Supports stop_token for cooperative cancellation. Always prefer jthread over thread for new code.","std::mutex + std::scoped_lock: protect shared data with scoped_lock(mutex) (releases automatically at end of scope). std::scoped_lock<M1,M2> for multiple mutexes (avoids deadlock via lock ordering). Use RAII for all mutex locking.","std::atomic<T>: lock-free operations on simple types. atomic.fetch_add(1, std::memory_order_relaxed) for non-critical counters. atomic.compare_exchange_weak(expected, desired) for CAS. Memory ordering: use seq_cst while learning, optimize later.","Thread pool pattern: create N threads at startup, tasks pushed to a shared queue (mutex-protected std::queue). Threads block on a condition variable until a task is available. std::future + std::promise for return values.","ThreadSanitizer: compile with -fsanitize=thread to detect data races at runtime. AddressSanitizer: -fsanitize=address for memory errors. Run both before declaring concurrency code correct.","<b style='color:var(--pc)'>── Lock-Free Data Structures ──</b>","SPSC ring buffer: single producer, single consumer — the fastest inter-thread communication primitive. Producer writes to tail, consumer reads from head. They only share these two indices — no mutex needed if atomic.","Cache-line padding: place head and tail in DIFFERENT 64-byte cache lines using alignas(64). Without this, every write to tail invalidates the cache line containing head → constant false sharing → 10× latency degradation.","CAS (compare-and-swap): std::atomic::compare_exchange_weak(expected, desired). Succeeds if current == expected → sets to desired. Fails if changed → updates expected, retry. Loop until success. All lock-free algorithms use CAS.","ABA problem: thread 1 reads value A. Thread 2 changes A→B→A. Thread 1 CAS sees A and thinks nothing changed. Fix: tagged pointer (combine value + version counter in 128-bit atomic). Subtle but critical for MPSC/MPMC queues.","Lock-free vs wait-free: lock-free = at least one thread always makes progress (starvation possible). Wait-free = every thread makes progress in bounded steps. SPSC queues are typically wait-free. MPMC queues are usually only lock-free.","<b>From your experience:</b> Your Laravel job queues and NestJS microservices are high-level concurrency. C++ gives you the primitives underneath — threads, mutexes, atomics. Same problems, different abstraction level.","<b>SPSC ring buffer — the core primitive:</b> Single-producer single-consumer. Producer writes to tail, consumer reads from head. No mutex needed — just two atomic indices. The fastest inter-thread communication primitive.","<b>alignas(64) — false sharing prevention:</b> Put head and tail on different 64-byte cache lines. Without this, writing to tail invalidates the cache line containing head — every write forces a cache reload. 10× latency degradation.","<b>ThreadSanitizer:</b> Compile with -fsanitize=thread. Run before calling any concurrent code correct. Data races in financial systems cause silent position corruption — far worse than crashes."],"terms":["std::jthread","std::mutex","std::scoped_lock","std::atomic","memory_order","CAS","thread pool","std::future","std::promise","ThreadSanitizer","SPSC","ring buffer","compare-and-swap","false sharing","ABA problem","lock-free","wait-free","tagged pointer","memory barrier","acquire/release"],"p":"Multi-Threaded Monte Carlo Pricer + Lock-Free SPSC Ring Buffer","pd":"Implement templated SPSC<T,N> (N must be power-of-2). Use alignas(64) to separate head/tail on different cache lines. Test with producer writing 10M items, consumer reading. Measure p50/p99/p999 latency in nanoseconds.","deliverables":["<b>C++23 Concurrency:</b>","Thread pool with fixed N workers pulling tasks from a shared queue","Atomic path counter — confirm no data race with ThreadSanitizer","Scaling chart: speedup vs thread count — linear scaling expected up to core count","<b>Lock-Free Data Structures:</b>","SPSC<T,N> with push(T) and pop(T&) returning bool (success/empty)","alignas(64) separation: sizeof each padded struct == 64 bytes confirmed","Latency benchmark: p50 < 100ns, p99 < 500ns for back-to-back push/pop"],"r":["📖 C++ Concurrency in Action – Anthony Williams, 2nd edition (the definitive book)","🌐 cppreference.com/w/cpp/thread","📺 CppCon 2017: Fedor Pikus – lock-free talk (YouTube)","🌐 1024cores.net – Dmitry Vyukov's SPSC queue implementation (read the source)","🌐 preshing.com – 'An Introduction to Lock-Free Programming' (blog series)","📺 CppCon 2023: lock-free data structures talk (YouTube)","🌐 getcracked.io — C++ Concurrency track: work through all 40 questions this week and next"]},{"w":13,"title":"Network Programming & Low-Latency Patterns","t":["<b style='color:var(--pc)'>📋 Week note: You've used WebSockets (NestJS), Redis pub/sub, HTTP APIs. C++ networking is lower level — raw POSIX sockets, UDP multicast, epoll. The concepts map but the code is more explicit.</b>","<b style='color:var(--pc)'>── Network Programming in C++ ──</b>","POSIX sockets: socket(AF_INET, SOCK_DGRAM, 0) for UDP. bind() to a port to receive. sendto(fd, buf, len, 0, addr, addrlen) to send. recvfrom(fd, buf, len, 0, addr, &addrlen) to receive. Every network program starts here.","UDP vs TCP for market data: UDP = no connection, no retransmission, ~10–50µs latency. TCP = reliable, ordered, ~100µs–1ms. Exchanges multicast market data via UDP. Order entry uses TCP (need reliability).","Non-blocking I/O: fcntl(fd, F_SETFL, O_NONBLOCK). With epoll: epoll_create1(0), epoll_ctl(ep, EPOLL_CTL_ADD, fd, &event), epoll_wait(ep, events, MAX, timeout). One thread handles thousands of connections.","Binary message protocol: define __attribute__((packed)) struct MarketData { uint8_t type; int64_t timestamp_ns; uint32_t instrument_id; double bid; double ask; }. Use htonl/ntohl for byte order. Fixed-size = zero parse overhead.","Multicast: one publisher, many receivers with no additional send overhead. setsockopt(fd, IPPROTO_IP, IP_ADD_MEMBERSHIP, &mreq, sizeof(mreq)). Used by all major exchanges for market data distribution.","<b style='color:var(--pc)'>── Low-Latency C++23 Patterns ──</b>","Memory pool allocator: pre-allocate N objects in a contiguous array. Free list = stack of available indices. allocate() = O(1) pop. deallocate() = O(1) push. Zero heap allocation in hot path. Use for every market data message and order event.","CPU pinning: pthread_setaffinity_np(pthread_self(), sizeof(cpuset), &cpuset). Pin market data thread to core 0, strategy thread to core 1. Prevents OS migration (migration = cache flush = latency spike). Combine with isolcpus kernel param.","Busy-wait spinning: while (!queue.pop(event)) { _mm_pause(); }. The _mm_pause() (PAUSE instruction) reduces power and memory contention during spin. Use when you need < 1µs reaction latency. Costs 1 full CPU core.","Avoid syscalls in hot path: syscalls trap to kernel and cost 500ns–5µs. Use clock_gettime(CLOCK_MONOTONIC_RAW) for timestamps (uses vDSO — no kernel trap). Never malloc in hot path (malloc sometimes calls brk = syscall).","std::atomic<std::uint64_t> timestamp counters: TSC (Time Stamp Counter) via __rdtsc() gives cycle-accurate timestamps with zero overhead. Convert cycles to ns using known CPU frequency. Used for sub-µs profiling in production.","<b>From your experience:</b> Your NestJS microservices architecture with async event handling maps directly to epoll-based C++ network servers. The mental model is identical — the implementation is more explicit.","<b>UDP vs TCP for market data:</b> Exchanges use UDP multicast for market data (no retransmission, ~10-50µs). Order entry uses TCP (reliable, ordered, ~100µs-1ms). You need both.","<b>Memory pool allocator:</b> Pre-allocate N objects at startup. allocate() = O(1) pop. deallocate() = O(1) push. Zero heap allocation in hot path. Your Redis connection pooling is the same concept.","<b>Busy-wait spinning:</b> while (!queue.pop(event)) { _mm_pause(); }. Costs 1 full CPU core but gives < 1µs reaction latency. Only use when latency is more important than CPU efficiency."],"terms":["socket","UDP","TCP","bind","recvfrom","epoll","non-blocking I/O","multicast","byte order","packed struct","file descriptor","memory pool","CPU pinning","busy-wait","_mm_pause","vDSO","syscall overhead","isolcpus","NUMA","hot path","TSC","__rdtsc"],"p":"UDP Market Data Feed Receiver + Memory Pool + CPU-Pinned Market Data Receiver","pd":"Implement PoolAllocator<T,N> with O(1) allocate/deallocate. Benchmark vs new/delete at p50/p99/p999. Integrate into W35 UDP receiver: all BBO structs from pool. Pin receiver thread to core 1. Show latency improvement.","deliverables":["<b>Network Programming in C++:</b>","BBO table: unordered_map<uint32_t, BBO> updated on every packet","Correct byte-order handling for all fields","Python script that sends 100,000 packets — C++ receiver processes all without loss","<b>Low-Latency C++23 Patterns:</b>","PoolAllocator<T,N>: both operations O(1), no heap allocation after init","Benchmark: PoolAllocator p99 vs new/delete — expect 10× or more improvement","CPU-pinned receiver: before/after latency comparison using __rdtsc"],"r":["📖 Beej's Guide to Network Programming (free: beej.us/guide/bgnet/) — start here","📖 Stevens – UNIX Network Programming Vol.1 (classic reference)","🌐 linux.die.net/man/7/socket (socket man page)","📺 CppCon 2015: Timur Doumler – 'Memory and Cache' (YouTube)","📺 CppCon 2020: Ben Saks – 'Practical Memory Pool Based Allocators' (YouTube)","🌐 man7.org/linux/man-pages/man2/sched_setaffinity.2.html"]},{"w":14,"title":"FIX Protocol, Order Management & QuantLib","t":["<b style='color:var(--pc)'>📋 Week note: FIX is the universal language of electronic trading — every exchange, every broker speaks it. Your webhook/API experience means the protocol concepts are familiar, just a different format.</b>","<b style='color:var(--pc)'>── FIX Protocol & Order Management ──</b>","FIX structure: tag=value pairs separated by SOH (ASCII 0x01). BeginString=FIX.4.2 (tag 8), MsgType=D (tag 35) = New Order Single. Messages end with Checksum (tag 10). QuickFIX library handles all parsing for you.","New Order Single (type D) tags to know cold: 11=ClOrdID (unique ID you generate), 38=OrderQty, 44=Price, 54=Side (1=buy, 2=sell), 55=Symbol, 59=TimeInForce (0=Day, 1=GTC, 3=IOC). This is 80% of order flow.","Execution Report (type 8) from exchange: tag 39=OrdStatus (0=New, 1=PartialFill, 2=Filled, 4=Cancelled, 8=Rejected). Tags 32=LastQty, 31=LastPx for fills. Your OMS updates position state on every ER received.","Order state machine: New → PartialFill* → (Filled | Cancelled | Rejected). Each state transition triggered by an Execution Report. Implement as explicit state machine with invalid_transition exception for bad inputs.","Cancel/replace workflow: OrderCancelReplaceRequest (type G) with original ClOrdID + new parameters. Exchange responds with ER confirming or rejecting. Handle rejection — exchange can reject cancel/replace, always have fallback logic.","<b style='color:var(--pc)'>── QuantLib & Eigen in C++23 ──</b>","QuantLib date system: ql::Date(15, ql::January, 2025). Day count conventions: ql::Actual365Fixed(), ql::Thirty360(). Calendars: ql::UnitedStates(ql::UnitedStates::NYSE). Getting dates wrong changes bond price — critical to be precise.","QuantLib yield curve: ql::Handle<ql::YieldTermStructure> curve(ql::ext::make_shared<ql::FlatForward>(today, rate, dc)). Build from market quotes using ql::PiecewiseFlatForward for bootstrapped curves. Price cashflows against this.","QuantLib option pricing: ql::VanillaOption option(payoff, exercise). Attach engine: option.setPricingEngine(ql::ext::make_shared<ql::AnalyticEuropeanEngine>(bsProcess)). Swap engines without changing the option object — clean separation.","Eigen matrix ops: MatrixXd A(N,N); A(0,1) = 2.5; A.transpose(); A.lu().solve(b) for Ax=b. VectorXd v = A * x. A.eigenvalues() for eigendecomposition. SelfAdjointEigenSolver for symmetric matrices (faster, always real eigenvalues).","Combining in a real system: use Eigen for portfolio math (covariance, OLS, PCA) and QuantLib for instrument pricing (handles holidays, conventions, term structures). Link both via CMake: find_package(QuantLib) + find_package(Eigen3 REQUIRED).","<b>From your experience:</b> Your Wigl webhook processing (payment flows, KYC callbacks) is conceptually identical to FIX Execution Report processing. Both are: receive event → validate → update state → trigger next action.","<b>FIX New Order Single — memorize cold:</b> Tag 11=ClOrdID (your unique ID), 38=OrderQty, 44=Price, 54=Side (1=buy, 2=sell), 55=Symbol, 59=TimeInForce (0=Day, 1=GTC, 3=IOC). 80% of all order flow uses exactly these tags.","<b>Order state machine:</b> New → PartialFill* → Filled | Cancelled | Rejected. Each state transition triggered by an Execution Report (tag 39=OrdStatus). Your payment flow state machines from Wigl are the same pattern."],"terms":["FIX protocol","New Order Single","Execution Report","ClOrdID","SOH","OrdStatus","TimeInForce","OMS","state machine","cancel/replace","fill","QuantLib","ql::Date","day count convention","yield term structure","pricing engine","Eigen","MatrixXd","VectorXd","SelfAdjointEigenSolver","CMake","find_package"],"p":"FIX Order Entry System + C++23 Derivatives Pricing Library","pd":"Build a library with CMakeLists.txt linking QuantLib + Eigen. Use QuantLib to price European options and ZCBs. Use Eigen for OLS regression (β=(X'X)⁻¹X'y) and covariance matrix. Expose a clean API in a header file.","deliverables":["<b>FIX Protocol & Order Management:</b>","FIX session: connect, logon, maintain heartbeats automatically","Order lifecycle: New → PartialFill → Filled verified with state machine","Cancel flow: sent → confirmed → order removed from internal book","<b>QuantLib & Eigen in C++23:</b>","CMakeLists.txt correctly finds and links both libraries","QuantLib option price verified against your Python BS implementation","Eigen OLS: β coefficients verified against Python statsmodels on identical data"],"r":["🌐 fixtrading.org/standards — FIX spec (free)","🌐 quickfixengine.org — QuickFIX library docs","📄 FIX protocol tag reference: fiximate.com (searchable tag list)","🌐 quantlib.org/reference — QuantLib C++ docs","🌐 eigen.tuxfamily.org/dox/ — Eigen docs","📺 CppCon: 'QuantLib in Practice' (YouTube)"]},{"w":15,"title":"C++23 Integration Project — Full Pricing Engine","t":["<b style='color:var(--pc)'>📋 Week note: This is your most important portfolio piece for Tier 1 US interviews. Polish the GitHub repo — interviewers look at it before the phone screen.</b>","<b>Week goal:</b> Build one substantial C++23 project that combines everything from weeks 9-14. No new concepts — pure integration and solidification.","<b>Project:</b> A complete option pricing engine: UDP market data receiver → SPSC buffer → BS/Monte Carlo pricer → Greeks calculator → risk aggregator → FIX order sender.","<b>Performance requirements:</b> > 1M pricings/second for European options. < 10µs tick-to-signal latency. Zero memory leaks (valgrind clean). ThreadSanitizer clean.","<b>Testing requirements:</b> Google Test unit tests for every pricing function. Put-call parity verified. Greeks verified against known analytical values. All tests pass in CI.","<b>Why this week exists:</b> Writing each component in isolation is different from integrating them. The bugs that appear at integration time are the ones that teach you the most.","<b>CMake build system:</b> CMakeLists.txt with find_package(QuantLib), find_package(Eigen3), Google Test. Multi-stage Dockerfile. GitHub Actions CI. This is what a real C++ quant project looks like."],"terms":["integration","CMake","Google Test","valgrind","CI/CD","performance profiling","latency breakdown"],"p":"C++23 Integrated Option Pricing Engine","pd":"Build a complete option pricing engine integrating: UDP market data receiver, SPSC ring buffer, BS + Monte Carlo pricer with Greeks, FIX order sender. Profile latency end-to-end. Publish on GitHub with CMakeLists.txt, CI badge, benchmark table in README.","deliverables":["End-to-end latency < 10µs tick-to-signal, measured with RDTSC at each stage","> 1M European option pricings/second with AVX2 batch pricer","Zero memory leaks (valgrind --leak-check=full), zero data races (ThreadSanitizer)","GitHub repo: CMakeLists.txt + Dockerfile + CI badge + README with Mermaid architecture diagram and benchmark table"],"r":["📖 Building Low Latency Applications with C++ — Sourav Ghosh","🌐 github.com/google/benchmark — Google Benchmark for C++","🌐 github.com/google/googletest — Google Test","📺 CppCon 2023: C++ performance in trading systems (YouTube)"]},{"w":16,"title":"C++ Consolidation + Introduction to Competitive Programming","t":["<b style='color:#00C47C'>🔗 getcracked.io — Design Patterns track:</b> 44 resources, 11 questions, 12 problems. Trading systems use specific patterns constantly: Strategy (swap algorithms without changing the caller — different execution strategies), Observer (market data event system), Factory (create instruments by type), Command (order objects with undo). This week: work through the getcracked Design Patterns track and identify which patterns appear in the C++ code you've written so far.","<b style='color:var(--pc)'>📋 Week note: Competitive programming feels completely different from production coding. Don't be discouraged if it's hard at first — it's a learnable skill, not innate talent. Consistency beats intensity here.</b>","<b>Week goal:</b> Solidify C++ knowledge gaps from weeks 9-15, then start competitive programming — which is a separate skill required for Tier 1 screens.","<b>Competitive programming is different from production coding:</b> It's about solving algorithmic puzzles under time pressure. Jane Street, Citadel, and HRT all include competitive-programming-style problems in their technical screens. You need to practice this separately.","<b>Start with LeetCode — not Codeforces yet:</b> LeetCode Medium is the baseline for Tier 1 screens. Do 20 mediums this week across: arrays/hashmaps, two pointers, sliding window, binary search, heaps. Time yourself (target < 20 min each).","<b>C++ for competitive programming is slightly different:</b> Use #include<bits/stdc++.h> (includes everything), ios::sync_with_stdio(false) + cin.tie(NULL) (fast I/O), and write for correctness first, speed second.","<b>Pattern recognition is the skill:</b> Most interview problems are variations of ~15 patterns. Spend time identifying the pattern before writing code. 'This looks like a sliding window' → apply the template.","<b>Key patterns to learn this week:</b> Two pointers, sliding window, prefix sums, binary search on answer, monotonic stack, heap (priority_queue). These cover ~60% of Tier 1 screen problems."],"terms":["LeetCode","Codeforces","competitive programming","time complexity","space complexity","sliding window","two pointers","binary search","heap","dynamic programming"],"p":"LeetCode 20-Problem Sprint + C++ Patch Week","pd":"Solve 20 LeetCode Medium problems in C++ (timed, < 20 min each). For each one: identify the pattern first, then code. Separately: revisit any C++ concept from weeks 9-15 that felt shaky. Write clean solutions, not just accepted ones.","deliverables":["20 LeetCode Mediums solved in C++ — log pattern type and time taken for each","Pattern recognition: group your 20 solutions by pattern (sliding window, heap, etc.)","Identify your 3 weakest C++ areas from weeks 9-15 — write focused exercises for each","Codeforces account created, first 5 problems (Div 2 A/B level) solved"],"r":["🌐 leetcode.com — filter: Medium, topic tags: Array, Hash Table, Two Pointers, Sliding Window","🌐 neetcode.io — NeetCode 150 list, best curated problem set for interviews","📺 NeetCode YouTube — pattern-based explanations, very clear","🌐 codeforces.com — create account, start with Div 2 A problems","🌐 getcracked.io — Design Patterns track (44 resources, 11 questions) — focus on Strategy, Observer, Factory, Command"]},{"w":17,"title":"Competitive Programming I — Core Algorithms","t":["<b style='color:var(--pc)'>📋 Week note: DP is the hardest topic here. Give it 3 full days. The pattern click when it clicks — until then, just keep implementing solutions and reading editorials.</b>","<b>Why this matters for Tier 1:</b> Jane Street's first technical screen is often a Codeforces Div 1 C problem. Citadel uses HackerRank with hard algorithmic problems. You cannot wing this — it requires dedicated practice.","<b>Dynamic Programming (DP) — the most important topic:</b> DP = breaking a problem into subproblems and caching results. Canonical problems: Fibonacci, coin change, longest common subsequence, 0/1 knapsack, edit distance. Learn the recurrence relation first, then code.","<b>Graphs:</b> BFS (shortest path in unweighted graph), DFS (connected components, cycle detection), Dijkstra (shortest path in weighted graph), topological sort (dependency ordering — think your job queue dependencies). Use adjacency list representation.","<b>Trees:</b> Binary tree traversals (pre/in/post-order), LCA (lowest common ancestor), binary search tree operations. Many problems that look complex reduce to a tree traversal.","<b>Heaps / Priority Queues:</b> std::priority_queue<int> (max-heap by default). Use for: k largest elements, merge k sorted lists, median of a stream, Dijkstra. These appear constantly in quant interviews.","<b>String algorithms:</b> Sliding window for substring problems, two pointers for palindromes. Less common in quant screens but good to know.","<b>Practice method:</b> Read problem → identify pattern (5 min max) → implement → check time/space complexity → read editorial if stuck > 20 min. Never skip reading editorials — that's where the learning is."],"terms":["dynamic programming","memoization","BFS","DFS","Dijkstra","topological sort","priority queue","time complexity","space complexity","recurrence relation"],"p":"Algorithm Sprint — 30 Problems in C++","pd":"Solve 30 LeetCode problems in C++ across: 10 DP, 8 graph, 7 tree, 5 heap. Time each one. For every problem taking > 25 min: read the editorial, implement the clean solution, and annotate why you missed it. Aim for Codeforces rating > 1200 by end of week.","deliverables":["30 problems solved: 10 DP, 8 graph, 7 tree, 5 heap — log time taken and pattern","DP: implement coin change, LCS, and 0/1 knapsack from memory in < 15 min each","Graph: implement Dijkstra from scratch in C++ without looking it up","Codeforces: 10 Div 2 A/B problems solved, working toward rating 1200+"],"r":["🌐 neetcode.io/roadmap — best structured problem roadmap, follow the order","🌐 cp-algorithms.com — competitive programming algorithms with C++ implementations","📺 Errichto YouTube — competitive programming explanations by a red Codeforces coder","🌐 codeforces.com/problemset — filter Div 2 A/B problems, sorted by difficulty"]},{"w":18,"title":"Competitive Programming II — Hard Problems & Quant-Specific Patterns","t":["<b style='color:var(--pc)'>📋 Week note: Probability puzzles feel hard at first because they require a different thinking style — systematic enumeration, not intuition. Draw state diagrams for every problem. The pattern recognition comes with volume.</b>","<b>LeetCode Hard:</b> Tier 1 screens often include Hard problems. Target: solve a Hard in < 30 min. Common patterns at Hard level: monotonic stack/deque, segment trees, union-find, advanced DP (bitmask DP, interval DP).","<b>Monotonic stack:</b> Maintain a stack where elements are always increasing (or decreasing). Use for: next greater element, largest rectangle in histogram, trapping rainwater. These appear in both LeetCode and quant screens.","<b>Segment trees:</b> Data structure for range queries (sum, min, max) with O(log n) update and query. Used in order book implementations and tick data analysis.","<b>Union-Find (Disjoint Set Union):</b> Tracks which elements are in the same group. O(α(n)) ≈ O(1) operations. Used for: connected components, Kruskal's MST, cycle detection.","<b>Quant-specific patterns:</b> Sliding window maximum (using deque) = rolling max for drawdown calculations. Priority queue with lazy deletion = order book best bid/ask. Prefix sums = cumulative PnL. These appear in actual QD interviews.","<b>Math problems in quant screens:</b> Expected value calculations, conditional probability, combinatorics. Example: 'What is the expected number of coin flips to get 3 consecutive heads?' (14 — use Markov chain states). Practice these alongside coding.","<b>Codeforces Div 1 C / Div 2 D level:</b> This is the target for Tier 1 screens. Requires combining multiple algorithms. Practice reading problems carefully — misunderstanding the problem is the most common mistake."],"terms":["monotonic stack","segment tree","union-find","bitmask DP","interval DP","expected value","Markov chain","conditional probability","combinatorics"],"p":"Hard Problem Sprint + Probability Puzzles","pd":"Solve 15 LeetCode Hard problems in C++. Separately: solve 20 probability/expected value puzzles from 'Heard on the Street'. For each probability puzzle: draw the state diagram or probability tree before computing. Aim for Codeforces rating 1400+.","deliverables":["15 LeetCode Hards solved in C++ — annotate which pattern each uses","20 probability puzzles from Heard on the Street — written solutions showing reasoning","Implement a segment tree from scratch in C++ — range sum query + point update","Codeforces rating 1400+ (Specialist level) — take a real rated contest"],"r":["📖 'Heard on the Street' — Timothy Crack (essential, buy this, do every problem)","🌐 leetcode.com/problemset — filter: Hard, sort by frequency","🌐 atcoder.jp — cleaner problem statements than Codeforces, good for Hard practice","📺 William Fiset — segment tree and union-find implementations (YouTube)"]},{"w":19,"title":"Stochastic Calculus Basics & Interview Math","t":["<b style='color:var(--pc)'>📋 Week note: Don't try to fully rigourously derive everything — that takes a full MSc course. The goal is: understand what these concepts mean, be able to explain them in an interview, and recognize them when they appear in pricing models.</b>","<b>Why stochastic calculus?</b> Tier 1 QD interviews sometimes touch on the math behind models. You don't need to derive Black-Scholes, but understanding Brownian motion, Itô's lemma conceptually, and why GBM (Geometric Brownian Motion) is used for prices is expected.","<b>Brownian motion (Wiener process):</b> A random walk in continuous time. Properties: starts at 0, independent increments, increments ~ N(0, dt). W(t) - W(s) ~ N(0, t-s). This is the building block of all continuous-time finance.","<b>GBM (Geometric Brownian Motion):</b> dS = μS dt + σS dW. Stock price follows this model. The μS dt term is the expected drift (average return), σS dW is the random shock. Log-returns are Normal because ln(S) follows a regular Brownian motion.","<b>Itô's lemma (conceptual):</b> The chain rule for stochastic calculus. If S follows GBM and f(S,t) is an option price, then df has an extra ½σ²S²(∂²f/∂S²)dt term. This extra term IS the Gamma — which is why long-gamma positions profit from volatility.","<b>Risk-neutral pricing:</b> Instead of using the real-world drift μ, price options using the risk-free rate r as the drift. The option price = e^(-rT) × E^Q[payoff] where E^Q is expectation under the risk-neutral measure. This is why Monte Carlo works.","<b>Mental math for quant interviews:</b> Practice: multiplying 2-digit numbers mentally, computing percentages quickly, estimating square roots, powers of 2 up to 2^20. Tier 1 interviews often have fast mental math components.","<b>Estimation problems (Fermi):</b> 'How many piano tuners in Chicago?' — structure: population → households → pianos/household → tuning frequency → time per tuning → tuners needed. Practice 10 estimation problems. Interviewers test structured thinking, not the exact answer."],"terms":["Brownian motion","Wiener process","GBM","Itô's lemma","risk-neutral measure","drift","diffusion","Gamma","convexity","Fermi estimation"],"p":"Stochastic Calculus Notebook + Mental Math Drills","pd":"Build a Jupyter notebook: simulate Brownian motion paths (np.cumsum of N(0,dt) increments), simulate GBM paths (the stock price model), verify that log-returns are Normal (plot histogram), show that E[S_T] = S_0×e^(μT). Separately: complete 30 mental math drills timed.","deliverables":["Brownian motion simulation: 100 paths, fan chart, verify E[W(T)]=0 and Var[W(T)]=T","GBM simulation: 10,000 paths, verify terminal prices are log-normal","Written explanation (your own words): why does Black-Scholes use r not μ? (risk-neutral pricing)","30 mental math drills completed and timed: target < 10 seconds each"],"r":["📺 Patrick Boyle — 'Stochastic Calculus for Finance' (YouTube, accessible)","📖 'Paul Wilmott Introduces Quantitative Finance' — Ch. 4-6 (intuitive, not rigorous)","📺 MIT 18.S096 — Topics in Mathematics with Applications in Finance (free on YouTube)","🌐 math.stackexchange.com — search 'Ito's lemma intuition' for multiple explanations"]},{"w":20,"title":"Quant Infrastructure — TimescaleDB, ZeroMQ & Live Trading","t":["<b style='color:var(--pc)'>📋 Week note: Honest pacing for your background: TimescaleDB = 1 day (it's just PostgreSQL + hypertables, you'll fly through it). ZeroMQ = 1 day (it's Redis pub/sub but faster and without a broker). Docker/CI/Prometheus/Grafana = half day review (you know all of this). Alpaca live trading = 1.5 days (genuinely new). ML signals = skip for now, come back after job.</b>","<b style='color:var(--pc)'>── Time Series Databases ──</b>","TimescaleDB = PostgreSQL with automatic time partitioning. Your existing PG knowledge applies directly. CREATE TABLE ticks (time TIMESTAMPTZ NOT NULL, symbol TEXT, bid DOUBLE PRECISION, ask DOUBLE PRECISION); SELECT create_hypertable('ticks','time');","Continuous aggregates: pre-computed views that refresh automatically. CREATE MATERIALIZED VIEW ohlcv_1m WITH (timescaledb.continuous) AS SELECT time_bucket('1 minute',time), symbol, first(bid,time), max(ask), min(bid), last(ask,time) FROM ticks GROUP BY 1,2. Automatic OHLCV from raw ticks.","Key query patterns: SELECT time_bucket('1h',time) AS hour, symbol, last(ask,time) FROM ticks WHERE time > NOW()−INTERVAL '1 year' AND symbol='AAPL' GROUP BY 1,2 ORDER BY 1. Time range queries with hypertables = milliseconds not minutes.","kdb+/q basics: the industry standard tick DB at most banks and hedge funds. q is a columnar language. select price,size from trade where date=.z.d,sym=`AAPL. You likely won't build in q but you WILL interact with q systems as a QD.","Data partitioning: partition by date for time series (standard). Within a date, sort by symbol then time. TimescaleDB handles this automatically via chunks. Query performance: O(log n) for indexed lookups vs O(n) for unpartitioned tables.","<b style='color:var(--pc)'>── Message Queues & Event-Driven Systems ──</b>","ZeroMQ patterns: (1) PUB/SUB — publisher broadcasts, subscribers filter by topic prefix. (2) PUSH/PULL — work queue, round-robin to workers. (3) REQ/REP — synchronous RPC. No broker, peer-to-peer, library only. Latency: < 100µs.","Python zmq: context = zmq.Context(); socket = context.socket(zmq.PUB); socket.bind('tcp://*:5555'). Subscriber: socket.connect(...); socket.setsockopt(zmq.SUBSCRIBE, b'AAPL'). Messages: socket.send_multipart([topic, payload]).","Kafka vs ZeroMQ: Kafka = durable log, replay, high throughput (1M msg/sec/node), millisecond latency, needs broker. ZeroMQ = no persistence, no broker, sub-100µs latency, simpler. For pre-trade (latency-sensitive): ZeroMQ. For post-trade (audit trail): Kafka.","Redis Pub/Sub: you already know Redis from Laravel. subscribe('channel') / publish('channel', msg). Lower throughput than ZeroMQ, higher latency, but zero new infrastructure if you already run Redis. Fine for non-critical internal messaging.","Serialization formats: JSON = slow, large. MessagePack = compact binary JSON. FlatBuffers = zero-copy (access fields without parsing). Protobuf = schema-versioned, good tooling. For market data in C++: fixed binary struct (fastest). For Kafka: Avro or Protobuf.","<b style='color:var(--pc)'>── Docker & CI/CD for Quant Systems ──</b>","Multi-stage Dockerfile for C++: Stage 1 (builder): FROM gcc:13 → COPY source → cmake → compile. Stage 2 (runtime): FROM debian:slim → COPY only the binary. Final image: ~50MB vs ~2GB for single-stage. Standard in production.","docker-compose.yml for a trading system: services: timescaledb, feed-handler (C++), strategy (Python), prometheus, grafana. Networks: internal (private, no external access), volumes: named volume for DB data persistence.","GitHub Actions: on: push → jobs: build → steps: checkout, cmake build, ctest, pytest, docker build. Build badge in README: [![CI](https://github.com/user/repo/workflows/CI/badge.svg)]. Your Laravel CI experience maps directly.","Google Test for C++: #include <gtest/gtest.h>. TEST(BSPricerTest, CallAtExpiry) { EXPECT_NEAR(bs_call(100,100,0,0.05,0.2), 0.0, 1e-6); }. Run with ctest. Add to CMakeLists: enable_testing(); add_test(NAME unit_tests COMMAND ./run_tests).","Environment parity: pin all versions in Dockerfile. FROM gcc:13.2.0 not gcc:latest. Pin Python: python:3.12.0-slim. Pin QuantLib version in conanfile.txt. 'Works on my machine' disappears when everything is containerized.","<b style='color:var(--pc)'>── Trading System Architecture ──</b>","Five core components: (1) Feed Handler: normalizes raw market data. (2) Strategy Engine: computes signals. (3) Pre-Trade Risk: validates orders vs limits. (4) Order Manager: state machine for all orders. (5) Execution: FIX to exchange. Each owns its state.","Data flow: Feed → [ZeroMQ] → Strategy + Risk + PnL. Strategy → [in-process queue] → Risk → [FIX] → Exchange → [FIX callback] → OMS → [position update] → PnL. Every arrow is a latency source — profile each independently.","Latency budget for a systematic strategy: total target 50µs. Feed handler 5µs, ZeroMQ pub/sub 2µs, strategy compute 10µs, risk check 3µs, FIX serialization 5µs, network to exchange 25µs. Allocate and profile against budget.","Kill switch and circuit breakers: hard position limit, max daily loss limit (halt all trading if PnL < −X), max order rate (no more than N/sec). These are non-negotiable. Test them before going live — an untested kill switch is no kill switch.","Event log for disaster recovery: log every event (tick, signal, order, fill) with µs timestamp to a persistent store. On crash: replay log to reconstruct state. Design for restartability — the system must resume cleanly from any log point.","<b style='color:var(--pc)'>── Monitoring & Observability ──</b>","Prometheus metric types: counter (only goes up: total fills), gauge (up/down: current positions), histogram (distribution: latency), summary (quantiles). C++ client: prometheus-cpp. Python: prometheus_client. Expose via HTTP /metrics endpoint.","PromQL for trading dashboards: rate(fills_total[5m]) = fills per second. histogram_quantile(0.99, latency_seconds_bucket) = p99 latency. position_size{symbol='AAPL'} = current AAPL position. These 3 cover most trading monitoring needs.","Grafana dashboard panels: (1) PnL line chart over time (gauge), (2) positions heatmap by symbol, (3) latency histogram with p50/p95/p99 markers, (4) fills per second, (5) risk utilization % (current delta / delta limit). Build this.","spdlog for structured C++ logging: spdlog::info('fill: sym={} qty={} price={:.4f}', sym, qty, px). Async logger: spdlog::basic_logger_mt<spdlog::async_factory>('file_logger', 'trading.log'). Never block the hot path for logging.","Alerting rules: Prometheus Alertmanager sends Slack/email on: PnL drops > 2% in 1 hour, p99 latency > 200µs, fill rate = 0 for > 30s, heartbeat missing > 5s. Test all alerts before going live.","<b style='color:var(--pc)'>── Machine Learning for Quant Dev ──</b>","Feature engineering: momentum (1d/5d/21d past returns), vol ratio (5d realized vol / 21d realized vol), volume ratio (today / 20d avg), cross-sectional rank (z-score vs universe). At each feature computation, ask: 'could I have computed this at decision time using only past data?'","Time series cross-validation with purging: standard k-fold leaks future data into training. Correct approach: (1) purge training samples overlapping with test in time, (2) add embargo period after test samples. Use mlfinlab.PurgedKFold or implement manually.","XGBoost for financial data: handles non-linearity and feature interactions automatically. Key params: n_estimators=500, max_depth=3 (shallow to prevent overfitting), learning_rate=0.01, subsample=0.7. Grid search over these with purged CV.","Walk-forward with monthly refit: train on expanding window of N months, predict next month, roll. Realistic because in production you retrain as new data arrives. Compare cumulative returns of ML signal vs naive benchmark.","Model deployment: model.save_model('model.ubj'). Load in production: booster = xgb.Booster(); booster.load_model('model.ubj'). Predict: booster.predict(xgb.DMatrix(X_new)) in < 0.1ms per prediction. Monitor for concept drift monthly.","<b style='color:var(--pc)'>── Alternative Data & Live Trading APIs ──</b>","Alpaca Markets: free paper and live trading API. REST: POST /v2/orders to place, GET /v2/positions for holdings, GET /v2/account for PnL. Paper trading endpoint: paper-api.alpaca.markets — identical API to live, zero risk.","Alpaca WebSocket: asyncio + websockets. Connect → authenticate → subscribe(['AAPL','MSFT']). Process messages in async callback. Never time.sleep() in async (blocks event loop). Use asyncio.sleep(0) to yield.","Polygon.io: better quality than yfinance for production use. REST: last 2yr historical data free on Starter plan. WebSocket: real-time trades/quotes. Plans: free (delayed 15min), ~$30/mo (real-time). Use for serious backtesting.","Reconnection logic: WebSocket connections drop. Implement: exponential backoff (0.1s, 0.2s, 0.4s, 0.8s... max 30s), max_retries=10, log each reconnect attempt. Your Laravel retry/queue experience applies here.","News sentiment: Alpaca news API (/v1beta1/news) gives 3yr of headlines for free. VADER (rule-based, fast): SentimentIntensityAnalyzer().polarity_scores(text)['compound']. FinBERT (transformer, accurate): fine-tuned on financial text.","<b style='color:var(--pc)'>── Open Source & Technical Presence ──</b>","Reading large codebases: start from CMakeLists.txt (understand build structure). Find main() entry point. Trace one specific data flow (e.g., how is an option priced?). Use clangd in VS Code for jump-to-definition. Use git log --follow -p filename to see history.","Finding contributions: github.com/lballabio/QuantLib → Issues → label:'good first issue'. Look for: documentation gaps (lowest barrier), bugs you can reproduce + fix, missing test cases. One merged PR matters more than 100 forked repos.","CMake and Conan: CMakeLists.txt defines build targets. conanfile.txt: [requires] quantlib/1.34\\neigen/3.4.0. conan install . --build=missing. CMake: find_package(QuantLib REQUIRED), target_link_libraries(myapp QuantLib::QuantLib). Your npm/composer knowledge maps here.","GitHub portfolio hygiene: every repo needs: README with (what, how to build, example output, benchmark results), CI badge, clear code structure. Pin your best 3 repos. QD interviewers look at your GitHub before the phone screen.","Technical blog posts: write about what you built. Format: problem → approach → key code snippet → benchmark numbers → lessons. Publish on Medium or dev.to. One technical article showing deep understanding generates more interest than 10 cold applications.","<b>From your experience:</b> TimescaleDB = your PostgreSQL/MySQL knowledge + one command: SELECT create_hypertable('ticks','time'). Continuous aggregates = materialized views that auto-refresh. You'll be productive in 2 hours.","<b>From your experience:</b> ZeroMQ PUB/SUB = your Redis pub/sub but 10× lower latency, no broker, peer-to-peer. Your NestJS event-driven architecture maps directly. C++ publisher → Python subscribers.","<b>From your experience:</b> Your Amplitude/Adjust/Brevo marketing pipeline on Wigl = the same architecture as a financial data pipeline. Your S3/Redis health monitoring = the same as Prometheus metrics. Spend max 30 min on these.","<b>Alpaca paper trading — genuinely new:</b> Free paper trading API, identical to live. WebSocket tick subscription → signal computation → order submission → fill handling. Run for 2 weeks in parallel with Phase 7.","<b>Skip for now:</b> ML for Finance (W44), Open Source (W46). Come back to these after landing your first QD role."],"terms":["TimescaleDB","hypertable","chunk","continuous aggregate","time_bucket","kdb+","q language","columnar storage","time-range partition","ZeroMQ","PUB/SUB","PUSH/PULL","Kafka","topic","consumer group","offset","FlatBuffers","Protobuf","backpressure","serialization","multi-stage build","docker-compose","named volume","GitHub Actions","Google Test","ctest","pytest","CI/CD","environment parity","pinned versions","feed handler","strategy engine","OMS","pre-trade risk","latency budget","kill switch","circuit breaker","event log","disaster recovery","replay","Prometheus","Grafana","counter","gauge","histogram","PromQL","alertmanager","spdlog","async logger","p99 latency","health check","feature engineering","purging","embargo","XGBoost","walk-forward","meta-labeling","feature importance","SHAP","concept drift","model drift","Alpaca","paper trading","WebSocket","asyncio","Polygon.io","exponential backoff","VADER","FinBERT","sentiment score","real-time feed","open source","good first issue","pull request","CMake","Conan","clangd","README quality","CI badge","technical blog","GitHub portfolio"],"p":"Financial Tick Data Storage System + Market Data Event Bus + Containerized Quant System with CI + Trading System Architecture Doc + Skeleton + Real-Time Trading Dashboard + Production ML Alpha Signal + Live Paper Trading Bot + Open Source PR + 2 Blog Posts","pd":"Submit a real PR to QuantLib or Backtrader: bug fix, documentation improvement, or test coverage addition. Write 2 blog posts: (1) technical deep-dive on your most impressive project with benchmarks, (2) concept explainer on something you now understand deeply.","deliverables":["<b>Time Series Databases:</b>","docker-compose.yml starting TimescaleDB with health check","Continuous aggregate verified: matches manually computed OHLCV","Query benchmark: hypertable vs regular PG table — report timing for 252-day OHLCV fetch","<b>Message Queues & Event-Driven Systems:</b>","C++ publisher verified at 100k ticks/sec with message counter","All 3 Python subscribers processing concurrently without blocking each other","End-to-end latency: timestamp in msg → received in subscriber → report p50 and p99","<b>Docker & CI/CD for Quant Systems:</b>","docker-compose up starts full system in one command","GitHub Actions: green badge passing C++ and Python tests","5+ Google Test unit tests + 5+ pytest tests all passing in CI","<b>Trading System Architecture:</b>","Architecture doc: Mermaid diagram + data flow + latency budget table","Skeleton code: 5 C++ classes with clear public interfaces and docstrings","Kill switch: global std::atomic<bool> checked at start of every hot-path function","<b>Monitoring & Observability:</b>","Prometheus /metrics endpoint serving all 3 metric types","Grafana dashboard: PnL line, position table, latency histogram with percentile lines","Alert rule that fires in Grafana when p99 exceeds configurable threshold","<b>Machine Learning for Quant Dev:</b>","15+ features verified for no lookahead bias with a time-shift audit","XGBoost with purged walk-forward — NOT standard k-fold (document why)","Feature importance bar chart (top 10 by gain) — what drives the signal?","<b>Alternative Data & Live Trading APIs:</b>","WebSocket handler that auto-reconnects on disconnect with exponential backoff","Trade log CSV: timestamp, symbol, side, qty, fill_price, running_pnl","Risk checks enforced: max position and daily loss limit tested with intentional violations","<b>Open Source & Technical Presence:</b>","PR submitted (and ideally reviewed/merged) on a public quant library","Blog post 1: project write-up with benchmark numbers (pricings/sec, µs latencies)","Blog post 2: concept explainer — shows you understand deeply, not just implemented"],"r":["🌐 docs.timescale.com — comprehensive docs (your PG knowledge applies)","🌐 code.kx.com/q4m3/ — kdb+/q for Beginners (free online book)","📺 TimescaleDB official YouTube channel — getting started tutorials","🌐 zguide.zeromq.org — ZeroMQ Guide (free, read Ch.1–3)","🌐 confluent.io/docs — Kafka documentation","📺 'ZeroMQ in Practice' (YouTube, search title)","🌐 docs.docker.com/build/building/multi-stage/","🌐 docs.github.com/en/actions","📺 Docker multi-stage C++ builds (YouTube, search title)","📺 CppCon 2017: 'Trading at Scale' talks (YouTube)","📖 Building Low Latency Applications with C++ – Sourav Ghosh","📄 Jane Street tech blog: blog.janestreet.com (real insights into trading systems)","🌐 prometheus.io/docs — comprehensive","🌐 grafana.com/docs","🌐 github.com/jupp0r/prometheus-cpp — C++ Prometheus client","📖 Advances in Financial ML – Marcos López de Prado, Ch.6–8 (essential)","🌐 XGBoost docs: xgboost.readthedocs.io","🌐 mlfinlab docs: mlfinlab.readthedocs.io (purged CV implementation)","🌐 docs.alpaca.markets — complete API reference","🌐 polygon.io/docs — historical + real-time data","📺 Alpaca official YouTube – 'Algorithmic Trading with Alpaca' series","🌐 github.com/lballabio/QuantLib — start with Issues → good first issue","🌐 github.com/mementum/backtrader","🌐 pages.github.com — free blog hosting via GitHub Pages"]},{"w":21,"title":"Capstone — Production Trading System Portfolio","t":["<b style='color:var(--pc)'>📋 Week note: You have two major portfolio pieces already: the C++23 pricing engine (Week 15) and paper trading bot (Week 20). This week: polish both, write the research paper replication, and make your GitHub look like a senior QD's portfolio.</b>","<b style='color:var(--pc)'>── Capstone I — Python Trading System ──</b>","Architecture: DataLayer (TimescaleDB / Parquet) → FeatureEngine (OHLCV + microstructure signals) → RiskEngine (position limits, max loss, vol-targeting sizing) → ExecutionLayer (Alpaca paper orders) → ReportingLayer (Grafana + CSV log).","Vol-targeting position sizing: target_vol = 0.10 (10% annual vol). position_size = (target_vol / realized_21d_vol) × capital / price. Naturally scales back during high-vol regimes (COVID, 2022). Industry standard for systematic funds.","Pre-live checklist before starting paper trading: (1) kill switch tested, (2) position limits tested, (3) daily loss limit tested, (4) reconnection logic tested, (5) logging verified. If any fail: do not start. An untested system is a dangerous system.","Monitoring: Prometheus metrics running live. Alerts configured: PnL < −2% daily → halt. Heartbeat missing > 30s → alert. Grafana dashboard open during trading hours. Log every decision with microsecond timestamps.","Performance tracking: document daily — # trades, avg slippage (filled price vs signal price), cumulative Sharpe. After 2 weeks: compare live Sharpe to backtested Sharpe. Large divergence = backtest error. Small divergence = implementation quality.","<b style='color:var(--pc)'>── Capstone II — C++23 Event-Driven System ──</b>","Integration: UDP receiver (W35) → SPSC ring buffer (W34) → strategy thread → risk check (W26) → FIX order sender (W37) → fill handler → position updater → PnL calculator. Each stage on a dedicated CPU-pinned thread.","End-to-end latency profiling: instrument each stage with RDTSC or clock_gettime(CLOCK_MONOTONIC). Record timestamps: tick_received, strategy_done, risk_done, fix_sent. Log all 4 per tick. Build a latency breakdown histogram.","Stress testing: load generator sends 1M ticks/sec. Monitor: CPU usage, RSS memory (check for leaks with valgrind massif), fill throughput, p99 latency. Must be stable for 1 hour. Memory must not grow over time.","Error injection: drop 1% of UDP packets (skip sending some). Reject 5% of orders via FIX (send back Rejected ER). Send 1 malformed message. System must handle all gracefully: no crash, no stuck state, no position corruption.","GitHub repo quality: README with (1) architecture Mermaid diagram, (2) build instructions (cmake + conan), (3) benchmark results in a table, (4) test instructions. This repo is your most impressive interview artifact.","<b style='color:var(--pc)'>── Capstone III — R
